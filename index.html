tro":"寫程式、做網站、接案時容易觸犯的刑事與民事責任。","order":22,"group":"work","status":"planned"},{"id":"legal-safety","title":"別把自己搭進去：法律與財產安全","title_en":"Protecting Yourself Legally","intro":"日常糾紛裡保護自己的法律工具與期限，別因不懂程序而吃虧。","order":23,"group":"law","status":"planned"},{"id":"legal-redlines","title":"普通人容易踩的法律紅線","title_en":"Everyday Legal Red Lines","intro":"一般人可能不知不覺觸犯的刑事與行政罰規定。","order":24,"group":"law","status":"planned"},{"id":"renting","title":"租屋","title_en":"Renting a Home","intro":"租屋前後的契約、押金、補貼與安全，房客和小房東各自的權利義務。","order":25,"group":"housing","status":"planned"},{"id":"home-buying","title":"買房","title_en":"Buying a Home","intro":"買預售屋或成屋前該查的資料、契約重點與貸款稅務。","order":26,"group":"housing","status":"planned"},{"id":"love-marriage","title":"戀愛和結婚","title_en":"Dating and Marriage","intro":"交往、結婚、離婚各階段的健康、財產與安全，以及法律怎麼保障你。","order":27,"group":"family","status":"planned"},{"id":"pregnancy","title":"懷孕和生產","title_en":"Pregnancy and Childbirth","intro":"從備孕到產後，公費產檢、孕期安全與該辦的假和給付。","order":28,"group":"family","status":"planned"},{"id":"newborn","title":"剛出生的孩子怎麼帶","title_en":"Caring for a Newborn","intro":"0–1 歲寶寶最重要的安全、疫苗與餵養重點，以及要立刻就醫的信號。","order":29,"group":"family","status":"planned"},{"id":"school-kids","title":"上學以後的孩子","title_en":"School-Age Children","intro":"學齡兒童與青少年的視力、牙齒、心理與安全，以及校園問題怎麼處理。","order":30,"group":"family","status":"planned"},{"id":"raising-kids","title":"養孩子的錢與時間","title_en":"The Cost of Raising Children","intro":"養孩子可領的津貼、可請的假，以及真實的金錢與時間成本。","order":31,"group":"family","status":"planned"},{"id":"elders","title":"家裡有長輩","title_en":"Caring for Older Family Members","intro":"長輩的法律安排、醫療決定、防詐與健康，在出事前先處理好。","order":32,"group":"family","status":"planned"},{"id":"ltc","title":"長照 2.0","title_en":"Long-Term Care 2.0","intro":"家人失能或失智時，怎麼申請長照服務、能用多少額度、要自付多少。","order":33,"group":"family","status":"planned"},{"id":"disability","title":"身心障礙之後怎麼活","title_en":"Living with Disability","intro":"取得身障證明後可用的補助、就業與教育資源，以及照顧者的支持。","order":34,"group":"family","status":"planned"},{"id":"after-death","title":"人走了以後要辦什麼","title_en":"After a Death in the Family","intro":"家人過世後要辦的證明、登記、給付、遺產與繼承，有哪些期限不能錯過。","order":35,"group":"family","status":"planned"},{"id":"travel","title":"出國旅行與境外安全","title_en":"Travel and Safety Abroad","intro":"出國前、在國外與回國時的安全、醫療、保險與入境規定。","order":36,"group":"living","status":"planned"},{"id":"study-abroad","title":"出國留學","title_en":"Studying Abroad","intro":"出國讀書前後要查的學歷認可、兵役、健保與當地身分規定。","order":37,"group":"living","status":"pending"},{"id":"time-energy","title":"別浪費時間與精力","title_en":"Saving Time and Energy","intro":"睡眠、專注、拖延與辦事效率，把時間和精力花在值得的地方。","order":38,"group":"living","status":"planned"},{"id":"leisure","title":"怎麼放鬆","title_en":"Relaxing Safely","intro":"娛樂場所與戶外活動的安全，以及有證據支持的減壓方式。","order":39,"group":"living","status":"planned"},{"id":"myths","title":"反面清單","title_en":"Things That Look Worth It but Aren't","intro":"看起來划算、但證據不支持或其實有害的常見做法。","order":40,"group":"living","status":"planned"}],"items":[{"id":"fraud-001","chapter":"fraud","title":"接到可疑的電話、訊息或投資邀約，先打 165 反詐騙諮詢專線查證","cost":{"money":"市話撥打免費；手機撥打時中華電信門號免費，其他電信每分鐘新臺幣 1 元（警政署常見問答，更新日期 2022-11-01）","time":"一通電話","effort":"低"},"plain":"覺得不對勁就先打 165 問，不用先確定是詐騙。已經被騙的人也可以直接打 165 報案，或在 165 全民防騙網先填好報案資料，再到分駐（派出）所完成筆錄。","benefit":"警政署說明（更新日期 2022-11-01）：165 專線可以諮詢、檢舉或報案；也可以在 165 全民防騙網「我要報案」先預製筆錄，由專責人員轉介到民眾方便前往的分駐（派出）所，接著完成筆錄。官方資料沒有提供「先打 165 能少損失多少錢」的數字，所以這裡不寫。","evidence":"A","caveats":"通話費率是警政署 2022-11-01 的說明，撥打時可能已經變動，以電信公司公告為準。網路預製筆錄之後，仍要到派出所完成手續。被騙之後要不要提告、怎麼追討款項，個案請諮詢律師或法律扶助等專業人士。","sources":[{"title":"內政部警政署常見問答：撥打165反詐騙諮詢專線需要通話費用嗎？受騙報案除可撥打165外，還有其他方式嗎？","url":"https://www.npa.gov.tw/ch/app/faq/view?module=faq&id=2144&serno=A1078837","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署 165 全民防騙網","url":"https://165.npa.gov.tw/","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-002","chapter":"fraud","title":"發現被騙就立刻報案，讓警方通知銀行圈存款項、把收款帳戶列為警示","cost":{"money":"不花錢","time":"一通電話加上到派出所做筆錄","effort":"低"},"plain":"被騙的錢不能靠私下找人追回，要第一時間報案，讓警方通報金融機構圈存可疑款項、把收款帳戶列為警示。警示帳戶裡如果還有沒被領走的錢，經警方書面通知後，銀行可以發還給被害人。信用卡或簽帳金融卡在網路上被盜刷時，消保會建議先聯絡發卡機構客服專線。","benefit":"刑事警察局（2026-01-31 公告）：民眾發現遭詐騙後，應第一時間向警方報案，警方會通報金融機構圈存可疑款項或警示帳戶；沒有透過公權力無法自行追回。《詐欺犯罪危害防制條例》（2026-01-21 修正版）第 9 條第 4 項規定司法警察機關可以通報金融機構把帳戶列為警示、暫停全部交易功能，第 10 條規定通報後的聯防與圈存。《金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法》（2026-07-20 修正版）：第 28 條，被害人在營業時間親自到銀行告知被騙，銀行請其填寫切結書並撥打 165，警察機關應於 2 小時內派員到銀行受理報案；第 30 條，銀行圈存後 48 小時內，由原通報警察機關通知列為警示或解除圈存，48 小時內沒有收到通知，銀行就逕行解除圈存；第 52、53 條，警示帳戶內還有被害人匯入且未被提領的剩餘款項時，經司法警察機關書面通知，銀行得發還給被害人，不一定要等法院判決；第 69 條，經銀行等業者認定為疑似交易糾紛或案情複雜的案件，不適用發還程序，應循司法程序。行政院消保會：信用卡或簽帳金融卡遇到網路盜刷時，先聯絡發卡機構客服專線，要求協助處理爭議款項（信用卡並可請求暫停支付），並通知網路平台取消交易，同時可向警局報案。官方資料沒有給出「幾小時內報案能追回多少」的數字，所以這裡不寫。","evidence":"A","caveats":"報案不保證拿得回錢：發還的只限帳戶裡還沒被領走的剩餘款項，款項如果已被提領或轉到境外，可能追不回。消保會也提醒，簽帳金融卡遇到網路盜刷時，因為款項是直接從帳戶扣除，可能有無法追回的風險；消保會這段說明只談網路盜刷，不涵蓋自己被騙而刷卡付款的情形。報案管道見 fraud-001（165 專線、165 全民防騙網預填筆錄、或直接到派出所）。法條可能修正，以全國法規資料庫最新條文為準。個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"刑事警察局公告：誤信國際律師與幣流師協追被詐款項 藥師再度遭詐百萬元（2026-01-31）","url":"https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=27a4218c-017e-4aca-93f3-097a0d05df1d","type":"官方","checked":"2026-11-22"},{"title":"全國法規資料庫：詐欺犯罪危害防制條例（修正日期 2026-01-21）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0080226","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法（修正日期 2026-07-20）第 28、30、52、53、69 條","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380271","type":"法規","checked":"2026-11-22"},{"title":"行政院消費者保護會：線上購物時，注意不同付款方式之權益保障不同","url":"https://cpc.ey.gov.tw/Page/1DCF8AA4D223F601/1a50ebaf-2998-4913-b9ec-943992fe5468","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-003","chapter":"fraud","title":"聽到「保證獲利」「穩賺不賠」，或被拉進 LINE 投資群組，就當成詐騙","cost":{"money":"不花錢","time":"查證約 10 分鐘","effort":"低"},"plain":"假投資會先讓你小賺幾筆，等你投入大量資金後再用各種理由不讓你出金。投資前先查對方是不是金管會核准的合法業者。","benefit":"刑事警察局（頁面更新 2026-11-20）：聽到「保證獲利」、「穩賺不賠」必定是詐騙；遇到加 LINE 進行投資必為詐騙；詐團常以「洗碼量不足、繳保證金、IP 異常」等理由拒絕出金。金管會（2026-02-17 新聞稿）：要求支付解凍金、保證金、驗證金或稅款才能出金是常見話術；合法證券期貨業者名單公布在官網「防範非法證券期貨業宣導專區」，也可撥證券期貨反詐欺諮詢專線 02-2737-3434 或 165 查證。","evidence":"B","caveats":"「LINE 投資群組必為詐騙」是警方依受理案件整理的提醒，不代表所有透過網路接觸的投資都違法，但合法與否一定要自己到金管會名單查。已經入金的人，不要再付任何「出金費用」，直接報案。投資本身有風險，個人投資決定請諮詢合法持牌的專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第二章 假投資","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a4f8d5ab-3d53-4d22-9411-031fddde7a4e","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：網路投資群組詐騙多，投資前先停看聽（2026-02-17）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202602130008&dtable=News","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：金管會提醒投資人勿信保證獲利等勸誘投資資訊，以避免受騙（2025-11-18）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202511180001&dtable=News","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-004","chapter":"fraud","title":"有人來電說「設定錯誤會重複扣款」要你操作 ATM 或買遊戲點數，直接掛斷","cost":{"money":"不花錢","time":"掛斷後自己查官方電話回撥，約 5 分鐘","effort":"低"},"plain":"ATM 只能提款和轉帳，不能解除分期或退款；遊戲點數也不能解除任何設定。對方就算說得出你的訂單明細，也可能是從被駭的購物網站拿到的。","benefit":"刑事警察局（頁面更新 2026-11-13）：ATM 只能「提款」與「轉帳」功能，不能解除分期付款或退款；遊戲點數只有儲值遊戲的功能，無法解除任何設定或身分識別。接到陌生來電或境外來電（開頭有 +）要提高警覺，不要因為對方能說出交易明細就相信；聽到「誤設為重複扣款」、「升級 VIP 會員」、「系統出錯」，應掛斷後自行查證或撥 165。","evidence":"B","caveats":"這是警方依受理案件整理的手法，詐團話術會變，但「要你操作 ATM、網銀或買點數來取消扣款」的模式不變。回撥時要用自己查到的官方客服電話，不要用對方給的號碼。已經轉帳的人請立刻報案；個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第三章 ATM解除分期付款詐騙","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a61af506-a4ac-49eb-9c79-ef75ddc6f237","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-005","chapter":"fraud","title":"網購不要跟賣家私下用 LINE 交易，遇到便宜得離譜的一頁式廣告先查證","cost":{"money":"不花錢","time":"下單前多查 5 分鐘","effort":"低"},"plain":"假網拍常用遠低於市價的熱門商品吸引人，再要你私下匯款；一頁式廣告則常標榜貨到付款，收到的商品卻與廣告不符、有瑕疵，甚至根本沒訂。選有第三方支付的平臺，可以保留爭議時止付的機會。","benefit":"刑事警察局（頁面更新 2026-10-22）：假網拍以明顯低於市價的價格誘引下單，並要求以 LINE 或 Messenger 私下交易，匯款後不出貨並失聯；建議透過面交或有第三方支付的網購平臺，避免私下聯繫交易，並可到經濟部網站查詢公司基本資料。行政院消費者保護會：一頁式廣告的特徵包括強調貨到付款、售價明顯低於行情、標榜 7 天鑑賞期、限時限量促銷、網址拼音奇特、出現大陸用語、未提供實體聯絡電話及地址；收到貨到付款包裹應儘速拆封驗貨，有問題聯絡寄件人或貨運業者，仍無法解決可到消保會網站線上申訴。（消保會頁面未標示日期。）","evidence":"B","caveats":"一頁式廣告不一定是詐騙，有些只是商品不符的消費糾紛，處理管道是消費申訴；若對方收錢後失聯，則屬詐騙，應報案。消保會頁面寫的「7 天鑑賞期」是賣家的宣傳話術，不是在說明法律規定。個案消費爭議可諮詢地方消費者服務中心等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第一章 假網拍詐騙","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=7e614f6f-df9b-4ae2-8293-ed384fb1a470","type":"官方","checked":"2026-11-22"},{"title":"行政院消費者保護會：「一頁式廣告」有哪些特徵？貨到付款後發現商品不符，怎麼辦？","url":"https://cpc.ey.gov.tw/Page/BC16ACF0BBB9CCC2/5922d66c-3c30-4418-8ce5-29a2f09b4185","type":"官方","checked":"2026-11-22"},{"title":"行政院消費者保護會：線上購物時，注意不同付款方式之權益保障不同","url":"https://cpc.ey.gov.tw/Page/1DCF8AA4D223F601/1a50ebaf-2998-4913-b9ec-943992fe5468","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-006","chapter":"fraud","title":"沒見過面的網友開口要錢或介紹投資，先停下來，要求視訊確認本人","cost":{"money":"不花錢","time":"一次視訊通話","effort":"低"},"plain":"假交友常盜用帥哥美女照片、假冒軍官或軍醫，培養感情後再以包裹關稅、結婚基金或投資為由要你匯款。只要網友提到錢，就先查證。","benefit":"刑事警察局（頁面更新 2026-11-20）：詐團盜用網路上的帥哥、美女照片，假冒戰地軍官、軍醫、聯合國官員，再以境外寄送包裹需要關稅、儲存結婚基金、介紹投資管道等方式要求匯款，直到被封鎖才知道受騙；建議不要向陌生網友透露太多個人資訊，網友要求匯錢時可要求開視訊確認本人身分，勿輕易交付金錢。","evidence":"B","caveats":"視訊也可能被 AI 換臉造假（見 fraud-008），所以視訊只能當成初步確認，涉及金錢時仍要多方查證。已經匯款的人可能會覺得難以啟齒，但越早報案越好。個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第四章 假愛情交友","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=064fe6c9-ae2c-40d2-a7df-2e5a4223091f","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-007","chapter":"fraud","title":"接到自稱檢警、健保局或電信公司的電話說你涉案，掛斷後自己查該單位電話回撥","cost":{"money":"不花錢","time":"一通回撥電話","effort":"低"},"plain":"假冒公務員的詐團會說你的身分被冒用、案件「偵查不公開」不能告訴家人，再傳假公文、要你「監管帳戶」。警察不會在電話中做筆錄，真的要你到案會寄通知書。","benefit":"刑事警察局（頁面更新 2026-10-22）：聽到「遭冒用身分」、「偵查不公開」、「接收法院偽造公文」、「監管帳戶」等關鍵字，就是假冒機構（公務員）詐騙；警察機關不會在電話中做筆錄；檢警調處理司法案件，會以通知書通知涉案人到案說明或至指定機關繳交款項。接到這類電話，先問對方單位、職稱、姓名，掛斷後再向該單位求證。","evidence":"B","caveats":"長輩是常見目標，可以事先和家中長輩講好「接到說涉案的電話，先掛斷打給家人或 165」。回撥時要用自己查到的機關總機，不要用對方給的電話。真的收到法院或地檢署文書而不確定真偽時，可親自向該機關查證，個案請諮詢律師等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第六章 假冒機構(公務員)","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=b7cf505d-f709-4885-b06b-d29b092ce04f","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-008","chapter":"fraud","title":"親友說換了新號碼、急著借錢，或視訊裡的臉看起來像本人，都先用舊號碼回撥確認","cost":{"money":"不花錢","time":"一通電話；和家人約定一句通關密語","effort":"低"},"plain":"「猜猜我是誰」會假冒兒女或老朋友，說換了手機，過幾天再借錢；現在還有 AI 換臉的視訊。用原本的電話回撥、問只有彼此知道的密語，可以擋下這類詐騙。","benefit":"刑事警察局（頁面更新 2026-11-20）：詐團假冒兒女、親戚或多年不見的友人，以換手機為由要你加新號碼或新 LINE，過幾天再以急用、周轉為由要求匯款；務必用舊有電話向本人確認，匯款帳戶名稱和親友本人不同時詐騙可能性大幅提高，可和親友約定專屬密語。警政署保安警察第三總隊（2024-04-01 發布）：AI 深偽可變臉成親友視訊，談到錢要存疑；可先撥親友原本的電話查證、請對方轉頭、在臉前揮手或換姿勢，看畫面是否有破綻，或請對方說出事先約定的通關密語。","evidence":"B","caveats":"AI 深偽技術進步很快，「轉頭、揮手」這類辨識方法可能會失效，最可靠的仍是用舊號碼回撥和事先約定的密語。這條特別適合幫家中長輩設定。若已經匯款，請立刻報案；個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第五章 猜猜我是誰","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=4f04dab6-3ca5-4139-a94e-66be03b62ba3","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署保安警察第三總隊防詐專區：AI 深偽技術變臉成親朋好友跟你視訊，如何分辨？","url":"https://www.3spc.npa.gov.tw/ch/app/data/view?module=govinfo&id=18710&serno=c059600e-9d0a-4d29-b1be-86ffec18502a","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-009","chapter":"fraud","title":"求職時被要求交出存摺、提款卡或網銀密碼，或先繳保證金、訓練費，就是詐騙","cost":{"money":"不花錢","time":"面試前查證公司，約 15 分鐘","effort":"低"},"plain":"假求職會用「設定薪資轉帳」騙走你的帳戶，或先收各種費用；境外高薪工作則可能讓人被拘禁、被迫做詐騙。查證公司、告訴家人行蹤，可以避免人財兩失，也避免帳戶被拿去收贓款而惹上官司。","benefit":"刑事警察局（頁面更新 2026-10-08）：假求職以設定薪資轉帳為名騙取金融帳戶及密碼，或向應徵者收取訂金、保證金、治裝費、訓練費；境外高薪工作的被害人可能被拘禁，帳戶被用來收詐騙款；合法公司不會以私人帳號發訊息徵才，切勿依指示申辦約定帳戶或交出網銀帳密；在國外遇急難可撥急難救助電話 0800-085095。保安警察第三總隊（2025-02-17 發布）：高薪海外工作的騙局會誘騙民眾前往泰國、緬甸、柬埔寨等地，建議查證徵才公司是否合法立案、確認工作地點與內容、隨時告知國內親友行蹤。","evidence":"B","caveats":"因求職把帳戶交給別人，事後帳戶被列為警示時，要等案件裁判確定後才能解除（見 fraud-011），還可能觸犯《洗錢防制法》（見 fraud-010）。勞動條件與契約問題可諮詢地方勞工局，法律個案請諮詢律師等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第七章 假求職","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=87a85079-c42f-48cb-9506-14e08c912a39","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署保安警察第三總隊防詐專區：當心海外高薪工作、旅遊機會之詐騙陷阱","url":"https://www.3spc.npa.gov.tw/ch/app/data/view?module=govinfo&id=18710&serno=4884ecef-38ff-46b2-8420-d55c23e03d62","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-010","chapter":"fraud","title":"不要把帳戶、提款卡或網銀帳密借給別人，就算對方給錢或說是正當用途","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"把自己的帳戶交給別人用是違法的。第一次可能被警察「告誡」，但只要有約定或收受報酬、交出 3 個以上帳戶，或 5 年內再犯，就可能被判處 3 年以下有期徒刑等刑罰；名下現有帳戶和之後要開的新帳戶，也會被限制使用。","benefit":"《洗錢防制法》（2024-07-31 修正版）第 22 條：任何人不得將自己或他人的金融帳戶、虛擬資產或第三方支付帳號交付、提供給他人使用（符合一般商業、金融交易習慣，或基於親友間信賴關係等正當理由者除外）；違反者由警察機關裁處告誡；有期約或收受對價、交付提供帳戶合計 3 個以上、或經告誡後 5 年內再犯之一者，處 3 年以下有期徒刑、拘役或科或併科新臺幣 100 萬元以下罰金；金融機構等應在一定期間內暫停、限制或關閉違反者已開立或欲開立的新帳戶功能。","evidence":"A","caveats":"這條處罰的是「無正當理由交付帳戶」本身；如果帳戶被拿去收詐騙款，還可能另涉詐欺或洗錢的共犯責任，刑責更重。「正當理由」的範圍要依個案判斷。法條可能修正，以全國法規資料庫最新條文為準。已經交出帳戶的人，請儘快報案並諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"全國法規資料庫：洗錢防制法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380131","type":"法規","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-011","chapter":"fraud","title":"帳戶被列為警示，先弄清楚期限與解除條件，再向權責警察機關申請","cost":{"money":"不花錢；可能要申請聯徵紀錄或判決書","time":"備齊文件後親自到警察機關一次","effort":"中"},"plain":"帳戶被列警示後，所有交易都會停止，你名下其他帳戶也會被限制網銀與提款卡功能。警示 2 年後會自動失效，但想提早解除，要拿出不起訴、無罪等證明，親自到權責警察機關申請。","benefit":"《存款帳戶及其疑似不法或顯屬異常交易管理辦法》（2026-08-31 修正版）：第 3 條定義警示帳戶與衍生管制帳戶（警示帳戶開戶人名下的其他帳戶）；第 5 條規定警示帳戶暫停全部交易功能，衍生管制帳戶暫停提款卡、語音轉帳、網路轉帳及其他電子支付功能，兩種帳戶的匯入款都會退回匯款銀行；第 9 條規定警示期限自通報時起算，逾 2 年自動失效，必要時可延長一次、以 1 年為限。刑事警察局常見問答（2021-10-12 發布）：除期滿自動解除外，可下載「民眾解除警示帳戶申請書」（2021-10-15 起適用），填寫一式二份並攜帶證明文件，親赴權責警察機關辦理。申請書填寫說明：因求職、代辦貸款、租借帳戶等原因把帳戶交給他人而遭警示者，要等案件裁判確定後才能解除。","evidence":"A","caveats":"依申請書填寫說明，被冒名開戶的人申請時需附身分證件與金融聯合徵信中心的信用報告。依上述管理辦法第 11 條，2025 年 4 月 1 日以後通報的警示帳戶，帳戶內剩餘款項的發還改依《金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法》辦理；警示期限與解除程序仍依上述管理辦法。實際處理方式以銀行或警察機關的說明為準。法規可能修正，以全國法規資料庫最新條文為準。帳戶被警示通常代表也可能被追查刑責，個案請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"全國法規資料庫：存款帳戶及其疑似不法或顯屬異常交易管理辦法（修正日期 2026-08-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380199","type":"法規","checked":"2026-11-22"},{"title":"內政部警政署刑事警察局常見問答：如何解除警示帳戶？","url":"https://www.cib.npa.gov.tw/ch/app/faq/view?module=faq&id=18233&serno=8eefc13f-6bf6-4532-b1ac-154167fe59d9","type":"官方","checked":"2026-11-22"},{"title":"刑事警察局：民眾解除警示帳戶申請書與填寫說明（2021-10-15 起適用）","url":"https://www.cib.npa.gov.tw/ch/app/data/doc?module=wg138&detailNo=1351096472531111936&type=s","type":"官方","checked":"2026-11-22"},{"title":"全國法規資料庫：金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法（修正日期 2026-07-20）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380271","type":"法規","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-012","chapter":"fraud","title":"不確定 LINE ID、網站或電話是不是詐騙，先上 165 全民防騙網或 165 LINE 官方帳號查詢","cost":{"money":"不花錢","time":"查詢約 1 分鐘","effort":"低"},"plain":"165 全民防騙網首頁的搜尋欄可以查境外帳戶、詐騙 LINE ID、假投資（博弈）網站、詐騙電話和高風險賣場。查到有紀錄就不要再聯絡。","benefit":"警政署保安警察第七總隊（2022-11-28 發布）：165 全民防騙網自 2022-11-21 起在首頁增設搜尋欄，可即時查詢境外帳戶、詐騙 LINE ID、假投資（博弈）網站、詐騙電話及高風險賣場等涉詐資訊。刑事警察局（頁面更新 2026-11-20）：「165防騙宣導」LINE 官方帳號及 165 全民防騙網可查詢詐騙 LINE ID、假投資（博弈）網站及詐騙電話。","evidence":"A","caveats":"查不到紀錄不代表安全：資料庫只收錄已經被通報的資料，詐團會不斷換新帳號與網址。查到可疑但還沒有紀錄的，可以打 165 諮詢。已經受騙的人，查詢不能取代報案；個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署保安警察第七總隊：165全民防騙網新增境外帳戶、詐騙LINE ID、假投資（博弈）網站、詐騙電話及高風險賣場等資料線上查詢功能（2022-11-28）","url":"https://www.7spc.npa.gov.tw/ch/app/news/view?module=news&id=2705&serno=4f1be6f9-3b4c-400f-a69d-ffd5c9945e04","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第二章 假投資","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a4f8d5ab-3d53-4d22-9411-031fddde7a4e","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署 165 全民防騙網","url":"https://165.npa.gov.tw/","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-013","chapter":"fraud","title":"自稱政府機關的簡訊，先看是不是從「111」發出、開頭有沒有你的手機末 3 碼和機關名稱","cost":{"money":"不花錢","time":"看一眼","effort":"低"},"plain":"政府機關透過「111」短碼發簡訊，只有加入平臺的機關能用這個號碼。從其他號碼發來、說你要繳費或補稅的「政府簡訊」，就要先查證。","benefit":"數位發展部（2023-10-24 新聞稿）：111 政府簡訊平臺當天啟用，只有透過此平臺的政府機關才可以使用 111 短碼發簡訊，民眾認明 111 短碼即可確認簡訊來自政府機關。數位發展部（2024-01-31 新聞稿）：111 簡訊內容必須署名發送機關或服務名稱，含網址時優先使用 gov.tw 網域。數位發展部（2025-06-17 新聞稿）：自 2025 年 6 月起，111 簡訊開頭新增接收者手機號碼末 3 碼及機關名稱，搭配來源號碼形成三層辨識。","evidence":"A","caveats":"官方資料沒有說所有政府簡訊都已改用 111，所以「不是 111 發的」不一定是假的，但這種簡訊更要用機關官網或總機查證，不要直接點簡訊裡的連結；涉及付款時，自己登入機關官方網站處理。帳號與個資相關爭議，個案請諮詢專業人士。","sources":[{"title":"數位發展部新聞稿：蔡總統啟動111政府簡訊平臺 數位部推動數位信任科技從源頭防詐（2023-10-24）","url":"https://moda.gov.tw/press/press-releases/8607","type":"官方","checked":"2026-11-22"},{"title":"數位發展部新聞稿：111政府簡訊已發逾400萬則 30機關響應降低民眾受詐風險（2024-01-31）","url":"https://moda.gov.tw/press/press-releases/10531","type":"官方","checked":"2026-11-22"},{"title":"數位發展部新聞稿：政府111簡訊防詐再升級 新增手機末三碼、機關具名辨識標記（2025-06-17）","url":"https://moda.gov.tw/press/press-releases/16458","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-014","chapter":"fraud","title":"網路貸款廣告要你「美化帳戶」「包裝金流」或先付代辦費，就是詐騙","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"缺錢時看到「保證核貸、信用不良可辦」的廣告，對方會說要先美化帳戶，騙你交出網銀帳密，再拿你的帳戶收贓款。結果借不到錢，名下所有帳戶還被列為警示。","benefit":"刑事警察局（2026-08-08 公告）：IG、FB 上的貸款廣告以「保證核貸、信用不良可辦」吸引民眾加 LINE，再稱需要先進行「帳戶美化」或「金流包裝」，要求提供網銀使用者代碼、密碼；案例中被害人名下所有金融帳戶均被列為警示帳戶與衍生管制帳戶。警方提醒：不要將金融卡、存摺、網銀帳號密碼或驗證碼交付他人，任何宣稱能美化帳戶、包裝金流或要求預先轉帳手續費、代辦費的信貸廣告，都極有可能是詐騙；有疑問撥 165 或 110。","evidence":"B","caveats":"因「代辦貸款」交出帳戶而被警示的人，依刑事警察局解除警示申請書的說明，要等案件裁判確定後才能解除（見 fraud-011），也可能涉及《洗錢防制法》第 22 條（見 fraud-010）。債務與法律個案請諮詢法律扶助基金會等專業人士。","sources":[{"title":"刑事警察局公告：網路找貸款？我來幫你「美化帳戶」缺錢調頭寸反被當成洗錢人頭戶（2026-08-08）","url":"https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=1812d90c-16f4-407c-acc2-047ef1514f2d","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-015","chapter":"fraud","title":"被騙後有「律師」「幣流分析師」說能幫你追回款項，不要相信，也不要再付錢","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"詐團會盯上已經被騙的人，假冒律師或追款專家，再騙一次。被騙的錢只能透過警方報案和法定程序追討，沒有人能私下「駭回來」或「贏回來」。","benefit":"刑事警察局（2026-01-31 公告）：案例中假投資被害人又被自稱國際律師、幣流分析師的人騙，對方稱可操縱博弈 App 後臺「贏回」款項，並煽動被害人抵押房地產加碼，再度被騙百萬元。警方提醒：千萬不要相信自稱可以協助追回詐騙款項的律師或幣流分析師；律師只能擔任訴訟代理人與檢、警和法院溝通；沒有透過公權力無法自行追回，應第一時間向警方報案，判決有罪才有可能追回詐騙款項。另依《金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法》（2026-07-20 修正版）第 52、53 條，警示帳戶內還有被害人匯入且未被提領的剩餘款項時，經司法警察機關書面通知，銀行得發還給被害人，被害人要附身分證明文件、司法警察機關開具的受（處）理案件證明單和切結書，不一定要等判決；第 69 條規定，經銀行等業者認定為疑似交易糾紛或案情複雜的案件，不適用發還程序，應循司法程序。","evidence":"B","caveats":"依刑事警察局說明，律師只能擔任訴訟代理人與檢、警和法院溝通，不能繞過司法程序把錢追回來。《詐欺犯罪危害防制條例》另有被害人法律扶助、調解，以及暫免繳納訴訟費用與執行費的規定，個案請諮詢法律扶助基金會等專業人士。","sources":[{"title":"刑事警察局公告：誤信國際律師與幣流師協追被詐款項 藥師再度遭詐百萬元（2026-01-31）","url":"https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=27a4218c-017e-4aca-93f3-097a0d05df1d","type":"官方","checked":"2026-11-22"},{"title":"全國法規資料庫：詐欺犯罪危害防制條例（修正日期 2026-01-21）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0080226","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法（修正日期 2026-07-20）第 52、53、69 條","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380271","type":"法規","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-016","chapter":"fraud","title":"有人叫你買虛擬貨幣來投資、繳費或「解凍」，先查對方是不是金管會公告完成洗錢防制登記的業者","cost":{"money":"不花錢","time":"查名單約 5 分鐘","effort":"低"},"plain":"假投資詐團常以虛擬通貨為名義吸引民眾（刑事警察局「假投資」一章）。在台灣合法提供虛擬資產服務的業者要向金管會完成洗錢防制登記，而且不能收現金。","benefit":"金管會（2025-09-22 新聞稿）：依 2024-11-30 施行的《洗錢防制法》新制，提供虛擬資產服務的業者應先向金管會完成洗錢防制登記，舊制業者須在 2025 年 9 月底前完成登記才能繼續營業；名單公布在證期局網站。證期局「提供虛擬資產服務之事業或人員」頁面（名單 2026-10-28 更新）列出 11 家已完成洗錢防制登記的業者。金管會（2026-02-17 新聞稿）：合法虛擬資產服務商不得以現金向客戶收取款項，須以可留存金流軌跡的轉帳方式進行。","evidence":"A","caveats":"名單上的業者合法，不代表虛擬資產投資沒有風險，也不代表叫你去該平臺買幣再轉出的人是可信的；只要是陌生人或網友指示你買幣轉給他，就應先停下來打 165。11 家是證期局 2026-10-28 名單的數字，請以證期局最新名單為準。投資決定請諮詢合法持牌的專業人士。","sources":[{"title":"金管會證券期貨局：提供虛擬資產服務之事業或人員（名單 2026-10-28 更新）","url":"https://www.sfb.gov.tw/ch/home.jsp?id=1053&parentpath=0,8","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：金管會公告完成洗錢防制登記之提供虛擬資產服務之事業或人員名單（2025-09-22）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202509220001&dtable=News","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：網路投資群組詐騙多，投資前先停看聽（2026-02-17）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202602130008&dtable=News","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第二章 假投資","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a4f8d5ab-3d53-4d22-9411-031fddde7a4e","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-017","chapter":"fraud","title":"別接「幫忙領錢、收包裹、轉帳」的工作，當車手或提供帳戶都可能被判刑","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"幫詐騙集團取款、轉帳的「車手」，或把帳戶交出去讓人收錢，都可能吃上官司。拒絕來路不明的「輕鬆工作」，就能避開刑責、前科和帳戶被限制。","benefit":"《中華民國刑法》第 339-4 條（全國法規資料庫現行條文，2026-11-22 查證）：犯詐欺罪而有冒用政府機關或公務員名義、三人以上共同犯之、以網際網路等傳播工具對公眾散布、或以電腦合成等科技方法製作他人不實影像聲音之一者，處 1 年以上 7 年以下有期徒刑，得併科 100 萬元以下罰金，未遂犯也罰。《詐欺犯罪危害防制條例》第 43 條（全國法規資料庫現行條文，2026-11-22 查證）：犯刑法第 339-4 條之罪，使人交付的財物或財產上利益達新臺幣 100 萬元者，處 3 年以上 10 年以下有期徒刑，得併科 3,000 萬元以下罰金；達 1,000 萬元者，處 5 年以上 12 年以下有期徒刑，得併科 3 億元以下罰金；達 1 億元者，處 7 年以上有期徒刑，得併科 5 億元以下罰金。《洗錢防制法》（2024-07-31 修正版）第 22 條：無正當理由把帳戶交給他人使用，先由警察裁處告誡；有期約或收受對價、交付 3 個以上帳戶、或 5 年內再犯之一者，處 3 年以下有期徒刑、拘役或科或併科 100 萬元以下罰金（詳見 fraud-010）。","evidence":"A","caveats":"車手實際會依哪一條、哪個刑度處罰，要看是否知情、參與程度、詐騙金額與人數等個案事實，由法院判斷，這裡只列出法條本身。第 22 條另規定警察裁處告誡時，若知道當事人有社會救助需要，要通報社福機關協助。法條可能修正，以全國法規資料庫最新條文為準。已經被找去當車手或交出帳戶的人，請儘快諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"全國法規資料庫：中華民國刑法第 339-4 條","url":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=C0000001&flno=339-4","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：洗錢防制法第 22 條","url":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=G0380131&flno=22","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：詐欺犯罪危害防制條例第 43 條","url":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=D0080226&flno=43","type":"法規","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"labor-001","chapter":"labor","title":"加班後可以選補休，但補休到期沒休完，雇主要照加班當天的標準付加班費","cost":{"money":"不花錢","time":"確認公司約定的特休年度和自己的補休紀錄，約 10 分鐘","effort":"低"},"plain":"加班要換補休還是領加班費，要你自己願意、雇主也同意才算，雇主不能片面規定只能補休。補休到期或離職時還沒休完的時數，雇主要換算成加班費付給你。","benefit":"勞動部說明（「加班補休規定」更新日期 2024-12-31；「勞動基準法權益簡介」更新日期 2026-01-01）：平日延長工時前 2 小時加給 1/3 以上，再延長 2 小時加給 2/3 以上；休息日出勤前 2 小時另再加給 1又1/3，第 3 至 8 小時另再加給 1又2/3，第 9 至 12 小時另再加給 2又2/3。補休最晚要在勞雇雙方約定的特別休假年度末日前休完，不能再往後延；沒休完的時數，依加班當天的工資計算標準發給工資。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工，自己的工作適不適用，可以問勞動部或地方勞工局。補休期限以勞雇雙方約定的特休年度為準（曆年制、週年制等）。法令可能修正，以全國法規資料庫的最新條文為準。和雇主有爭議時，個案請諮詢地方勞工局或律師。","sources":[{"title":"勞動部：加班補休規定","url":"https://www.mol.gov.tw/1607/28162/28166/28180/28198/28202/47031/post","type":"官方","checked":"2026-11-21"},{"title":"勞動部：勞動基準法權益簡介","url":"https://www.mol.gov.tw/1607/28162/28166/28168/28170/28989/post","type":"官方","checked":"2026-11-21"}],"status":"draft","updated":"2026-11-21"},{"id":"free-health-001","chapter":"free-health","title":"30 歲以後定期做公費成人健檢：30–39 歲每 5 年 1 次、40–64 歲每 3 年 1 次、65 歲以上每年 1 次","cost":{"money":"檢查費由國民健康署補助（2025 年起每案補助院所 880 元）；掛號費等其他費用來源未說明，請先問院所","time":"抽血、驗尿與身體檢查約半天，另需回診看報告","effort":"低"},"plain":"成人健檢會查血壓、血糖、血脂、腎功能、肝功能和身體質量指數，能在還沒有症狀時發現三高等慢性病的徵兆。","benefit":"國民健康署成人預防保健說明頁：30 歲以上未滿 40 歲每 5 年 1 次、40 歲以上未滿 65 歲每 3 年 1 次；55 歲以上原住民、罹患小兒麻痺且年在 35 歲以上者、65 歲以上民眾每年 1 次。30–39 歲的資格自 2025 年（民國 114 年）1 月 1 日起實施（國健署 2025-01-14、2025-12-18 新聞稿）。國健署 2023-10-03 更新的文章指出，40 歲以上自述無三高相關疾病的民眾，接受成人健檢後新發現血脂、血壓、血糖任一項異常者達四分之一。","evidence":"A","caveats":"已經確診三高或其他慢性病、正在固定追蹤的人，檢查項目和頻率請和主治醫師討論，追蹤治療屬 chronic-illness 章（詳見「得了慢性病之後」章）。符合資格的年齡以國健署公告的計算方式為準，可先向提供成人預防保健服務的醫療院所查詢。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：成人預防保健（服務說明頁）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=189","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：成人預防保健升級 30歲開啟健康檢查新里程（2025-01-14 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4878&pid=18755","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：成人預防保健服務下修至30歲 逾30萬青年受惠（2025-12-18 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4878&pid=19707","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：成人健檢關鍵兩步驟 定期篩檢、回診追蹤（2023-08-16 發布，2023-10-03 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4705&pid=17408","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-002","chapter":"free-health","title":"民國 75 年以前出生的人，可以做一次公費 B、C 型肝炎篩檢","cost":{"money":"檢查費由國民健康署補助；掛號費等其他費用來源未說明，請先問院所","time":"抽血一次，可搭配成人健檢，免空腹","effort":"低"},"plain":"抽一次血就能知道自己有沒有 B、C 型肝炎；C 型肝炎藥物由健保全額給付，國健署資料指出治癒率近 99%。","benefit":"國民健康署（2025-12-15 更新）：B、C 型肝炎篩檢自 2020 年（民國 109 年）9 月 28 日起為 45 歲至 79 歲（原住民 40 歲至 79 歲）終身一次，2025 年（民國 114 年）8 月 1 日起擴大到民國 75 年（含）以前出生、未滿 45 歲者。成人預防保健說明頁寫的是「民國75年次以前出生至79歲，可搭配成人預防保健服務終身接受1次檢查」。國健署 2025-06-16 新聞稿：抽血檢驗免空腹；C 肝藥物近 20 萬元由健保署全額給付，治癒率近 99%。","evidence":"A","caveats":"終身只補助一次，做過的人不能再用公費做。結果陽性（帶原或感染）的人要定期追蹤或治療，帶原追蹤屬 chronic-illness 章（詳見「得了慢性病之後」章）。可在健康存摺或向院所查詢自己是否已經做過。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：成人預防保健服務B、C型肝炎篩檢（2021-01-19 發布，2025-12-15 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=1115&pid=13580","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：成人預防保健（服務說明頁）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=189","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：B、C肝篩檢免空腹 45-79歲民眾近7成已接受檢查！（2025-06-16 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4878&pid=19145","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-003","chapter":"free-health","title":"25 歲以上女性定期做公費子宮頸抹片，建議至少每 3 年 1 次","cost":{"money":"檢查費由國民健康署補助（2025 年起每案補助 630 元）；其他費用請先問院所","time":"門診檢查約 10–20 分鐘","effort":"低"},"plain":"國健署資料指出，子宮頸抹片篩檢可以降低約 70% 子宮頸癌死亡率。","benefit":"國民健康署（2025-05-15、2025-12-30 新聞稿）：25 歲至 29 歲婦女每 3 年 1 次、30 歲以上婦女每年 1 次子宮頸抹片檢查，建議 25 歲以上婦女每 3 年至少檢查 1 次；25–29 歲自 2025 年（民國 114 年）起增列。國健署 2025-12-30 新聞稿：可降低約 70% 子宮頸癌死亡率。","evidence":"A","caveats":"沒有性經驗的人是否需要做，請先問醫師。月經期間、已切除子宮的人，請先和醫師確認是否適合或需要。有不正常出血等症狀應直接就醫，不必等篩檢。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：擴大推動五癌篩檢 攜手共創你我健康（2025-05-15 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4878&pid=19088","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：公布112年國人癌症登記資料分析結果 守護健康未來 從癌症篩檢開始（2025-12-30 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4878&pid=19734","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：健康臺灣-114年起擴大癌症篩檢 您的健康政府來顧（2024-12-24 發布，2025-05-13 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4809&pid=18712","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-004","chapter":"free-health","title":"35、45、65 歲那一年的女性，可以做一次公費 HPV 檢測","cost":{"money":"檢測費由國民健康署補助（2025 年起每案補助 1,400 元）；其他費用請先問院所","time":"門診採檢一次","effort":"低"},"plain":"人類乳突病毒（HPV）是子宮頸癌的主要相關病毒，檢測可以和子宮頸抹片互相搭配。","benefit":"國民健康署（2024-12-24 發布、2025-05-13 更新）：2025 年（民國 114 年）1 月 1 日起，新增 35、45、65 歲女性當年度 1 次人類乳突病毒（HPV）檢測服務，每案補助 1,400 元。國健署 2025-05-15 新聞稿同樣列出「35歲、45歲、65歲女性人類乳突病毒（HPV）檢測服務」。","evidence":"A","caveats":"只限該年齡的那一年度，錯過就要等下一個年齡點。檢測結果陽性不等於罹癌，後續要做什麼檢查請依醫師安排。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：健康臺灣-114年起擴大癌症篩檢 您的健康政府來顧（2024-12-24 發布，2025-05-13 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4809&pid=18712","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：擴大推動五癌篩檢 攜手共創你我健康（2025-05-15 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4878&pid=19088","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-005","chapter":"free-health","title":"40–74 歲女性每 2 年做一次公費乳房 X 光攝影","cost":{"money":"檢查費由國民健康署補助（2025 年起每案補助 1,245 元）；其他費用請先問院所","time":"檢查本身數分鐘，含等候約 1 小時","effort":"低"},"plain":"國健署資料指出，定期做乳房 X 光攝影可以降低乳癌死亡率與晚期乳癌發生率。","benefit":"國民健康署癌症篩檢說明頁：乳房 X 光攝影檢查，40 歲至 74 歲婦女，每 2 年 1 次；40–44 歲與 70–74 歲自 2025 年（民國 114 年）起納入。國健署 2025-12-30 新聞稿：每 2 年 1 次乳房檢查可降低 41% 乳癌死亡率，並可減少 30% 的晚期乳癌發生率。","evidence":"A","caveats":"懷孕或哺乳中、有乳房植入物的人，請先告知醫師或放射師。摸到腫塊、乳頭異常分泌等症狀應直接就醫，不必等篩檢。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：癌症篩檢介紹（乳癌、子宮頸癌、大腸癌、口腔癌、肺癌）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=211","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：公布112年國人癌症登記資料分析結果 守護健康未來 從癌症篩檢開始（2025-12-30 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4878&pid=19734","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：健康臺灣-114年起擴大癌症篩檢 您的健康政府來顧（2024-12-24 發布，2025-05-13 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4809&pid=18712","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-006","chapter":"free-health","title":"45–74 歲每 2 年做一次公費糞便潛血檢查，家族有大腸癌的人 40 歲起","cost":{"money":"檢查費由國民健康署補助（2025 年起每案補助 400 元）；其他費用請先問院所","time":"領採便管、在家採檢、送回院所，前後約 2 次跑院所","effort":"低"},"plain":"在家採檢糞便送驗，結果異常再做大腸鏡，可以及早發現癌前病變或早期大腸癌。","benefit":"國民健康署（2026-03-18 新聞稿）：自 2025 年（民國 114 年）起補助 45 至 74 歲者，及 40 至 44 歲有家族病史（父母、兄弟姊妹或子女曾患有大腸癌）者，每 2 年可接受一次公費糞便潛血檢查；研究指出定期篩檢可減少 34% 晚期大腸癌發生率、降低 40% 大腸癌死亡率。（國健署 2024-12-24 發布的文章寫的是降低 35%，數字依文章年份不同。）","evidence":"A","caveats":"已經有血便、排便習慣改變等症狀的人應直接就醫，不必等篩檢。用家族史資格受檢時，請先問院所需要什麼證明。檢查陽性要接受大腸鏡，見 free-health-007。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：別等晚期才驚慌！篩檢響應「大腸癌防治月」（2026-03-18 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=5020&pid=19928","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：癌症篩檢介紹（乳癌、子宮頸癌、大腸癌、口腔癌、肺癌）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=211","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：健康臺灣-114年起擴大癌症篩檢 您的健康政府來顧（2024-12-24 發布，2025-05-13 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4809&pid=18712","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-007","chapter":"free-health","title":"糞便潛血檢查陽性，要去做大腸鏡，不要拖","cost":{"money":"大腸鏡屬後續診斷，費用依健保與院所規定；來源未列出金額","time":"預約、清腸準備與檢查約 1–2 天","effort":"中"},"plain":"糞便潛血陽性不等於罹癌，但要靠大腸鏡才能確認；拖越久，發現時越可能是晚期。","benefit":"國民健康署（2026-03-18 新聞稿）：糞便潛血檢查結果為陽性者，若超過 6 個月不做大腸鏡檢查，罹癌風險會增加 30%；超過一年以上才做大腸鏡檢查，罹患晚期大腸癌的風險達 2.8 倍；如果一直未進一步接受確診檢查，大腸癌死亡風險將增加 64%。同一新聞稿：早期（第 0–1 期）5 年存活率達 9 成以上，第 4 期才就醫存活率僅 16%。","evidence":"B","caveats":"大腸鏡前的清腸與麻醉是否適合，正在服用抗凝血藥、有心臟病或腎臟病的人要先告訴醫師。大腸鏡與後續治療屬 healthcare 章（詳見「看病：少花錢少走彎路」章）。風險數字是國健署引用的統計資料，屬觀察性資料。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。","sources":[{"title":"國民健康署：別等晚期才驚慌！篩檢響應「大腸癌防治月」（2026-03-18 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=5020&pid=19928","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-008","chapter":"free-health","title":"有嚼檳榔（含已戒）或吸菸的人，30 歲起每 2 年做一次公費口腔黏膜檢查","cost":{"money":"由國民健康署補助；其他費用請先問院所","time":"醫師目視檢查口腔，門診數分鐘","effort":"低"},"plain":"由醫師檢查口腔黏膜，國健署資料指出定期檢查可以降低有嚼檳榔或吸菸習慣男性的口腔癌死亡風險。","benefit":"國民健康署癌症篩檢說明頁：口腔黏膜檢查，30 歲以上有嚼檳榔（含已戒檳榔）或吸菸者、18 歲以上有嚼檳榔（含已戒檳榔）原住民，每 2 年 1 次。國健署 2025-12-30 新聞稿：對於有嚼檳榔或吸菸習慣的男性，可降低 26% 口腔癌死亡風險。口腔健康法第 6-1 條規定，主管機關應對口腔癌高危險群提供具成本效益之口腔癌篩檢服務。","evidence":"A","caveats":"已經戒掉檳榔的人仍在補助範圍內。口腔有超過兩週不癒合的潰瘍、硬塊等症狀應直接就醫，不必等篩檢。戒菸服務見 free-health-016。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：癌症篩檢介紹（乳癌、子宮頸癌、大腸癌、口腔癌、肺癌）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=211","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：公布112年國人癌症登記資料分析結果 守護健康未來 從癌症篩檢開始（2025-12-30 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4878&pid=19734","type":"官方","checked":"2026-11-22"},{"title":"口腔健康法（全國法規資料庫，修正日期 2017-01-11）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070009","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-009","chapter":"free-health","title":"家族有肺癌或重度吸菸的人，可以每 2 年做一次公費低劑量電腦斷層（LDCT）","cost":{"money":"由國民健康署補助（2025 年起每案補助 4,000 元）；其他費用請先問院所","time":"檢查數分鐘，需先到辦理醫院預約","effort":"中"},"plain":"國健署說明頁指出，低劑量電腦斷層是目前唯一具國際實證、可以早期發現肺癌的篩檢工具。","benefit":"國民健康署 LDCT 服務說明頁：具健保身分且有下列任一肺癌風險因子者每 2 年 1 次：（一）具肺癌家族史：40 至 74 歲女性或 45 至 74 歲男性，且有血緣關係之父母、子女或兄弟姊妹經診斷為肺癌；（二）重度吸菸者：50 至 74 歲吸菸史達 20 包-年以上，仍在吸菸或戒菸未達 15 年。年齡與間隔以「年份」檢核。說明頁：可降低重度吸菸者 20% 肺癌死亡率。","evidence":"A","caveats":"依說明頁，懷孕中、過去 12 個月內胸部曾接受過電腦斷層（含 LDCT）、無法接受胸腔穿刺或手術者不適用；以家族史受檢要帶親屬的肺癌診斷證明及親屬關係證明文件；仍在吸菸的人應同意接受衛教戒菸。LDCT 有輻射暴露，也可能發現需要追蹤的小結節。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：胸部低劑量電腦斷層檢查服務（服務說明頁）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=4619","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：健康臺灣-114年起擴大癌症篩檢 您的健康政府來顧（2024-12-24 發布，2025-05-13 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4809&pid=18712","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-010","chapter":"free-health","title":"45–74 歲可以做一次公費胃幽門螺旋桿菌糞便檢測（2026 年起）","cost":{"money":"由國民健康署補助；其他費用請先問院所","time":"在家採便、送回院所","effort":"低"},"plain":"幽門螺旋桿菌感染是胃癌的主要風險因子，驗出來可以依醫囑除菌治療。","benefit":"國民健康署（2026-01-27 發布、2026-09-30 更新）：自 2026 年（民國 115 年）1 月 1 日起，全面提供 45 歲至 74 歲民眾終身 1 次公費「糞便抗原檢測胃幽門螺旋桿菌」服務；結果陽性請攜帶報告回診，依醫囑接受除菌治療或進一步檢查。國健署胃癌防治說明頁：胃癌最主要風險因子約有 8 至 9 成為幽門螺旋桿菌感染所造成。","evidence":"A","caveats":"終身只補助一次。已經有上腹痛、黑便、體重減輕等症狀的人應直接就醫，不必等篩檢。除菌治療要依醫囑把藥吃完。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：預防胃癌再升級 115年起全面推動公費「胃幽門螺旋桿菌」檢測（2026-01-27 發布，2026-09-30 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=5020&pid=19802","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：胃癌防治（服務說明頁）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=5006","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-011","chapter":"free-health","title":"符合資格的人每年秋冬打公費流感與新冠疫苗，兩種可以同時打","cost":{"money":"公費對象疫苗免費；診察費依各院所規定，來源未列出金額","time":"門診接種約 30 分鐘（含觀察）","effort":"低"},"plain":"65 歲以上、慢性病人、孕婦、幼兒等感染後較容易重症的人，每年打一次能降低重症風險。","benefit":"疾病管制署（2026-08-25 新聞稿）：115 年度（2026–2027 流感季）以 65 歲以上長者及具重症風險因子者等 10 類公費接種對象為主，除 50 至 64 歲無高風險慢性病成人於第二階段 11 月 2 日起開打，其餘如 65 歲以上長者、學齡前幼兒、醫事防疫人員、慢性病病人及學生等均自 10 月 1 日起開打；疾管署呼籲高風險對象應同時接種兩款疫苗。接種專區（2026-11-03 更新）列出孕婦、滿 6 個月以上至國小入學前幼兒、55–64 歲原住民等對象。","evidence":"A","caveats":"每類對象可接種的疫苗（流感、新冠或兩者）不同，例如國小到高中職學生只列流感；幼兒新冠疫苗的公費對象自 2026-11-05 起調整，請以接種專區的對象表為準。對疫苗成分曾有嚴重過敏、正在發燒或急性病的人請先問醫師。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"疾病管制署：115年秋冬公費首度導入加強型流感及新世代新冠疫苗（2026-08-25 發布）","url":"https://www.cdc.gov.tw/Bulletin/Detail/PdJqXvsZjg1Q5TA301JYpg?typeId=9","type":"官方","checked":"2026-11-22"},{"title":"疾病管制署：115年度左流右新護肺顧心 疫苗接種專區（接種對象表 2026-11-03 更新）","url":"https://www.cdc.gov.tw/Category/MPage/S_ZLz0yyc2lAQ9TStMB0uA","type":"官方","checked":"2026-11-22"},{"title":"疾病管制署：公費流感及新冠疫苗接種踴躍 11月2日起公費對象將開放至50歲以上成人（2026-11-03 發布）","url":"https://www.cdc.gov.tw/Bulletin/Detail/57M9H7NQtbjNyO5ygCgNiA?typeid=9","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-012","chapter":"free-health","title":"65 歲以上（原住民 55 歲以上）打一劑公費新型肺炎鏈球菌疫苗","cost":{"money":"公費對象疫苗免費；診察費依各院所規定","time":"門診接種一次","effort":"低"},"plain":"肺炎鏈球菌可能造成肺炎和侵襲性感染，2026 年起成人公費改成打一劑 20 價或 21 價疫苗就完成。","benefit":"疾病管制署（2026-07-28 新聞稿）：2026 年（民國 115 年）1 月 15 日起提供 65 歲以上長者、55–64 歲原住民及 19–64 歲侵襲性肺炎鏈球菌感染症（IPD）高風險對象接種 1 劑 PCV20，8 月 10 日起增加 PCV21 可選。從未接種過、僅接種 23 價且間隔至少 1 年、或僅接種 13 或 15 價且間隔至少 1 年者可接種；已接種「13 價（或 15 價）及 23 價各 1 劑」或 20 價、21 價者，已完整接種，無需再打。肺炎鏈球菌疫苗可與流感、新冠疫苗同時接種於不同部位。","evidence":"A","caveats":"以前打過哪幾種肺炎鏈球菌疫苗會影響能不能打、何時打，請帶接種紀錄給醫師判斷；疾管署 Q&A 另有自費接種過的人的規定。19–64 歲高風險對象的定義請看疾管署 Q&A。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"疾病管制署：成人公費肺炎鏈球菌疫苗自2026年8月10日起全面升級為20價或21價新型疫苗（2026-07-28 發布）","url":"https://www.cdc.gov.tw/Bulletin/Detail/vwMq9VkXIaV7FHyJgpk-5w?typeid=9","type":"官方","checked":"2026-11-22"},{"title":"疾病管制署：成人肺炎鏈球菌疫苗接種Q&A〔自115年8月10日(含)起適用〕（2026-08-07 更新）","url":"https://www.cdc.gov.tw/Category/QAPage/CY4qDyIrTM1YPhfOHX-76g","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-013","chapter":"free-health","title":"未滿 7 歲兒童的公費健康檢查，2026 年 7 月起增加為 9 次","cost":{"money":"由國民健康署預算支應；其他費用請先問院所","time":"每次門診檢查與衛教","effort":"低"},"plain":"未滿 7 歲兒童依年齡做公費健康檢查，2026 年 7 月起健康檢查和衛教指導合併補助。","benefit":"衛生福利部（2026-04-01 建檔，資料來源國民健康署）與國民健康署（2026-04-01 新聞稿）：自 2026 年（民國 115 年）7 月 1 日起實施「兒童預防保健服務7+2」，未滿 7 歲兒童的補助次數由 7 次調增為 9 次；原本 4–10 個月補助一次，調整為 4–6 個月和 6–12 個月各補助一次，3–7 歲的一次檢查調整成 3–5 歲及 5–7 歲各補助一次。國健署新聞稿另說明採包裹式補助，整合健康檢查與衛教指導。","evidence":"A","caveats":"國健署「兒童免費健康檢查」說明頁（www.hpa.gov.tw 預防保健專區）在 2026-11-22 查證時尚未更新，仍列 7 次的舊版時程；本條依衛福部與國健署 2026-04-01 的新制說明撰寫。新制 9 次的完整年齡區間，官方說明只列出上述兩處調整，其餘請以兒童健康手冊或院所說明為準。孩子已有發展或健康上的疑慮，請直接就醫，不必等到下一次健檢。孕期與新生兒的服務屬 pregnancy、newborn 章（詳見「懷孕和生產」「新生兒」章）。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"衛生福利部：兒童預防保健增至9次 7月1日正式上路（2026-04-01 建檔，資料來源國民健康署）","url":"https://mohw.gov.tw/cp-2704-85990-1.html","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：兒童預防保健增至9次 7月1日正式上路（2026-04-01 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=5020&pid=19967","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-014","chapter":"free-health","title":"兒童常規疫苗依疾管署時程表按時打，多數是公費","cost":{"money":"列為公費的疫苗免費；診察費依各院所規定","time":"依時程表多次門診","effort":"低"},"plain":"照疾管署時程表在建議的年齡接種，列為公費的疫苗不用自己付疫苗費。","benefit":"疾病管制署「嬰幼兒及兒童(12歲以下)」頁列出現行公費疫苗項目：B 型肝炎疫苗、卡介苗、白喉破傷風非細胞性百日咳 b 型嗜血桿菌及不活化小兒麻痺五合一疫苗、13 價結合型肺炎鏈球菌疫苗、水痘疫苗、麻疹腮腺炎德國麻疹混合疫苗、日本腦炎疫苗、季節性流感疫苗、A 型肝炎疫苗（106 年 1 月 1 日以後出生者）、白喉破傷風非細胞性百日咳及不活化小兒麻痺混合疫苗。各劑接種年齡請依疾管署公布的兒童疫苗時程表（時程表頁 2026-07-15 更新，附 PDF「現行兒童預防接種時程表_(11509版)_中文」）。","evidence":"A","caveats":"各劑接種年齡請依疾管署公布的兒童疫苗時程表（見來源的 PDF 連結）或兒童健康手冊。早產、免疫功能不全或曾對疫苗嚴重過敏的孩子，請先問醫師。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"疾病管制署：嬰幼兒及兒童(12歲以下)－現行公費疫苗項目","url":"https://www.cdc.gov.tw/Category/List/Ptfl2kjX_AWqDbkrh44r8A","type":"官方","checked":"2026-11-22"},{"title":"疾病管制署：現行兒童預防接種時程表(兒童常規疫苗)（2026-07-15 更新）","url":"https://www.cdc.gov.tw/Category/Page/TxRW-x3WzvPhvEtxM628GA","type":"官方","checked":"2026-11-22"},{"title":"疾病管制署：現行兒童預防接種時程表_(11509版)_中文（PDF）","url":"https://www.cdc.gov.tw/File/Get/XljtVSuX1ARUd1oD3yJwrg","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-015","chapter":"free-health","title":"未滿 6 歲的孩子每半年可以到牙科塗一次氟","cost":{"money":"由政府補助；掛號費等其他費用請先問院所","time":"牙科門診約 10–20 分鐘","effort":"低"},"plain":"塗氟是政府補助的兒童口腔保健服務，帶健保卡和兒童健康手冊就能到牙科做。","benefit":"衛福部口腔健康司（建檔 2022-03-29、更新 2024-09-18）：兒童牙齒塗氟 2013 年 6 月放寬至未滿 6 歲兒童，每半年補助 1 次。國健署孕產兒關懷網站：家長可攜帶 6 歲以下兒童，持健保卡及兒童健康手冊至院所施作每半年一次之牙齒塗氟（文章無日期）。口腔健康法第 8 條規定，直轄市、縣（市）主管機關應加強推展乳幼兒、幼兒、兒童及少年等對象之口腔保健措施。","evidence":"A","caveats":"低收入戶、身心障礙、原住民族地區、偏遠及離島地區兒童可能有較高頻率的補助，但能取得的是 2017 年版注意事項，本條不寫，請向牙科院所確認現行規定。國小學童臼齒窩溝封填的現行年齡條件未能確認，本條不寫。孩子已有蛀牙或牙痛請直接看牙醫。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"衛生福利部口腔健康司：未滿6歲兒童牙齒塗氟之利用情形","url":"https://dep.mohw.gov.tw/dooh/cp-6543-71337-124.html","type":"官方","checked":"2026-11-22"},{"title":"國民健康署孕產兒關懷網站：響應「世界口腔健康日」 守護孕婦嬰幼兒牙齒健康 ~刷牙打卡成習慣，造「氟」學童保健康~","url":"https://mammy.hpa.gov.tw/Home/NewsKBContent?id=988&type=00","type":"官方","checked":"2026-11-22"},{"title":"口腔健康法（全國法規資料庫，修正日期 2017-01-11）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070009","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-016","chapter":"free-health","title":"想戒菸就用公費戒菸服務，戒菸輔助藥不用部分負擔","cost":{"money":"戒菸輔助用藥自 2022 年 5 月 15 日起免收部分負擔；其他費用請先問院所","time":"每療程最多 8 週，需多次回診","effort":"中"},"plain":"有專業人員從旁協助，加上藥物與心理支持，戒菸成功率比自己戒高。","benefit":"國民健康署二代戒菸服務說明頁：具健保身份且尼古丁成癮度分數達 4 分（含）以上，或平均每天吸 10 支菸以上者可接受用藥服務；自 2022 年（民國 111 年）5 月 15 日起不分對象皆免收戒菸輔助用藥部分負擔；每年補助 2 個療程，每療程最多補助 8 週藥品，須於同一醫事機構 90 天內完成。國健署 2024-09-04 文章：自行戒菸成功率約 5%–10%，有專業協助可提高至 30%。","evidence":"A","caveats":"孕婦及 18 歲以下青少年等不適合用藥的人，依說明頁改提供戒菸衛教服務。戒菸藥物可能有副作用，有精神疾病、心臟病等病史的人請先告訴醫師。戒菸方法的其他選擇（戒菸專線等）屬 healthy-habits 章（詳見「不要慢慢死」章）。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：二代戒菸服務（服務說明頁）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=1811","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：請問戒菸服務次數與開藥週數有無限制?（2012-09-05 發布，2026-04-24 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=808&pid=4396","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：專業協助 戒菸成功率提升至少3倍（2024-09-04 發布）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=4809&pid=18384","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-017","chapter":"free-health","title":"用健保署的「健康存摺」查自己的就醫、用藥與檢驗檢查紀錄","cost":{"money":"不花錢","time":"第一次下載與認證約 10–20 分鐘","effort":"低"},"plain":"可以在手機上查到自己的就醫、用藥和檢驗檢查紀錄，回診時能拿給醫師參考。","benefit":"健保署「全民健保行動快易通│健康存摺APP」頁：健康存摺提供查詢個人就醫紀錄、手術、用藥、檢驗檢查資料、生理量測紀錄、就醫提醒、過敏、器官捐贈及安寧緩和醫療意願等。初次使用可用「行動電話認證」或「裝置碼認證」（需電腦及讀卡機，使用健保卡或自然人憑證）。","evidence":"A","caveats":"行動電話認證需使用本人申辦的月租型門號與個人行動網路，預付卡或公司門號請改用裝置碼認證。健康存摺的資料是給自己參考，不能取代醫師判讀；看到異常數值請回診詢問。來源頁沒有寫健康存摺是否顯示公費篩檢或疫苗紀錄，本條不寫。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。","sources":[{"title":"中央健康保險署：全民健保行動快易通│健康存摺APP","url":"https://www.nhi.gov.tw/ch/cp-3166-56af4-2457-1.html","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"free-health-018","chapter":"free-health","title":"原住民有幾項公費檢查與疫苗的年齡比一般人早","cost":{"money":"同各項公費服務","time":"同各項公費服務","effort":"低"},"plain":"原住民的公費成人健檢、B/C 肝篩檢、口腔黏膜檢查與肺炎鏈球菌疫苗，起始年齡比一般民眾早，別因為以為年紀還沒到而錯過。","benefit":"國健署成人預防保健說明頁：55 歲以上原住民每年 1 次成人健檢（一般民眾 65 歲以上）。國健署 B、C 肝篩檢頁（2025-12-15 更新）：45 歲至 79 歲（原住民 40 歲至 79 歲）終身一次。國健署癌症篩檢說明頁：18 歲以上有嚼檳榔（含已戒）原住民每 2 年 1 次口腔黏膜檢查（一般民眾 30 歲以上）。疾管署 2026-07-28 新聞稿：55–64 歲原住民可接種 1 劑公費肺炎鏈球菌疫苗（一般民眾 65 歲以上），流感與新冠疫苗接種專區也列有 55–64 歲原住民。","evidence":"A","caveats":"各項服務的原住民身分認定方式，請向院所或衛生所確認。2025 年起 B、C 肝篩檢另擴大到民國 75 年以前出生者，原住民條件與新規定的關係請以國健署最新說明為準。篩檢或檢查結果異常時，請依醫師指示回診追蹤或接受進一步檢查，不要因為沒有症狀就擱著。個人狀況（懷孕、正在治療的疾病、已有症狀等）請先問醫師，有症狀的人應直接就醫，不必等公費篩檢。公費資格的年齡、間隔與對象近年常調整，以國健署或疾管署最新公告為準。","sources":[{"title":"國民健康署：成人預防保健（服務說明頁）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=189","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：成人預防保健服務B、C型肝炎篩檢（2021-01-19 發布，2025-12-15 更新）","url":"https://www.hpa.gov.tw/Pages/Detail.aspx?nodeid=1115&pid=13580","type":"官方","checked":"2026-11-22"},{"title":"國民健康署：癌症篩檢介紹（乳癌、子宮頸癌、大腸癌、口腔癌、肺癌）","url":"https://www.hpa.gov.tw/Pages/List.aspx?nodeid=211","type":"官方","checked":"2026-11-22"},{"title":"疾病管制署：成人公費肺炎鏈球菌疫苗自2026年8月10日起全面升級為20價或21價新型疫苗（2026-07-28 發布）","url":"https://www.cdc.gov.tw/Bulletin/Detail/vwMq9VkXIaV7FHyJgpk-5w?typeid=9","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"}]}</script>

      toc: "章節目錄", allChapters: "全部章節",
      search: "搜尋", searchPh: "輸入關鍵字，例如：加班、165",
      evidence: "證據等級", money: "花費", time: "時間成本",
      all: "全部", free: "不花錢或免費", paid: "可能要花錢",
      timeShort: "幾分鐘內就能做", timeLong: "要花較多時間",
      evA: "A：法律、官方制度或大型試驗", evB: "B：觀察性研究、官方統計", evC: "C：專家建議、證據有限",
      evShort: { A: "證據 A", B: "證據 B", C: "證據 C" },
      count: function (n, t) { return "顯示 " + n + " 條，共 " + t + " 條"; },
      reset: "清除篩選",
      empty: "沒有符合條件的建議。試試換個關鍵字或放寬篩選。",
      status: { planned: "規劃中", writing: "撰寫中", done: "完成", pending: "待決定" },
      noItems: "這一章還沒有內容。",
      waiting: "還沒有內容的章節（點了可以看簡介）：",
      draft: "待查核", draftTitle: "草稿：內容尚未經第二人查核",
      costMoney: "花錢", costTime: "花時間", costEffort: "力氣",
      effort: { "低": "低", "中": "中", "高": "高" },
      benefit: "具體數字", caveats: "不適用或要注意的人", sources: "來源",
      checked: "查證日期", updated: "最後修改", type: { "官方": "官方", "法規": "法規", "期刊": "期刊" },
      items: function (n) { return n + " 條"; },
      themeAuto: "主題：自動", themeLight: "主題：淺色", themeDark: "主題：深色",
      langBtn: "English", filtersLabel: "篩選", tocLabel: "章節目錄"
    },
    en: {
      title: "Taiwan Life Value Guide",
      subtitle: "Each tip says what it costs, what you get back, and how strong the evidence is. Sources are limited to Taiwan government sites, law databases and peer-reviewed journals.",
      disclaimerTitle: "Disclaimer: ",
      disclaimerTop: "For reference only. This is not medical, legal or financial advice. Ask a doctor about health questions, and a professional about your own legal or money situation. Laws and amounts change: follow the linked sources and note each tip's check date.",
      disclaimerBottom: "For reference only; not medical, legal or financial advice. Written by volunteers, so it may contain errors or be out of date. The project is not responsible for decisions made from it. Please report mistakes on GitHub.",
      attribution: 'Adapted from HowToLiveBetter by eternity4719 and rewritten for Taiwan\'s laws and systems. Not an official version. See <a href="' + REPO + '/blob/main/NOTICE.md">NOTICE.md</a>.',
      license: 'Content under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, code under <a href="' + REPO + '/blob/main/LICENSE-CODE">MIT</a>. Source and data: <a href="' + REPO + '">ckolpeter/HowToLiveBetter-TW</a>.',
      contentNote: "Note: the tips and chapter introductions are written in Traditional Chinese for Taiwan. Only the interface is translated.",
      toc: "Chapters", allChapters: "All chapters",
      search: "Search", searchPh: "Type a keyword, e.g. 加班, 165",
      evidence: "Evidence", money: "Money", time: "Time",
      all: "All", free: "Free", paid: "May cost money",
      timeShort: "Takes minutes", timeLong: "Takes longer",
      evA: "A: law, official program or large trials", evB: "B: observational studies, official statistics", evC: "C: expert opinion, limited evidence",
      evShort: { A: "Evidence A", B: "Evidence B", C: "Evidence C" },
      count: function (n, t) { return "Showing " + n + " of " + t + " tips"; },
      reset: "Clear filters",
      empty: "No tips match. Try another keyword or fewer filters.",
      status: { planned: "Planned", writing: "In progress", done: "Done", pending: "Undecided" },
      noItems: "No tips in this chapter yet.",
      waiting: "Chapters without tips yet (tap to see the introduction):",
      draft: "Not yet reviewed", draftTitle: "Draft: not yet checked by a second person",
      costMoney: "Money", costTime: "Time", costEffort: "Effort",
      effort: { "低": "Low", "中": "Medium", "高": "High" },
      benefit: "Numbers", caveats: "Who should be careful", sources: "Sources",
      checked: "Checked", updated: "Last edited", type: { "官方": "Official", "法規": "Law", "期刊": "Journal" },
      items: function (n) { return n + (n === 1 ? " tip" : " tips"); },
      themeAuto: "Theme: auto", themeLight: "Theme: light", themeDark: "Theme: dark",
      langBtn: "中文", filtersLabel: "Filters", tocLabel: "Chapters"
    }
  };

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { return null; }
    return null;
  }

  var savedTheme = store("htlb-theme");
  var state = {
    lang: store("htlb-lang") === "en" ? "en" : "zh",
    theme: savedTheme === "light" || savedTheme === "dark" ? savedTheme : "auto",
    q: "", chapter: "", evidence: "", money: "", time: ""
  };

  function t(key) { return I18N[state.lang][key]; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) { return /^https:\/\//i.test(u) ? u : "#"; }
  function name(obj) { return state.lang === "en" ? obj.title_en : obj.title; }
  function chapterById(id) { for (var i = 0; i < chapters.length; i++) if (chapters[i].id === id) return chapters[i]; return null; }
  function itemsOf(id) { return items.filter(function (it) { return it.chapter === id; }); }

  // Money and time filters read the free-text cost fields, so they are approximate.
  function isFree(it) { return /^(不花錢|免費|0\s*元)/.test((it.cost || {}).money || ""); }
  function isQuick(it) {
    var s = (it.cost || {}).time || "";
    if (/\d\s*(小時|天|週|周|個月|年)|[一二三四五六七八九十幾半]\s*(小時|天|週|周|個月|年)|每天|每週|每月|持續|長期/.test(s)) return false;
    return /秒|分鐘|一通電話|一次/.test(s);
  }

  function filtersActive() { return !!(state.q.trim() || state.evidence || state.money || state.time); }

  function matches(it) {
    if (state.chapter && it.chapter !== state.chapter) return false;
    if (state.evidence && it.evidence !== state.evidence) return false;
    if (state.money === "free" && !isFree(it)) return false;
    if (state.money === "paid" && isFree(it)) return false;
    if (state.time === "short" && !isQuick(it)) return false;
    if (state.time === "long" && isQuick(it)) return false;
    var q = state.q.trim().toLowerCase();
    if (!q) return true;
    var ch = chapterById(it.chapter) || {};
    var hay = [it.id, it.title, it.plain, it.benefit, it.caveats, ch.title, ch.title_en,
      (it.cost || {}).money, (it.cost || {}).time]
      .concat((it.sources || []).map(function (s) { return s.title; })).join(" ").toLowerCase();
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function statusChip(ch, count) {
    var key = ch.status;
    if (key === "done" || !t("status")[key]) return "";
    return '<span class="chip ' + esc(key) + '">' + esc(t("status")[key]) + "</span>";
  }

  function card(it) {
    var c = it.cost || {};
    var srcs = (it.sources || []).map(function (s) {
      return '<li><a href="' + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(s.title) + "</a>" +
        '<div class="src-meta">' + esc(t("type")[s.type] || s.type) + " · " + esc(t("checked")) + " " + esc(s.checked) + "</div></li>";
    }).join("");
    var draft = it.status === "draft" ? '<span class="draft" title="' + esc(t("draftTitle")) + '">' + esc(t("draft")) + "</span>" : "";
    return '<article class="card" id="' + esc(it.id) + '">' +
      '<div class="meta"><span class="ev ev-' + esc(it.evidence) + '" title="' + esc(t("ev" + it.evidence)) + '">' + esc(t("evShort")[it.evidence] || it.evidence) + "</span>" +
      draft + '<span class="id">' + esc(it.id) + "</span></div>" +
      "<h4>" + esc(it.title) + "</h4>" +
      '<p class="plain">' + esc(it.plain) + "</p>" +
      "<dl><dt>" + esc(t("costMoney")) + "</dt><dd>" + esc(c.money) + "</dd>" +
      "<dt>" + esc(t("costTime")) + "</dt><dd>" + esc(c.time) + "</dd>" +
      "<dt>" + esc(t("costEffort")) + "</dt><dd>" + esc(t("effort")[c.effort] || c.effort) + "</dd></dl>" +
      '<p class="section-label">' + esc(t("benefit")) + '</p><p class="block">' + esc(it.benefit) + "</p>" +
      '<p class="section-label">' + esc(t("caveats")) + '</p><p class="block caveats">' + esc(it.caveats) + "</p>" +
      '<p class="section-label">' + esc(t("sources")) + '</p><ol class="sources">' + srcs + "</ol>" +
      '<p class="updated">' + esc(t("updated")) + " " + esc(it.updated) + "</p>" +
      "</article>";
  }

  function renderToc() {
    var html = '<ul><li><button type="button" class="ch" data-ch=""' + (state.chapter ? "" : ' aria-current="true"') + ">" +
      "<span>" + esc(t("allChapters")) + '</span><span class="n">' + esc(t("items")(items.length)) + "</span></button></li></ul>";
    groups.forEach(function (g) {
      html += '<div class="g">' + esc(name(g)) + "</div><ul>";
      chapters.filter(function (c) { return c.group === g.id; }).forEach(function (c) {
        var n = itemsOf(c.id).length;
        var right = n ? t("items")(n) : (t("status")[c.status] || "");
        html += '<li><button type="button" class="ch" data-ch="' + esc(c.id) + '"' + (state.chapter === c.id ? ' aria-current="true"' : "") + ">" +
          "<span>" + esc(name(c)) + '</span><span class="n">' + esc(right) + "</span></button></li>";
      });
      html += "</ul>";
    });
    document.getElementById("toc-body").innerHTML = html;
  }

  function render() {
    var shown = items.filter(matches);
    var active = filtersActive();
    var html = "";
    groups.forEach(function (g) {
      var section = "", waiting = [];
      chapters.filter(function (c) { return c.group === g.id && (!state.chapter || c.id === state.chapter); }).forEach(function (c) {
        var all = itemsOf(c.id);
        var mine = shown.filter(function (it) { return it.chapter === c.id; });
        if (mine.length) {
          section += '<section class="chapter" id="ch-' + esc(c.id) + '"><h3 class="chapter-title">' + esc(name(c)) + statusChip(c, all.length) + "</h3>" +
            '<p class="intro">' + esc(c.intro) + "</p>" + mine.map(card).join("") + "</section>";
        } else if (state.chapter && all.length === 0) {
          // A single empty chapter was picked: show its name, status and intro.
          section += '<div class="placeholder" id="ch-' + esc(c.id) + '"><span class="t">' + esc(name(c)) + "</span>" + statusChip(c, 0) +
            '<p class="intro">' + esc(c.intro) + " " + esc(t("noItems")) + "</p></div>";
        } else if (!active && all.length === 0) {
          waiting.push(c);
        }
      });
      if (waiting.length) {
        // Chapters without tips yet are listed compactly after the ones that have content.
        section += '<div class="waiting"><span class="waiting-label">' + esc(t("waiting")) + "</span>" +
          waiting.map(function (c) {
            return '<button type="button" class="ch-chip" id="ch-' + esc(c.id) + '" data-ch="' + esc(c.id) + '" title="' + esc(c.intro) + '">' +
              esc(name(c)) + statusChip(c, 0) + "</button>";
          }).join("") + "</div>";
      }
      if (section) html += '<h2 class="group">' + esc(name(g)) + "</h2>" + section;
    });
    document.getElementById("count").textContent = t("count")(shown.length, items.length);
    document.getElementById("reset").hidden = !(active || state.chapter);
    document.getElementById("list").innerHTML = html || '<p class="empty">' + esc(t("empty")) + "</p>";
    renderToc();
  }

  function fillSelect(id, options, current) {
    document.getElementById(id).innerHTML = options.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (o[0] === current ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    }).join("");
  }

  function applyTheme() {
    if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", state.theme);
    document.getElementById("theme-btn").textContent = t({ auto: "themeAuto", light: "themeLight", dark: "themeDark" }[state.theme]);
  }

  function applyLang() {
    document.documentElement.lang = state.lang === "en" ? "en" : "zh-Hant-TW";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) { el.placeholder = t(el.getAttribute("data-i18n-placeholder")); });
    document.getElementById("filters").setAttribute("aria-label", t("filtersLabel"));
    document.getElementById("toc").setAttribute("aria-label", t("tocLabel"));
    document.getElementById("content-note").hidden = state.lang !== "en";
    document.getElementById("lang-btn").textContent = t("langBtn");
    fillSelect("f-evidence", [["", t("all")], ["A", t("evA")], ["B", t("evB")], ["C", t("evC")]], state.evidence);
    fillSelect("f-money", [["", t("all")], ["free", t("free")], ["paid", t("paid")]], state.money);
    fillSelect("f-time", [["", t("all")], ["short", t("timeShort")], ["long", t("timeLong")]], state.time);
    applyTheme();
    render();
  }

  // On narrow screens start with the chapter list folded so tips are visible first.
  if (window.matchMedia && window.matchMedia("(max-width: 899px)").matches) {
    document.getElementById("toc-details").open = false;
  }

  document.getElementById("toc-body").addEventListener("click", function (e) {
    var b = e.target.closest("button.ch");
    if (!b) return;
    state.chapter = b.getAttribute("data-ch");
    render();
    if (window.matchMedia && window.matchMedia("(max-width: 899px)").matches) document.getElementById("toc-details").open = false;
    document.getElementById("filters").scrollIntoView({ block: "start" });
  });
  document.getElementById("list").addEventListener("click", function (e) {
    var b = e.target.closest("button.ch-chip");
    if (!b) return;
    state.chapter = b.getAttribute("data-ch");
    render();
    document.getElementById("filters").scrollIntoView({ block: "start" });
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  [["f-evidence", "evidence"], ["f-money", "money"], ["f-time", "time"]].forEach(function (p) {
    document.getElementById(p[0]).addEventListener("change", function (e) { state[p[1]] = e.target.value; render(); });
  });
  document.getElementById("reset").addEventListener("click", function () {
    state.q = state.evidence = state.money = state.time = state.chapter = "";
    document.getElementById("q").value = "";
    applyLang();
  });
  document.getElementById("lang-btn").addEventListener("click", function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    store("htlb-lang", state.lang);
    applyLang();
  });
  document.getElementById("theme-btn").addEventListener("click", function () {
    state.theme = { auto: "light", light: "dark", dark: "auto" }[state.theme];
    store("htlb-theme", state.theme);
    applyTheme();
  });

  applyLang();
})();
</script>
