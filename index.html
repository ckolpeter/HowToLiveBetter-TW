<style>

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 12px; }
body {

.placeholder .intro { margin: 0; flex: 1 1 100%; }

.chip.writing { color: var(--draft); background: var(--draft-bg); }

.draft { color: var(--draft); background: var(--draft-bg); border-radius: 999px; padding: 1px 10px; font-weight: 600; }

.ev-A { color: var(--a); } .ev-B { color: var(--b); } .ev-C { color: var(--c); }

.plain { font-size: 1.02rem; margin: 6px 0 10px; }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .93rem; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.section-label { color: var(--muted); font-size: .85rem; margin: 12px 0 2px; }
.block { margin: 0; font-size: .95rem; }
.caveats { border-left: 3px solid var(--warn-border); padding-left: 10px; }
ol.sources { margin: 4px 0 0; padding-left: 1.3em; font-size: .9rem; }

.updated { margin: 10px 0 0; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }
.content-note { font-size: .85rem; color: var(--muted); margin: -6px 0 12px; }
footer { border-top: 1px solid var(--border); margin-top: 28px; padding: 16px 0 32px; font-size: .88rem; color: var(--muted); }

@media (max-width: 560px) {
  dl { grid-template-columns: 1fr; }
  dt { margin-top: 4px; }
  .card { padding: 12px; }

r-death","title":"人走了以後要辦什麼","title_en":"After a Death in the Family","intro":"家人過世後要辦的證明、登記、給付、遺產與繼承，有哪些期限不能錯過。","order":35,"group":"family","status":"planned"},{"id":"travel","title":"出國旅行與境外安全","title_en":"Travel and Safety Abroad","intro":"出國前、在國外與回國時的安全、醫療、保險與入境規定。","order":36,"group":"living","status":"planned"},{"id":"study-abroad","title":"出國留學","title_en":"Studying Abroad","intro":"出國讀書前後要查的學歷認可、兵役、健保與當地身分規定。","order":37,"group":"living","status":"pending"},{"id":"time-energy","title":"別浪費時間與精力","title_en":"Saving Time and Energy","intro":"睡眠、專注、拖延與辦事效率，把時間和精力花在值得的地方。","order":38,"group":"living","status":"planned"},{"id":"leisure","title":"怎麼放鬆","title_en":"Relaxing Safely","intro":"娛樂場所與戶外活動的安全，以及有證據支持的減壓方式。","order":39,"group":"living","status":"planned"},{"id":"myths","title":"反面清單","title_en":"Things That Look Worth It but Aren't","intro":"看起來划算、但證據不支持或其實有害的常見做法。","order":40,"group":"living","status":"planned"}],"items":[{"id":"fraud-001","chapter":"fraud","title":"接到可疑的電話、訊息或投資邀約，先打 165 反詐騙諮詢專線查證","cost":{"money":"市話撥打免費；手機撥打時中華電信門號免費，其他電信每分鐘新臺幣 1 元（警政署常見問答，更新日期 2022-11-01）","time":"一通電話","effort":"低"},"plain":"覺得不對勁就先打 165 問，不用先確定是詐騙。已經被騙的人也可以直接打 165 報案，或在 165 全民防騙網先填好報案資料，再到派出所完成筆錄。","benefit":"警政署說明（更新日期 2022-11-01）：165 專線可以諮詢、檢舉或報案；也可以在 165 全民防騙網「我要報案」先預製筆錄，由專責人員轉介到民眾方便前往的派出所，接著完成筆錄。官方資料沒有提供「先打 165 能少損失多少錢」的數字，所以這裡不寫。","evidence":"A","caveats":"通話費率是警政署 2022-11-01 的說明，撥打時可能已經變動，以電信公司公告為準。網路預製筆錄之後，仍要到派出所完成手續。被騙之後要不要提告、怎麼追討款項，個案請諮詢律師或法律扶助等專業人士。","sources":[{"title":"內政部警政署常見問答：撥打165反詐騙諮詢專線需要通話費用嗎？受騙報案除可撥打165外，還有其他方式嗎？","url":"https://www.npa.gov.tw/ch/app/faq/view?module=faq&id=2144&serno=A1078837","type":"官方","checked":"2026-11-21"},{"title":"內政部警政署 165 全民防騙網","url":"https://165.npa.gov.tw/","type":"官方","checked":"2026-11-21"}],"status":"draft","updated":"2026-11-21"},{"id":"labor-001","chapter":"labor","title":"加班後可以選補休，但補休到期沒休完，雇主要照加班當天的標準付加班費","cost":{"money":"不花錢","time":"確認公司約定的特休年度和自己的補休紀錄，約 10 分鐘","effort":"低"},"plain":"加班要換補休還是領加班費，要你自己願意、雇主也同意才算，雇主不能片面規定只能補休。補休到期或離職時還沒休完的時數，雇主要換算成加班費付給你。","benefit":"勞動部說明（「加班補休規定」更新日期 2024-12-31；「勞動基準法權益簡介」更新日期 2026-01-01）：平日延長工時前 2 小時加給 1/3 以上，再延長 2 小時加給 2/3 以上；休息日出勤前 2 小時另再加給 1又1/3，第 3 至 8 小時另再加給 1又2/3，第 9 至 12 小時另再加給 2又2/3。補休最晚要在勞雇雙方約定的特別休假年度末日前休完，不能再往後延；沒休完的時數，依加班當天的工資計算標準發給工資。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工，自己的工作適不適用，可以問勞動部或地方勞工局。補休期限以勞雇雙方約定的特休年度為準（曆年制、週年制等）。法令可能修正，以全國法規資料庫的最新條文為準。和雇主有爭議時，個案請諮詢地方勞工局或律師。","sources":[{"title":"勞動部：加班補休規定","url":"https://www.mol.gov.tw/1607/28162/28166/28180/28198/28202/47031/post","type":"官方","checked":"2026-11-21"},{"title":"勞動部：勞動基準法權益簡介","url":"https://www.mol.gov.tw/1607/28162/28166/28168/28170/28989/post","type":"官方","checked":"2026-11-21"}],"status":"draft","updated":"2026-11-21"}]}</script>

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { return null; }
    return null;
  }

  var savedTheme = store("htlb-theme");

    lang: store("htlb-lang") === "en" ? "en" : "zh",

  };

  function t(key) { return I18N[state.lang][key]; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) { return /^https:\/\//i.test(u) ? u : "#"; }
  function name(obj) { return state.lang === "en" ? obj.title_en : obj.title; }
  function chapterById(id) { for (var i = 0; i < chapters.length; i++) if (chapters[i].id === id) return chapters[i]; return null; }
  function itemsOf(id) { return items.filter(function (it) { return it.chapter === id; }); }

  // Money and time filters read the free-text cost fields, so they are approximate.
  function isFree(it) { return /^(不花錢|免費|0\s*元)/.test((it.cost || {}).money || ""); }
  function isQuick(it) {
    var s = (it.cost || {}).time || "";

    return /秒|分鐘|一通電話|一次/.test(s);
  }

  function filtersActive() { return !!(state.q.trim() || state.evidence || state.money || state.time); }

  function matches(it) {
    if (state.chapter && it.chapter !== state.chapter) return false;
    if (state.evidence && it.evidence !== state.evidence) return false;
    if (state.money === "free" && !isFree(it)) return false;
    if (state.money === "paid" && isFree(it)) return false;
    if (state.time === "short" && !isQuick(it)) return false;
    if (state.time === "long" && isQuick(it)) return false;
    var q = state.q.trim().toLowerCase();
    if (!q) return true;
    var ch = chapterById(it.chapter) || {};

    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function card(it) {

      '<p class="plain">' + esc(it.plain) + "</p>" +
      "<dl><dt>" + esc(t("costMoney")) + "</dt><dd>" + esc(c.money) + "</dd>" +
      "<dt>" + esc(t("costTime")) + "</dt><dd>" + esc(c.time) + "</dd>" +
      "<dt>" + esc(t("costEffort")) + "</dt><dd>" + esc(t("effort")[c.effort] || c.effort) + "</dd></dl>" +
      '<p class="section-label">' + esc(t("benefit")) + '</p><p class="block">' + esc(it.benefit) + "</p>" +
      '<p class="section-label">' + esc(t("caveats")) + '</p><p class="block caveats">' + esc(it.caveats) + "</p>" +
      '<p class="section-label">' + esc(t("sources")) + '</p><ol class="sources">' + srcs + "</ol>" +
      '<p class="updated">' + esc(t("updated")) + " " + esc(it.updated) + "</p>" +
      "</article>";
  }

  function renderToc() {
    var html = '<ul><li><button type="button" class="ch" data-ch=""' + (state.chapter ? "" : ' aria-current="true"') + ">" +
      "<span>" + esc(t("allChapters")) + '</span><span class="n">' + esc(t("items")(items.length)) + "</span></button></li></ul>";
    groups.forEach(function (g) {
      html += '<div class="g">' + esc(name(g)) + "</div><ul>";
      chapters.filter(function (c) { return c.group === g.id; }).forEach(function (c) {
        var n = itemsOf(c.id).length;
        var right = n ? t("items")(n) : t("status")[c.status === "pending" ? "pending" : "writing"];
        html += '<li><button type="button" class="ch" data-ch="' + esc(c.id) + '"' + (state.chapter === c.id ? ' aria-current="true"' : "") + ">" +
          "<span>" + esc(name(c)) + '</span><span class="n">' + esc(right) + "</span></button></li>";
      });
      html += "</ul>";
    });
    document.getElementById("toc-body").innerHTML = html;
  }

  function render() {
    var shown = items.filter(matches);
    var active = filtersActive();
    var html = "";
    groups.forEach(function (g) {
      var section = "", waiting = [];
      chapters.filter(function (c) { return c.group === g.id && (!state.chapter || c.id === state.chapter); }).forEach(function (c) {
        var all = itemsOf(c.id);
        var mine = shown.filter(function (it) { return it.chapter === c.id; });
        if (mine.length) {
          section += '<section class="chapter" id="ch-' + esc(c.id) + '"><h3 class="chapter-title">' + esc(name(c)) + statusChip(c, all.length) + "</h3>" +
            '<p class="intro">' + esc(c.intro) + "</p>" + mine.map(card).join("") + "</section>";
        } else if (state.chapter && all.length === 0) {
          // A single empty chapter was picked: show its name, status and intro.
          section += '<div class="placeholder" id="ch-' + esc(c.id) + '"><span class="t">' + esc(name(c)) + "</span>" + statusChip(c, 0) +
            '<p class="intro">' + esc(c.intro) + " " + esc(t("noItems")) + "</p></div>";
        } else if (!active && all.length === 0) {
          waiting.push(c);
        }
      });
      if (waiting.length) {
        // Chapters without tips yet are listed compactly after the ones that have content.
        section += '<div class="waiting"><span class="waiting-label">' + esc(t("waiting")) + "</span>" +
          waiting.map(function (c) {
            return '<button type="button" class="ch-chip" id="ch-' + esc(c.id) + '" data-ch="' + esc(c.id) + '" title="' + esc(c.intro) + '">' +
              esc(name(c)) + statusChip(c, 0) + "</button>";
          }).join("") + "</div>";
      }
      if (section) html += '<h2 class="group">' + esc(name(g)) + "</h2>" + section;
    });
    document.getElementById("count").textContent = t("count")(shown.length, items.length);
    document.getElementById("reset").hidden = !(active || state.chapter);
    document.getElementById("list").innerHTML = html || '<p class="empty">' + esc(t("empty")) + "</p>";
    renderToc();
  }

  function fillSelect(id, options, current) {
    document.getElementById(id).innerHTML = options.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (o[0] === current ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    }).join("");
  }

  function applyTheme() {
    if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", state.theme);
    document.getElementById("theme-btn").textContent = t({ auto: "themeAuto", light: "themeLight", dark: "themeDark" }[state.theme]);
  }

  function applyLang() {
    document.documentElement.lang = state.lang === "en" ? "en" : "zh-Hant-TW";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) { el.placeholder = t(el.getAttribute("data-i18n-placeholder")); });
    document.getElementById("filters").setAttribute("aria-label", t("filtersLabel"));
    document.getElementById("toc").setAttribute("aria-label", t("tocLabel"));
    document.getElementById("content-note").hidden = state.lang !== "en";
    document.getElementById("lang-btn").textContent = t("langBtn");
    fillSelect("f-evidence", [["", t("all")], ["A", t("evA")], ["B", t("evB")], ["C", t("evC")]], state.evidence);
    fillSelect("f-money", [["", t("all")], ["free", t("free")], ["paid", t("paid")]], state.money);
    fillSelect("f-time", [["", t("all")], ["short", t("timeShort")], ["long", t("timeLong")]], state.time);
    applyTheme();
    render();
  }

  // On narrow screens start with the chapter list folded so tips are visible first.
  if (window.matchMedia && window.matchMedia("(max-width: 899px)").matches) {
    document.getElementById("toc-details").open = false;
  }

  document.getElementById("toc-body").addEventListener("click", function (e) {
    var b = e.target.closest("button.ch");
    if (!b) return;
    state.chapter = b.getAttribute("data-ch");
    render();
    if (window.matchMedia && window.matchMedia("(max-width: 899px)").matches) document.getElementById("toc-details").open = false;
    document.getElementById("filters").scrollIntoView({ block: "start" });
  });
  document.getElementById("list").addEventListener("click", function (e) {
    var b = e.target.closest("button.ch-chip");
    if (!b) return;
    state.chapter = b.getAttribute("data-ch");
    render();
    document.getElementById("filters").scrollIntoView({ block: "start" });
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  [["f-evidence", "evidence"], ["f-money", "money"], ["f-time", "time"]].forEach(function (p) {
    document.getElementById(p[0]).addEventListener("change", function (e) { state[p[1]] = e.target.value; render(); });
  });
  document.getElementById("reset").addEventListener("click", function () {
    state.q = state.evidence = state.money = state.time = state.chapter = "";
    document.getElementById("q").value = "";
    applyLang();
  });
  document.getElementById("lang-btn").addEventListener("click", function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    store("htlb-lang", state.lang);
    applyLang();
  });
  document.getElementById("theme-btn").addEventListener("click", function () {
    state.theme = { auto: "light", light: "dark", dark: "auto" }[state.theme];
    store("htlb-theme", state.theme);
    applyTheme();
  });

  applyLang();
})();
</script>
</body>
</html>
