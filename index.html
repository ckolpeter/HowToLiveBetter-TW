  dt { margin-top: 4px; }

tro":"寫程式、做網站、接案時容易觸犯的刑事與民事責任。","order":22,"group":"work","status":"planned"},{"id":"legal-safety","title":"別把自己搭進去：法律與財產安全","title_en":"Protecting Yourself Legally","intro":"日常糾紛裡保護自己的法律工具與期限，別因不懂程序而吃虧。","order":23,"group":"law","status":"planned"},{"id":"legal-redlines","title":"普通人容易踩的法律紅線","title_en":"Everyday Legal Red Lines","intro":"一般人可能不知不覺觸犯的刑事與行政罰規定。","order":24,"group":"law","status":"planned"},{"id":"renting","title":"租屋","title_en":"Renting a Home","intro":"租屋前後的契約、押金、補貼與安全，房客和小房東各自的權利義務。","order":25,"group":"housing","status":"planned"},{"id":"home-buying","title":"買房","title_en":"Buying a Home","intro":"買預售屋或成屋前該查的資料、契約重點與貸款稅務。","order":26,"group":"housing","status":"planned"},{"id":"love-marriage","title":"戀愛和結婚","title_en":"Dating and Marriage","intro":"交往、結婚、離婚各階段的健康、財產與安全，以及法律怎麼保障你。","order":27,"group":"family","status":"planned"},{"id":"pregnancy","title":"懷孕和生產","title_en":"Pregnancy and Childbirth","intro":"從備孕到產後，公費產檢、孕期安全與該辦的假和給付。","order":28,"group":"family","status":"planned"},{"id":"newborn","title":"剛出生的孩子怎麼帶","title_en":"Caring for a Newborn","intro":"0–1 歲寶寶最重要的安全、疫苗與餵養重點，以及要立刻就醫的信號。","order":29,"group":"family","status":"planned"},{"id":"school-kids","title":"上學以後的孩子","title_en":"School-Age Children","intro":"學齡兒童與青少年的視力、牙齒、心理與安全，以及校園問題怎麼處理。","order":30,"group":"family","status":"planned"},{"id":"raising-kids","title":"養孩子的錢與時間","title_en":"The Cost of Raising Children","intro":"養孩子可領的津貼、可請的假，以及真實的金錢與時間成本。","order":31,"group":"family","status":"planned"},{"id":"elders","title":"家裡有長輩","title_en":"Caring for Older Family Members","intro":"長輩的法律安排、醫療決定、防詐與健康，在出事前先處理好。","order":32,"group":"family","status":"planned"},{"id":"ltc","title":"長照 2.0","title_en":"Long-Term Care 2.0","intro":"家人失能或失智時，怎麼申請長照服務、能用多少額度、要自付多少。","order":33,"group":"family","status":"planned"},{"id":"disability","title":"身心障礙之後怎麼活","title_en":"Living with Disability","intro":"取得身障證明後可用的補助、就業與教育資源，以及照顧者的支持。","order":34,"group":"family","status":"planned"},{"id":"after-death","title":"人走了以後要辦什麼","title_en":"After a Death in the Family","intro":"家人過世後要辦的證明、登記、給付、遺產與繼承，有哪些期限不能錯過。","order":35,"group":"family","status":"planned"},{"id":"travel","title":"出國旅行與境外安全","title_en":"Travel and Safety Abroad","intro":"出國前、在國外與回國時的安全、醫療、保險與入境規定。","order":36,"group":"living","status":"planned"},{"id":"study-abroad","title":"出國留學","title_en":"Studying Abroad","intro":"出國讀書前後要查的學歷認可、兵役、健保與當地身分規定。","order":37,"group":"living","status":"pending"},{"id":"time-energy","title":"別浪費時間與精力","title_en":"Saving Time and Energy","intro":"睡眠、專注、拖延與辦事效率，把時間和精力花在值得的地方。","order":38,"group":"living","status":"planned"},{"id":"leisure","title":"怎麼放鬆","title_en":"Relaxing Safely","intro":"娛樂場所與戶外活動的安全，以及有證據支持的減壓方式。","order":39,"group":"living","status":"planned"},{"id":"myths","title":"反面清單","title_en":"Things That Look Worth It but Aren't","intro":"看起來划算、但證據不支持或其實有害的常見做法。","order":40,"group":"living","status":"planned"}],"items":[{"id":"fraud-001","chapter":"fraud","title":"接到可疑的電話、訊息或投資邀約，先打 165 反詐騙諮詢專線查證","cost":{"money":"市話撥打免費；手機撥打時中華電信門號免費，其他電信每分鐘新臺幣 1 元（警政署常見問答，更新日期 2022-11-01）","time":"一通電話","effort":"低"},"plain":"覺得不對勁就先打 165 問，不用先確定是詐騙。已經被騙的人也可以直接打 165 報案，或在 165 全民防騙網先填好報案資料，再到分駐（派出）所完成筆錄。","benefit":"警政署說明（更新日期 2022-11-01）：165 專線可以諮詢、檢舉或報案；也可以在 165 全民防騙網「我要報案」先預製筆錄，由專責人員轉介到民眾方便前往的分駐（派出）所，接著完成筆錄。官方資料沒有提供「先打 165 能少損失多少錢」的數字，所以這裡不寫。","evidence":"A","caveats":"通話費率是警政署 2022-11-01 的說明，撥打時可能已經變動，以電信公司公告為準。網路預製筆錄之後，仍要到派出所完成手續。被騙之後要不要提告、怎麼追討款項，個案請諮詢律師或法律扶助等專業人士。","sources":[{"title":"內政部警政署常見問答：撥打165反詐騙諮詢專線需要通話費用嗎？受騙報案除可撥打165外，還有其他方式嗎？","url":"https://www.npa.gov.tw/ch/app/faq/view?module=faq&id=2144&serno=A1078837","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署 165 全民防騙網","url":"https://165.npa.gov.tw/","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-002","chapter":"fraud","title":"發現被騙就立刻報案，讓警方通知銀行圈存款項、把收款帳戶列為警示","cost":{"money":"不花錢","time":"一通電話加上到派出所做筆錄","effort":"低"},"plain":"被騙的錢不能靠私下找人追回，要第一時間報案，讓警方通報金融機構圈存可疑款項、把收款帳戶列為警示。警示帳戶裡如果還有沒被領走的錢，經警方書面通知後，銀行可以發還給被害人。信用卡或簽帳金融卡在網路上被盜刷時，消保會建議先聯絡發卡機構客服專線。","benefit":"刑事警察局（2026-01-31 公告）：民眾發現遭詐騙後，應第一時間向警方報案，警方會通報金融機構圈存可疑款項或警示帳戶；沒有透過公權力無法自行追回。《詐欺犯罪危害防制條例》（2026-01-21 修正版）第 9 條第 4 項規定司法警察機關可以通報金融機構把帳戶列為警示、暫停全部交易功能，第 10 條規定通報後的聯防與圈存。《金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法》（2026-07-20 修正版）：第 28 條，被害人在營業時間親自到銀行告知被騙，銀行請其填寫切結書並撥打 165，警察機關應於 2 小時內派員到銀行受理報案；第 30 條，銀行圈存後 48 小時內，由原通報警察機關通知列為警示或解除圈存，48 小時內沒有收到通知，銀行就逕行解除圈存；第 52、53 條，警示帳戶內還有被害人匯入且未被提領的剩餘款項時，經司法警察機關書面通知，銀行得發還給被害人，不一定要等法院判決；第 69 條，經銀行等業者認定為疑似交易糾紛或案情複雜的案件，不適用發還程序，應循司法程序。行政院消保會：信用卡或簽帳金融卡遇到網路盜刷時，先聯絡發卡機構客服專線，要求協助處理爭議款項（信用卡並可請求暫停支付），並通知網路平台取消交易，同時可向警局報案。官方資料沒有給出「幾小時內報案能追回多少」的數字，所以這裡不寫。","evidence":"A","caveats":"報案不保證拿得回錢：發還的只限帳戶裡還沒被領走的剩餘款項，款項如果已被提領或轉到境外，可能追不回。消保會也提醒，簽帳金融卡遇到網路盜刷時，因為款項是直接從帳戶扣除，可能有無法追回的風險；消保會這段說明只談網路盜刷，不涵蓋自己被騙而刷卡付款的情形。報案管道見 fraud-001（165 專線、165 全民防騙網預填筆錄、或直接到派出所）。法條可能修正，以全國法規資料庫最新條文為準。個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"刑事警察局公告：誤信國際律師與幣流師協追被詐款項 藥師再度遭詐百萬元（2026-01-31）","url":"https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=27a4218c-017e-4aca-93f3-097a0d05df1d","type":"官方","checked":"2026-11-22"},{"title":"全國法規資料庫：詐欺犯罪危害防制條例（修正日期 2026-01-21）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0080226","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法（修正日期 2026-07-20）第 28、30、52、53、69 條","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380271","type":"法規","checked":"2026-11-22"},{"title":"行政院消費者保護會：線上購物時，注意不同付款方式之權益保障不同","url":"https://cpc.ey.gov.tw/Page/1DCF8AA4D223F601/1a50ebaf-2998-4913-b9ec-943992fe5468","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-003","chapter":"fraud","title":"聽到「保證獲利」「穩賺不賠」，或被拉進 LINE 投資群組，就當成詐騙","cost":{"money":"不花錢","time":"查證約 10 分鐘","effort":"低"},"plain":"假投資會先讓你小賺幾筆，等你投入大量資金後再用各種理由不讓你出金。投資前先查對方是不是金管會核准的合法業者。","benefit":"刑事警察局（頁面更新 2026-11-20）：聽到「保證獲利」、「穩賺不賠」必定是詐騙；遇到加 LINE 進行投資必為詐騙；詐團常以「洗碼量不足、繳保證金、IP 異常」等理由拒絕出金。金管會（2026-02-17 新聞稿）：要求支付解凍金、保證金、驗證金或稅款才能出金是常見話術；合法證券期貨業者名單公布在官網「防範非法證券期貨業宣導專區」，也可撥證券期貨反詐欺諮詢專線 02-2737-3434 或 165 查證。","evidence":"B","caveats":"「LINE 投資群組必為詐騙」是警方依受理案件整理的提醒，不代表所有透過網路接觸的投資都違法，但合法與否一定要自己到金管會名單查。已經入金的人，不要再付任何「出金費用」，直接報案。投資本身有風險，個人投資決定請諮詢合法持牌的專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第二章 假投資","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a4f8d5ab-3d53-4d22-9411-031fddde7a4e","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：網路投資群組詐騙多，投資前先停看聽（2026-02-17）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202602130008&dtable=News","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：金管會提醒投資人勿信保證獲利等勸誘投資資訊，以避免受騙（2025-11-18）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202511180001&dtable=News","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-004","chapter":"fraud","title":"有人來電說「設定錯誤會重複扣款」要你操作 ATM 或買遊戲點數，直接掛斷","cost":{"money":"不花錢","time":"掛斷後自己查官方電話回撥，約 5 分鐘","effort":"低"},"plain":"ATM 只能提款和轉帳，不能解除分期或退款；遊戲點數也不能解除任何設定。對方就算說得出你的訂單明細，也可能是從被駭的購物網站拿到的。","benefit":"刑事警察局（頁面更新 2026-11-13）：ATM 只能「提款」與「轉帳」功能，不能解除分期付款或退款；遊戲點數只有儲值遊戲的功能，無法解除任何設定或身分識別。接到陌生來電或境外來電（開頭有 +）要提高警覺，不要因為對方能說出交易明細就相信；聽到「誤設為重複扣款」、「升級 VIP 會員」、「系統出錯」，應掛斷後自行查證或撥 165。","evidence":"B","caveats":"這是警方依受理案件整理的手法，詐團話術會變，但「要你操作 ATM、網銀或買點數來取消扣款」的模式不變。回撥時要用自己查到的官方客服電話，不要用對方給的號碼。已經轉帳的人請立刻報案；個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第三章 ATM解除分期付款詐騙","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a61af506-a4ac-49eb-9c79-ef75ddc6f237","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-005","chapter":"fraud","title":"網購不要跟賣家私下用 LINE 交易，遇到便宜得離譜的一頁式廣告先查證","cost":{"money":"不花錢","time":"下單前多查 5 分鐘","effort":"低"},"plain":"假網拍常用遠低於市價的熱門商品吸引人，再要你私下匯款；一頁式廣告則常標榜貨到付款，收到的商品卻與廣告不符、有瑕疵，甚至根本沒訂。選有第三方支付的平臺，可以保留爭議時止付的機會。","benefit":"刑事警察局（頁面更新 2026-10-22）：假網拍以明顯低於市價的價格誘引下單，並要求以 LINE 或 Messenger 私下交易，匯款後不出貨並失聯；建議透過面交或有第三方支付的網購平臺，避免私下聯繫交易，並可到經濟部網站查詢公司基本資料。行政院消費者保護會：一頁式廣告的特徵包括強調貨到付款、售價明顯低於行情、標榜 7 天鑑賞期、限時限量促銷、網址拼音奇特、出現大陸用語、未提供實體聯絡電話及地址；收到貨到付款包裹應儘速拆封驗貨，有問題聯絡寄件人或貨運業者，仍無法解決可到消保會網站線上申訴。（消保會頁面未標示日期。）","evidence":"B","caveats":"一頁式廣告不一定是詐騙，有些只是商品不符的消費糾紛，處理管道是消費申訴；若對方收錢後失聯，則屬詐騙，應報案。消保會頁面寫的「7 天鑑賞期」是賣家的宣傳話術，不是在說明法律規定。個案消費爭議可諮詢地方消費者服務中心等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第一章 假網拍詐騙","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=7e614f6f-df9b-4ae2-8293-ed384fb1a470","type":"官方","checked":"2026-11-22"},{"title":"行政院消費者保護會：「一頁式廣告」有哪些特徵？貨到付款後發現商品不符，怎麼辦？","url":"https://cpc.ey.gov.tw/Page/BC16ACF0BBB9CCC2/5922d66c-3c30-4418-8ce5-29a2f09b4185","type":"官方","checked":"2026-11-22"},{"title":"行政院消費者保護會：線上購物時，注意不同付款方式之權益保障不同","url":"https://cpc.ey.gov.tw/Page/1DCF8AA4D223F601/1a50ebaf-2998-4913-b9ec-943992fe5468","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-006","chapter":"fraud","title":"沒見過面的網友開口要錢或介紹投資，先停下來，要求視訊確認本人","cost":{"money":"不花錢","time":"一次視訊通話","effort":"低"},"plain":"假交友常盜用帥哥美女照片、假冒軍官或軍醫，培養感情後再以包裹關稅、結婚基金或投資為由要你匯款。只要網友提到錢，就先查證。","benefit":"刑事警察局（頁面更新 2026-11-20）：詐團盜用網路上的帥哥、美女照片，假冒戰地軍官、軍醫、聯合國官員，再以境外寄送包裹需要關稅、儲存結婚基金、介紹投資管道等方式要求匯款，直到被封鎖才知道受騙；建議不要向陌生網友透露太多個人資訊，網友要求匯錢時可要求開視訊確認本人身分，勿輕易交付金錢。","evidence":"B","caveats":"視訊也可能被 AI 換臉造假（見 fraud-008），所以視訊只能當成初步確認，涉及金錢時仍要多方查證。已經匯款的人可能會覺得難以啟齒，但越早報案越好。個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第四章 假愛情交友","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=064fe6c9-ae2c-40d2-a7df-2e5a4223091f","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-007","chapter":"fraud","title":"接到自稱檢警、健保局或電信公司的電話說你涉案，掛斷後自己查該單位電話回撥","cost":{"money":"不花錢","time":"一通回撥電話","effort":"低"},"plain":"假冒公務員的詐團會說你的身分被冒用、案件「偵查不公開」不能告訴家人，再傳假公文、要你「監管帳戶」。警察不會在電話中做筆錄，真的要你到案會寄通知書。","benefit":"刑事警察局（頁面更新 2026-10-22）：聽到「遭冒用身分」、「偵查不公開」、「接收法院偽造公文」、「監管帳戶」等關鍵字，就是假冒機構（公務員）詐騙；警察機關不會在電話中做筆錄；檢警調處理司法案件，會以通知書通知涉案人到案說明或至指定機關繳交款項。接到這類電話，先問對方單位、職稱、姓名，掛斷後再向該單位求證。","evidence":"B","caveats":"長輩是常見目標，可以事先和家中長輩講好「接到說涉案的電話，先掛斷打給家人或 165」。回撥時要用自己查到的機關總機，不要用對方給的電話。真的收到法院或地檢署文書而不確定真偽時，可親自向該機關查證，個案請諮詢律師等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第六章 假冒機構(公務員)","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=b7cf505d-f709-4885-b06b-d29b092ce04f","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-008","chapter":"fraud","title":"親友說換了新號碼、急著借錢，或視訊裡的臉看起來像本人，都先用舊號碼回撥確認","cost":{"money":"不花錢","time":"一通電話；和家人約定一句通關密語","effort":"低"},"plain":"「猜猜我是誰」會假冒兒女或老朋友，說換了手機，過幾天再借錢；現在還有 AI 換臉的視訊。用原本的電話回撥、問只有彼此知道的密語，可以擋下這類詐騙。","benefit":"刑事警察局（頁面更新 2026-11-20）：詐團假冒兒女、親戚或多年不見的友人，以換手機為由要你加新號碼或新 LINE，過幾天再以急用、周轉為由要求匯款；務必用舊有電話向本人確認，匯款帳戶名稱和親友本人不同時詐騙可能性大幅提高，可和親友約定專屬密語。警政署保安警察第三總隊（2024-04-01 發布）：AI 深偽可變臉成親友視訊，談到錢要存疑；可先撥親友原本的電話查證、請對方轉頭、在臉前揮手或換姿勢，看畫面是否有破綻，或請對方說出事先約定的通關密語。","evidence":"B","caveats":"AI 深偽技術進步很快，「轉頭、揮手」這類辨識方法可能會失效，最可靠的仍是用舊號碼回撥和事先約定的密語。這條特別適合幫家中長輩設定。若已經匯款，請立刻報案；個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第五章 猜猜我是誰","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=4f04dab6-3ca5-4139-a94e-66be03b62ba3","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署保安警察第三總隊防詐專區：AI 深偽技術變臉成親朋好友跟你視訊，如何分辨？","url":"https://www.3spc.npa.gov.tw/ch/app/data/view?module=govinfo&id=18710&serno=c059600e-9d0a-4d29-b1be-86ffec18502a","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-009","chapter":"fraud","title":"求職時被要求交出存摺、提款卡或網銀密碼，或先繳保證金、訓練費，就是詐騙","cost":{"money":"不花錢","time":"面試前查證公司，約 15 分鐘","effort":"低"},"plain":"假求職會用「設定薪資轉帳」騙走你的帳戶，或先收各種費用；境外高薪工作則可能讓人被拘禁、被迫做詐騙。查證公司、告訴家人行蹤，可以避免人財兩失，也避免帳戶被拿去收贓款而惹上官司。","benefit":"刑事警察局（頁面更新 2026-10-08）：假求職以設定薪資轉帳為名騙取金融帳戶及密碼，或向應徵者收取訂金、保證金、治裝費、訓練費；境外高薪工作的被害人可能被拘禁，帳戶被用來收詐騙款；合法公司不會以私人帳號發訊息徵才，切勿依指示申辦約定帳戶或交出網銀帳密；在國外遇急難可撥急難救助電話 0800-085095。保安警察第三總隊（2025-02-17 發布）：高薪海外工作的騙局會誘騙民眾前往泰國、緬甸、柬埔寨等地，建議查證徵才公司是否合法立案、確認工作地點與內容、隨時告知國內親友行蹤。","evidence":"B","caveats":"因求職把帳戶交給別人，事後帳戶被列為警示時，要等案件裁判確定後才能解除（見 fraud-011），還可能觸犯《洗錢防制法》（見 fraud-010）。勞動條件與契約問題可諮詢地方勞工局，法律個案請諮詢律師等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第七章 假求職","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=87a85079-c42f-48cb-9506-14e08c912a39","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署保安警察第三總隊防詐專區：當心海外高薪工作、旅遊機會之詐騙陷阱","url":"https://www.3spc.npa.gov.tw/ch/app/data/view?module=govinfo&id=18710&serno=4884ecef-38ff-46b2-8420-d55c23e03d62","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-010","chapter":"fraud","title":"不要把帳戶、提款卡或網銀帳密借給別人，就算對方給錢或說是正當用途","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"把自己的帳戶交給別人用是違法的。第一次可能被警察「告誡」，但只要有約定或收受報酬、交出 3 個以上帳戶，或 5 年內再犯，就可能被判處 3 年以下有期徒刑等刑罰；名下現有帳戶和之後要開的新帳戶，也會被限制使用。","benefit":"《洗錢防制法》（2024-07-31 修正版）第 22 條：任何人不得將自己或他人的金融帳戶、虛擬資產或第三方支付帳號交付、提供給他人使用（符合一般商業、金融交易習慣，或基於親友間信賴關係等正當理由者除外）；違反者由警察機關裁處告誡；有期約或收受對價、交付提供帳戶合計 3 個以上、或經告誡後 5 年內再犯之一者，處 3 年以下有期徒刑、拘役或科或併科新臺幣 100 萬元以下罰金；金融機構等應在一定期間內暫停、限制或關閉違反者已開立或欲開立的新帳戶功能。","evidence":"A","caveats":"這條處罰的是「無正當理由交付帳戶」本身；如果帳戶被拿去收詐騙款，還可能另涉詐欺或洗錢的共犯責任，刑責更重。「正當理由」的範圍要依個案判斷。法條可能修正，以全國法規資料庫最新條文為準。已經交出帳戶的人，請儘快報案並諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"全國法規資料庫：洗錢防制法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380131","type":"法規","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-011","chapter":"fraud","title":"帳戶被列為警示，先弄清楚期限與解除條件，再向權責警察機關申請","cost":{"money":"不花錢；可能要申請聯徵紀錄或判決書","time":"備齊文件後親自到警察機關一次","effort":"中"},"plain":"帳戶被列警示後，所有交易都會停止，你名下其他帳戶也會被限制網銀與提款卡功能。警示 2 年後會自動失效，但想提早解除，要拿出不起訴、無罪等證明，親自到權責警察機關申請。","benefit":"《存款帳戶及其疑似不法或顯屬異常交易管理辦法》（2026-08-31 修正版）：第 3 條定義警示帳戶與衍生管制帳戶（警示帳戶開戶人名下的其他帳戶）；第 5 條規定警示帳戶暫停全部交易功能，衍生管制帳戶暫停提款卡、語音轉帳、網路轉帳及其他電子支付功能，兩種帳戶的匯入款都會退回匯款銀行；第 9 條規定警示期限自通報時起算，逾 2 年自動失效，必要時可延長一次、以 1 年為限。刑事警察局常見問答（2021-10-12 發布）：除期滿自動解除外，可下載「民眾解除警示帳戶申請書」（2021-10-15 起適用），填寫一式二份並攜帶證明文件，親赴權責警察機關辦理。申請書填寫說明：因求職、代辦貸款、租借帳戶等原因把帳戶交給他人而遭警示者，要等案件裁判確定後才能解除。","evidence":"A","caveats":"依申請書填寫說明，被冒名開戶的人申請時需附身分證件與金融聯合徵信中心的信用報告。依上述管理辦法第 11 條，2025 年 4 月 1 日以後通報的警示帳戶，帳戶內剩餘款項的發還改依《金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法》辦理；警示期限與解除程序仍依上述管理辦法。實際處理方式以銀行或警察機關的說明為準。法規可能修正，以全國法規資料庫最新條文為準。帳戶被警示通常代表也可能被追查刑責，個案請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"全國法規資料庫：存款帳戶及其疑似不法或顯屬異常交易管理辦法（修正日期 2026-08-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380199","type":"法規","checked":"2026-11-22"},{"title":"內政部警政署刑事警察局常見問答：如何解除警示帳戶？","url":"https://www.cib.npa.gov.tw/ch/app/faq/view?module=faq&id=18233&serno=8eefc13f-6bf6-4532-b1ac-154167fe59d9","type":"官方","checked":"2026-11-22"},{"title":"刑事警察局：民眾解除警示帳戶申請書與填寫說明（2021-10-15 起適用）","url":"https://www.cib.npa.gov.tw/ch/app/data/doc?module=wg138&detailNo=1351096472531111936&type=s","type":"官方","checked":"2026-11-22"},{"title":"全國法規資料庫：金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法（修正日期 2026-07-20）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380271","type":"法規","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-012","chapter":"fraud","title":"不確定 LINE ID、網站或電話是不是詐騙，先上 165 全民防騙網或 165 LINE 官方帳號查詢","cost":{"money":"不花錢","time":"查詢約 1 分鐘","effort":"低"},"plain":"165 全民防騙網首頁的搜尋欄可以查境外帳戶、詐騙 LINE ID、假投資（博弈）網站、詐騙電話和高風險賣場。查到有紀錄就不要再聯絡。","benefit":"警政署保安警察第七總隊（2022-11-28 發布）：165 全民防騙網自 2022-11-21 起在首頁增設搜尋欄，可即時查詢境外帳戶、詐騙 LINE ID、假投資（博弈）網站、詐騙電話及高風險賣場等涉詐資訊。刑事警察局（頁面更新 2026-11-20）：「165防騙宣導」LINE 官方帳號及 165 全民防騙網可查詢詐騙 LINE ID、假投資（博弈）網站及詐騙電話。","evidence":"A","caveats":"查不到紀錄不代表安全：資料庫只收錄已經被通報的資料，詐團會不斷換新帳號與網址。查到可疑但還沒有紀錄的，可以打 165 諮詢。已經受騙的人，查詢不能取代報案；個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署保安警察第七總隊：165全民防騙網新增境外帳戶、詐騙LINE ID、假投資（博弈）網站、詐騙電話及高風險賣場等資料線上查詢功能（2022-11-28）","url":"https://www.7spc.npa.gov.tw/ch/app/news/view?module=news&id=2705&serno=4f1be6f9-3b4c-400f-a69d-ffd5c9945e04","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第二章 假投資","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a4f8d5ab-3d53-4d22-9411-031fddde7a4e","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署 165 全民防騙網","url":"https://165.npa.gov.tw/","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-013","chapter":"fraud","title":"自稱政府機關的簡訊，先看是不是從「111」發出、開頭有沒有你的手機末 3 碼和機關名稱","cost":{"money":"不花錢","time":"看一眼","effort":"低"},"plain":"政府機關透過「111」短碼發簡訊，只有加入平臺的機關能用這個號碼。從其他號碼發來、說你要繳費或補稅的「政府簡訊」，就要先查證。","benefit":"數位發展部（2023-10-24 新聞稿）：111 政府簡訊平臺當天啟用，只有透過此平臺的政府機關才可以使用 111 短碼發簡訊，民眾認明 111 短碼即可確認簡訊來自政府機關。數位發展部（2024-01-31 新聞稿）：111 簡訊內容必須署名發送機關或服務名稱，含網址時優先使用 gov.tw 網域。數位發展部（2025-06-17 新聞稿）：自 2025 年 6 月起，111 簡訊開頭新增接收者手機號碼末 3 碼及機關名稱，搭配來源號碼形成三層辨識。","evidence":"A","caveats":"官方資料沒有說所有政府簡訊都已改用 111，所以「不是 111 發的」不一定是假的，但這種簡訊更要用機關官網或總機查證，不要直接點簡訊裡的連結；涉及付款時，自己登入機關官方網站處理。帳號與個資相關爭議，個案請諮詢專業人士。","sources":[{"title":"數位發展部新聞稿：蔡總統啟動111政府簡訊平臺 數位部推動數位信任科技從源頭防詐（2023-10-24）","url":"https://moda.gov.tw/press/press-releases/8607","type":"官方","checked":"2026-11-22"},{"title":"數位發展部新聞稿：111政府簡訊已發逾400萬則 30機關響應降低民眾受詐風險（2024-01-31）","url":"https://moda.gov.tw/press/press-releases/10531","type":"官方","checked":"2026-11-22"},{"title":"數位發展部新聞稿：政府111簡訊防詐再升級 新增手機末三碼、機關具名辨識標記（2025-06-17）","url":"https://moda.gov.tw/press/press-releases/16458","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-014","chapter":"fraud","title":"網路貸款廣告要你「美化帳戶」「包裝金流」或先付代辦費，就是詐騙","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"缺錢時看到「保證核貸、信用不良可辦」的廣告，對方會說要先美化帳戶，騙你交出網銀帳密，再拿你的帳戶收贓款。結果借不到錢，名下所有帳戶還被列為警示。","benefit":"刑事警察局（2026-08-08 公告）：IG、FB 上的貸款廣告以「保證核貸、信用不良可辦」吸引民眾加 LINE，再稱需要先進行「帳戶美化」或「金流包裝」，要求提供網銀使用者代碼、密碼；案例中被害人名下所有金融帳戶均被列為警示帳戶與衍生管制帳戶。警方提醒：不要將金融卡、存摺、網銀帳號密碼或驗證碼交付他人，任何宣稱能美化帳戶、包裝金流或要求預先轉帳手續費、代辦費的信貸廣告，都極有可能是詐騙；有疑問撥 165 或 110。","evidence":"B","caveats":"因「代辦貸款」交出帳戶而被警示的人，依刑事警察局解除警示申請書的說明，要等案件裁判確定後才能解除（見 fraud-011），也可能涉及《洗錢防制法》第 22 條（見 fraud-010）。債務與法律個案請諮詢法律扶助基金會等專業人士。","sources":[{"title":"刑事警察局公告：網路找貸款？我來幫你「美化帳戶」缺錢調頭寸反被當成洗錢人頭戶（2026-08-08）","url":"https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=1812d90c-16f4-407c-acc2-047ef1514f2d","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-015","chapter":"fraud","title":"被騙後有「律師」「幣流分析師」說能幫你追回款項，不要相信，也不要再付錢","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"詐團會盯上已經被騙的人，假冒律師或追款專家，再騙一次。被騙的錢只能透過警方報案和法定程序追討，沒有人能私下「駭回來」或「贏回來」。","benefit":"刑事警察局（2026-01-31 公告）：案例中假投資被害人又被自稱國際律師、幣流分析師的人騙，對方稱可操縱博弈 App 後臺「贏回」款項，並煽動被害人抵押房地產加碼，再度被騙百萬元。警方提醒：千萬不要相信自稱可以協助追回詐騙款項的律師或幣流分析師；律師只能擔任訴訟代理人與檢、警和法院溝通；沒有透過公權力無法自行追回，應第一時間向警方報案，判決有罪才有可能追回詐騙款項。另依《金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法》（2026-07-20 修正版）第 52、53 條，警示帳戶內還有被害人匯入且未被提領的剩餘款項時，經司法警察機關書面通知，銀行得發還給被害人，被害人要附身分證明文件、司法警察機關開具的受（處）理案件證明單和切結書，不一定要等判決；第 69 條規定，經銀行等業者認定為疑似交易糾紛或案情複雜的案件，不適用發還程序，應循司法程序。","evidence":"B","caveats":"依刑事警察局說明，律師只能擔任訴訟代理人與檢、警和法院溝通，不能繞過司法程序把錢追回來。《詐欺犯罪危害防制條例》另有被害人法律扶助、調解，以及暫免繳納訴訟費用與執行費的規定，個案請諮詢法律扶助基金會等專業人士。","sources":[{"title":"刑事警察局公告：誤信國際律師與幣流師協追被詐款項 藥師再度遭詐百萬元（2026-01-31）","url":"https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=27a4218c-017e-4aca-93f3-097a0d05df1d","type":"官方","checked":"2026-11-22"},{"title":"全國法規資料庫：詐欺犯罪危害防制條例（修正日期 2026-01-21）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0080226","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：金融機構及提供虛擬資產服務之事業或人員防制詐欺犯罪危害應遵循事項辦法（修正日期 2026-07-20）第 52、53、69 條","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380271","type":"法規","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-016","chapter":"fraud","title":"有人叫你買虛擬貨幣來投資、繳費或「解凍」，先查對方是不是金管會公告完成洗錢防制登記的業者","cost":{"money":"不花錢","time":"查名單約 5 分鐘","effort":"低"},"plain":"假投資詐團常以虛擬通貨為名義吸引民眾（刑事警察局「假投資」一章）。在台灣合法提供虛擬資產服務的業者要向金管會完成洗錢防制登記，而且不能收現金。","benefit":"金管會（2025-09-22 新聞稿）：依 2024-11-30 施行的《洗錢防制法》新制，提供虛擬資產服務的業者應先向金管會完成洗錢防制登記，舊制業者須在 2025 年 9 月底前完成登記才能繼續營業；名單公布在證期局網站。證期局「提供虛擬資產服務之事業或人員」頁面（名單 2026-10-28 更新）列出 11 家已完成洗錢防制登記的業者。金管會（2026-02-17 新聞稿）：合法虛擬資產服務商不得以現金向客戶收取款項，須以可留存金流軌跡的轉帳方式進行。","evidence":"A","caveats":"名單上的業者合法，不代表虛擬資產投資沒有風險，也不代表叫你去該平臺買幣再轉出的人是可信的；只要是陌生人或網友指示你買幣轉給他，就應先停下來打 165。11 家是證期局 2026-10-28 名單的數字，請以證期局最新名單為準。投資決定請諮詢合法持牌的專業人士。","sources":[{"title":"金管會證券期貨局：提供虛擬資產服務之事業或人員（名單 2026-10-28 更新）","url":"https://www.sfb.gov.tw/ch/home.jsp?id=1053&parentpath=0,8","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：金管會公告完成洗錢防制登記之提供虛擬資產服務之事業或人員名單（2025-09-22）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202509220001&dtable=News","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：網路投資群組詐騙多，投資前先停看聽（2026-02-17）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202602130008&dtable=News","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第二章 假投資","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a4f8d5ab-3d53-4d22-9411-031fddde7a4e","type":"官方","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"fraud-017","chapter":"fraud","title":"別接「幫忙領錢、收包裹、轉帳」的工作，當車手或提供帳戶都可能被判刑","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"幫詐騙集團取款、轉帳的「車手」，或把帳戶交出去讓人收錢，都可能吃上官司。拒絕來路不明的「輕鬆工作」，就能避開刑責、前科和帳戶被限制。","benefit":"《中華民國刑法》第 339-4 條（全國法規資料庫現行條文，2026-11-22 查證）：犯詐欺罪而有冒用政府機關或公務員名義、三人以上共同犯之、以網際網路等傳播工具對公眾散布、或以電腦合成等科技方法製作他人不實影像聲音之一者，處 1 年以上 7 年以下有期徒刑，得併科 100 萬元以下罰金，未遂犯也罰。《詐欺犯罪危害防制條例》第 43 條（全國法規資料庫現行條文，2026-11-22 查證）：犯刑法第 339-4 條之罪，使人交付的財物或財產上利益達新臺幣 100 萬元者，處 3 年以上 10 年以下有期徒刑，得併科 3,000 萬元以下罰金；達 1,000 萬元者，處 5 年以上 12 年以下有期徒刑，得併科 3 億元以下罰金；達 1 億元者，處 7 年以上有期徒刑，得併科 5 億元以下罰金。《洗錢防制法》（2024-07-31 修正版）第 22 條：無正當理由把帳戶交給他人使用，先由警察裁處告誡；有期約或收受對價、交付 3 個以上帳戶、或 5 年內再犯之一者，處 3 年以下有期徒刑、拘役或科或併科 100 萬元以下罰金（詳見 fraud-010）。","evidence":"A","caveats":"車手實際會依哪一條、哪個刑度處罰，要看是否知情、參與程度、詐騙金額與人數等個案事實，由法院判斷，這裡只列出法條本身。第 22 條另規定警察裁處告誡時，若知道當事人有社會救助需要，要通報社福機關協助。法條可能修正，以全國法規資料庫最新條文為準。已經被找去當車手或交出帳戶的人，請儘快諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"全國法規資料庫：中華民國刑法第 339-4 條","url":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=C0000001&flno=339-4","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：洗錢防制法第 22 條","url":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=G0380131&flno=22","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：詐欺犯罪危害防制條例第 43 條","url":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=D0080226&flno=43","type":"法規","checked":"2026-11-22"}],"status":"reviewed","updated":"2026-11-22"},{"id":"labor-001","chapter":"labor","title":"加班後可以選補休，但補休到期沒休完，雇主要照加班當天的標準付加班費","cost":{"money":"不花錢","time":"確認公司約定的特休年度和自己的補休紀錄，約 10 分鐘","effort":"低"},"plain":"加班要換補休還是領加班費，要你自己願意、雇主也同意才算，雇主不能片面規定只能補休。補休到期或離職時還沒休完的時數，雇主要換算成加班費付給你。","benefit":"勞動部說明（「加班補休規定」更新日期 2024-12-31；「勞動基準法權益簡介」更新日期 2026-01-01）：平日延長工時前 2 小時加給 1/3 以上，再延長 2 小時加給 2/3 以上；休息日出勤前 2 小時另再加給 1又1/3，第 3 至 8 小時另再加給 1又2/3，第 9 至 12 小時另再加給 2又2/3。補休最晚要在勞雇雙方約定的特別休假年度末日前休完，不能再往後延；沒休完的時數，依加班當天的工資計算標準發給工資。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工，自己的工作適不適用，可以問勞動部或地方勞工局。補休期限以勞雇雙方約定的特休年度為準（曆年制、週年制等）。法令可能修正，以全國法規資料庫的最新條文為準。和雇主有爭議時，個案請諮詢地方勞工局或律師。","sources":[{"title":"勞動部：加班補休規定","url":"https://www.mol.gov.tw/1607/28162/28166/28180/28198/28202/47031/post","type":"官方","checked":"2026-11-21"},{"title":"勞動部：勞動基準法權益簡介","url":"https://www.mol.gov.tw/1607/28162/28166/28168/28170/28989/post","type":"官方","checked":"2026-11-21"}],"status":"draft","updated":"2026-11-21"},{"id":"labor-002","chapter":"labor","title":"被資遣時，先確認雇主有沒有依年資提前預告；沒預告，要付預告期間的工資","cost":{"money":"不花錢","time":"對照自己的到職日算年資，約 10 分鐘","effort":"低"},"plain":"雇主依法資遣你，要依你的年資提前 10 到 30 天通知；預告期間你可以請假去找工作，工資照付。雇主沒有照規定預告就終止契約，要付預告期間的工資。","benefit":"《勞動基準法》（2024-07-31 修正版）第 16 條：繼續工作 3 個月以上未滿 1 年，10 日前預告；1 年以上未滿 3 年，20 日前預告；3 年以上，30 日前預告。接到預告後可請假外出找工作，每星期請假時數不得超過 2 日的工作時間，請假期間工資照給。雇主未依規定期間預告而終止契約，應給付預告期間的工資。違反第 16 條，依第 79 條處新臺幣 2 萬元以上 30 萬元以下罰鍰。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。第 16 條的預告期間適用雇主依第 11 條或第 13 條但書終止契約的情形，因第 12 條事由（例如無正當理由繼續曠工 3 日）被解僱的不在此列。年資未滿 3 個月的，條文沒有規定預告期間。法令可能修正，以全國法規資料庫的最新條文為準。個案請諮詢地方勞工局或律師。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-003","chapter":"labor","title":"被資遣時，依退休金制度算資遣費：新制每滿 1 年給半個月平均工資，最多 6 個月；雇主要在 30 日內發給","cost":{"money":"不花錢","time":"找出自己的到職日、適用新制或舊制、最近 6 個月薪資，約 30 分鐘","effort":"低"},"plain":"被資遣可以拿資遣費。適用勞退新制的年資，每滿 1 年給半個月平均工資，最多給 6 個月；適用勞基法舊制的年資，每滿 1 年給 1 個月平均工資。兩種都要在契約終止後 30 日內發給。","benefit":"《勞工退休金條例》（2019-05-15 修正版）第 12 條：適用本條例後的工作年資，依勞動基準法第 11 條、第 13 條但書、第 14 條及第 20 條等規定終止契約時，每滿 1 年發給 1/2 個月平均工資，未滿 1 年以比例計給，最高 6 個月平均工資，應於終止契約後 30 日內發給。《勞動基準法》（2024-07-31 修正版）第 17 條：舊制年資每滿 1 年發給相當於 1 個月平均工資，未滿 1 年以比例計給，未滿 1 個月以 1 個月計，雇主應於終止勞動契約 30 日內發給。勞動部「新制資遣費」頁（更新日期 2026-06-23）：平均工資指計算事由發生當日前 6 個月內所得工資總額除以該期間總日數。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。新制適用對象依勞動部說明，是 2005-07-01（民國 94 年 7 月 1 日）以後選擇新制、初次就業、離職再受僱等勞工；勞退提繳本身請詳見 pension 章。法令可能修正，以全國法規資料庫的最新條文為準。實際金額有爭議時，個案請諮詢地方勞工局或律師。","sources":[{"title":"全國法規資料庫：勞工退休金條例（修正日期 2019-05-15）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030020","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"},{"title":"勞動部：新制資遣費","url":"https://www.mol.gov.tw/1607/28162/28540/28564/28568/30457/post","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-004","chapter":"labor","title":"雇主只能依勞基法列出的 5 種情形資遣勞工，被資遣時先問清楚是哪一款","cost":{"money":"不花錢","time":"請雇主說明資遣事由，約 10 分鐘","effort":"低"},"plain":"雇主不能隨便資遣人，要符合勞基法第 11 條列出的情形之一。先請雇主說清楚是依哪一款，之後要申請資遣費、非自願離職證明或提出爭議時都用得到。","benefit":"《勞動基準法》（2024-07-31 修正版）第 11 條：非有下列情事之一者，雇主不得預告勞工終止勞動契約：一、歇業或轉讓時；二、虧損或業務緊縮時；三、不可抗力暫停工作在 1 個月以上時；四、業務性質變更，有減少勞工之必要，又無適當工作可供安置時；五、勞工對於所擔任之工作確不能勝任時。另依第 12 條，勞工有該條所列 6 款情形（例如無正當理由繼續曠工 3 日，或 1 個月內曠工達 6 日者），雇主得不經預告終止契約。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。是否真的符合「虧損」「業務緊縮」「確不能勝任」等要件，條文沒有寫出判斷標準，要看個案事實，可能要經過勞資爭議調解或法院認定。法令可能修正，以全國法規資料庫的最新條文為準。個案請諮詢地方勞工局或律師。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-005","chapter":"labor","title":"雇主不依約付薪或違反勞工法令，你可以不經預告終止契約，並請求資遣費","cost":{"money":"不花錢","time":"整理欠薪或違法事證、寫書面通知，約 1–2 小時","effort":"中"},"plain":"如果雇主不依契約付薪水，或違反勞動契約、勞工法令而可能損害你的權益，你可以自己主動終止契約，而且一樣可以請求資遣費。這和一般的自請離職不同，離職時要寫清楚是依勞基法第 14 條哪一款終止。","benefit":"《勞動基準法》（2024-07-31 修正版）第 14 條第 1 項：第 5 款「雇主不依勞動契約給付工作報酬」、第 6 款「雇主違反勞動契約或勞工法令，致有損害勞工權益之虞者」等情形，勞工得不經預告終止契約；第 2 項：依第 1 款、第 6 款終止契約者，應自知悉其情形之日起 30 日內為之；第 4 項：第 17 條（資遣費）規定於本條終止契約準用之。《就業保險法》（2022-01-12 修正版）第 11 條第 3 項：依勞動基準法第 14 條各款情事之一離職，屬於「非自願離職」。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。第 1 款與第 6 款有 30 日的期限，超過可能無法再用這兩款終止。雇主是否構成違法，要看個案事實，建議先保留薪資明細、出勤紀錄等證據（見 labor-010），並在終止前先諮詢地方勞工局或律師。法令可能修正，以全國法規資料庫的最新條文為準。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：就業保險法（修正日期 2022-01-12）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050021","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-006","chapter":"labor","title":"離職時可以要求雇主開服務證明書；被資遣的人，雇主要在離職 10 日前向主管機關通報","cost":{"money":"不花錢","time":"向雇主或人資提出申請，約 10 分鐘","effort":"低"},"plain":"不管是被資遣還是自己離職，你都可以要求雇主開服務證明書，雇主不能拒絕。被資遣的人，雇主還要依法向勞工局和公立就業服務機構通報；之後申請失業給付時，要準備離職證明文件，失業給付怎麼申請，詳見 broke 章。","benefit":"《勞動基準法》（2024-07-31 修正版）第 19 條：勞動契約終止時，勞工如請求發給服務證明書，雇主或其代理人不得拒絕；違反者依第 79 條處新臺幣 2 萬元以上 30 萬元以下罰鍰。《就業服務法》（2025-01-20 修正版）第 33 條第 1 項：雇主資遣員工時，應於員工離職的 10 日前，將被資遣員工的姓名、資遣事由等列冊通報當地主管機關及公立就業服務機構；因天災、事變或其他不可抗力所致者，應自離職之日起 3 日內為之。勞動部說明（更新日期 2026-09-03）：未依規定通報者，處新臺幣 3 萬元以上 15 萬元以下罰鍰。《就業保險法》（2022-01-12 修正版）第 11 條第 3 項：因投保單位關廠、遷廠、休業、解散、破產宣告，或因勞動基準法第 11 條、第 13 條但書、第 14 條及第 20 條各款情事之一離職，屬於「非自願離職」。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。法條規定的是「服務證明書」；申請失業給付要檢附的離職證明文件格式，以勞動部勞動力發展署與公立就業服務機構的說明為準。自願離職不屬於就業保險法第 11 條第 3 項的非自願離職。法令可能修正，以全國法規資料庫的最新條文為準。個案請諮詢地方勞工局或公立就業服務機構。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：就業服務法（修正日期 2025-01-20）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0090001","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：就業保險法（修正日期 2022-01-12）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050021","type":"法規","checked":"2026-11-22"},{"title":"勞動部：雇主資遣勞工時，應如何辦理資遣通報？未依規定通報時，會有罰則嗎？","url":"https://www.mol.gov.tw/1607/28690/2282/2326/2288/7104/post","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-007","chapter":"labor","title":"特休天數依年資計算，由你自己排定；年度結束或離職時沒休完的天數，雇主要折算工資","cost":{"money":"不花錢","time":"對照到職日查自己的特休天數，約 10 分鐘","effort":"低"},"plain":"做滿 6 個月就有特休，年資越長天數越多。特休日期由勞工自己排；到年度結束或離職時還沒休完的天數，雇主要發工資。","benefit":"《勞動基準法》（2024-07-31 修正版）第 38 條第 1 項：在同一雇主或事業單位繼續工作滿一定期間，6 個月以上未滿 1 年，3 日；1 年以上未滿 2 年，7 日；2 年以上未滿 3 年，10 日；3 年以上未滿 5 年，每年 14 日；5 年以上未滿 10 年，每年 15 日；10 年以上，每 1 年加給 1 日，加至 30 日為止。第 2 項：特別休假期日由勞工排定。第 4 項：因年度終結或契約終止而未休的日數，雇主應發給工資。違反第 38 條，依第 79 條處新臺幣 2 萬元以上 100 萬元以下罰鍰。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。依第 38 條第 2 項但書，雇主基於企業經營上的急迫需求或勞工因個人因素，得與他方協商調整；第 4 項但書：年度終結未休的日數，經勞雇雙方協商可遞延至次一年度實施，次一年度終結或契約終止仍未休的日數，雇主應發給工資。特休年度怎麼算（週年制、曆年制等）依勞雇約定。法令可能修正，以全國法規資料庫的最新條文為準。個案請諮詢地方勞工局。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-008","chapter":"labor","title":"2026 年起每月最低工資 29,500 元、每小時 196 元，打工族也要對照自己的時薪","cost":{"money":"不花錢","time":"對照薪資單，約 5 分鐘","effort":"低"},"plain":"雇主付的薪水不能低於最低工資，月薪和時薪都有下限。打工、兼職按時計薪的人，可以直接拿時薪對照。","benefit":"勞動部「基本（最低）工資的意義」（更新日期 2026-01-01）：115 年（2026 年）1 月 1 日起，每月最低工資為新臺幣 29,500 元，每小時最低工資為 196 元；自 114 年（2025 年）1 月 1 日起，基本工資由最低工資取代。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。金額每年可能調整，這裡是 2026 年的數字，以勞動部最新公告為準。月薪是否含加班費或其他給付才達到最低工資，計算方式有爭議時，個案請諮詢地方勞工局。","sources":[{"title":"勞動部：基本（最低）工資的意義","url":"https://www.mol.gov.tw/1607/28162/28166/28180/99861/28188/29025/post","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-009","chapter":"labor","title":"正常工時每天 8 小時、每週 40 小時；連同加班一天不超過 12 小時，每做 4 小時至少休 30 分鐘","cost":{"money":"不花錢","time":"對照班表與出勤紀錄，約 10 分鐘","effort":"低"},"plain":"勞基法對每天、每週能工作多久，以及加班時數上限、休息時間都有規定。對照自己的班表，就知道有沒有超時。加班費怎麼算見 labor-001。","benefit":"《勞動基準法》（2024-07-31 修正版）第 30 條第 1 項：正常工作時間每日不得超過 8 小時，每週不得超過 40 小時。第 32 條第 2 項：延長工時連同正常工時，一日不得超過 12 小時；延長工時一個月不得超過 46 小時（同項另有例外規定）。第 35 條：勞工繼續工作 4 小時，至少應有 30 分鐘的休息（同條另有例外規定）。第 36 條第 1 項：勞工每 7 日中應有 2 日的休息，其中 1 日為例假，1 日為休息日。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。勞動基準法另有變形工時等例外規定，適用時上述規定會不同，要看公司依哪一條、是否依法約定。法令可能修正，以全國法規資料庫的最新條文為準。個案請諮詢地方勞工局。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-010","chapter":"labor","title":"保留薪資明細和出勤紀錄；你可以向雇主要出勤紀錄的副本，雇主不得拒絕","cost":{"money":"不花錢","time":"每月存一份薪資明細、拍下或申請出勤紀錄，每月約 5 分鐘","effort":"低"},"plain":"發生欠薪、加班費或資遣費爭議時，薪資明細和出勤紀錄是重要的證據。雇主依法要給你工資計算明細，也要保存出勤紀錄 5 年；你申請出勤紀錄副本時，雇主不能拒絕。","benefit":"《勞動基準法》（2024-07-31 修正版）第 23 條第 1 項：工資除當事人有特別約定或按月預付者外，每月至少定期發給 2 次，並應提供工資各項目計算方式明細；第 2 項：工資清冊應保存 5 年。第 30 條第 5 項：雇主應置備勞工出勤紀錄，並保存 5 年；第 6 項：出勤紀錄應逐日記載至分鐘為止，勞工申請出勤紀錄副本或影本時，雇主不得拒絕。違反第 23 條，依第 79 條處新臺幣 2 萬元以上 100 萬元以下罰鍰。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。自己另外蒐集證據（例如錄音、截圖）是否合法、能否在法院採用，要看個案情形，這裡不寫。法令可能修正，以全國法規資料庫的最新條文為準。個案請諮詢地方勞工局或律師。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-011","chapter":"labor","title":"雇主違反勞基法時可以向勞工局申訴；雇主不得因此解僱或減薪，主管機關要在 60 日內書面回覆","cost":{"money":"撥打 1955 免付費","time":"打電話或寫申訴書，約 30 分鐘","effort":"低"},"plain":"發現公司違反勞動法令，可以向雇主、地方勞工局或勞動檢查機構申訴，也可以打 1955 勞工諮詢申訴專線。法律禁止雇主因為你申訴就解僱、降調或減薪。","benefit":"《勞動基準法》（2024-07-31 修正版）第 74 條第 1 項：勞工發現事業單位違反本法及其他勞工法令規定時，得向雇主、主管機關或檢查機構申訴；第 2 項：雇主不得因勞工申訴而予以解僱、降調、減薪、損害其權益或其他不利之處分；第 4 項：主管機關或檢查機構接獲申訴後，應為必要調查，並於 60 日內將處理情形以書面通知勞工；第 5 項：主管機關或檢查機構應對申訴人身分資料嚴守秘密，不得洩漏足以識別其身分之資訊。違反第 74 條第 2 項，依第 79 條處新臺幣 2 萬元以上 30 萬元以下罰鍰。勞動部 2017-08-24 新聞稿：1955 專線自 105 年（2016 年）11 月 7 日更名為「1955 勞工諮詢專線」，同時提供本國勞工諮詢申訴服務，為免付費專線。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。第 74 條第 5 項的保密義務是規範主管機關與檢查機構；向雇主內部申訴時，雇主怎麼處理申訴人資料，該項沒有規定。1955 專線的服務時段與內容以勞動部最新說明為準。要不要同時申請勞資爭議調解（見 labor-012），個案請諮詢地方勞工局或律師。法令可能修正，以全國法規資料庫的最新條文為準。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"},{"title":"勞動部：「1955專線」106年上半年執行成效","url":"https://www.mol.gov.tw/1607/1632/1640/44053/post","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-012","chapter":"labor","title":"和雇主談不攏時，向工作地的縣市政府申請勞資爭議調解，免費，調解成立視為雙方的契約","cost":{"money":"免費","time":"填調解申請書、出席調解，約半天到一天","effort":"中"},"plain":"欠薪、資遣費、加班費等爭議，可以向你工作地的縣市政府申請調解，由調解人或調解委員會協助雙方談。調解成立的內容，法律上視為雙方的契約；調解期間雇主不得因這件爭議解僱你。","benefit":"《勞資爭議處理法》（2021-04-28 修正版）第 5 條第 2 款：權利事項的勞資爭議，指勞資雙方基於法令、團體協約、勞動契約的規定所為權利義務的爭議。第 9 條第 1 項：申請調解時，應向勞方勞務提供地的直轄市或縣（市）主管機關提出調解申請書。第 11 條第 1 項：主管機關可指派調解人或組成勞資爭議調解委員會。第 23 條：調解成立者，視為爭議雙方當事人間的契約。第 8 條：調解、仲裁或裁決期間，資方不得因該勞資爭議事件而歇業、停工、終止勞動契約或為其他不利於勞工之行為。勞動部「勞資爭議」頁（更新日期 2024-02-16）：調解提供勞資雙方及時、便捷、保密且免費的紛爭處理途徑。","evidence":"A","caveats":"調解要雙方都同意方案才會成立；調解不成立時後續怎麼處理，請問受理調解的地方主管機關。法令可能修正，以全國法規資料庫的最新條文為準。個案請諮詢地方勞工局或律師。","sources":[{"title":"全國法規資料庫：勞資爭議處理法（修正日期 2021-04-28）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0020007","type":"法規","checked":"2026-11-22"},{"title":"勞動部：勞資爭議","url":"https://www.mol.gov.tw/1607/28162/28296/28410/","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-013","chapter":"labor","title":"發生職災時，拿職業傷病醫療書單以「職災勞工」身分就醫；拿不到就先用健保看診，保留收據 5 年內申請核退","cost":{"money":"以職災身分就醫時，醫療費用由勞保局支付給健保署；先以健保身分就醫者，要先自行墊付，之後再申請核退","time":"向雇主或勞保局拿醫療書單，約半天","effort":"中"},"plain":"上班或執行工作時受傷、得職業病，就醫時拿職業傷病門診單或住院申請書，以「職災勞工」身分看診。雇主不開或來不及拿，可以到勞保局辦事處現場申請，或先用健保看診、保留收據和診斷書，之後再向勞保局申請核退。","benefit":"《勞工職業災害保險及保護法》（2021-04-30 公布，勞動部說明自 2022-05-01 施行）第 38 條第 3 項：被保險人遭遇職業傷病時，應至全民健康保險特約醫院或診所診療，醫療費用由保險人支付予全民健康保險保險人；第 37 條：保險給付請求權自得請領之日起，5 年間不行使而消滅。勞動部 2026-03-31 新聞稿：持醫療書單以「職災勞工」身分就醫，並享有住院 30 日內膳食費的補助；可攜相關證明文件到勞保局辦事處，查明確認後現場發給；也可先以健保身分就醫，保留醫療收據及診斷書，於 5 年請求權時效內向勞保局申請核退墊付的醫療費用。","evidence":"A","caveats":"依勞動部說明，到勞保局辦事處申請醫療書單時，要經人員查明確認後才會發給。依該法第 6 條第 1 項，受僱於領有執業證照、依法已辦理登記、設有稅籍等雇主的 15 歲以上勞工，應以雇主為投保單位；其他身分的投保方式，請以勞保局說明為準。健康狀況請先問醫師；給付有爭議時，個案請諮詢勞保局（02-2396-1266）或地方勞工局。法令可能修正，以全國法規資料庫的最新條文為準。","sources":[{"title":"全國法規資料庫：勞工職業災害保險及保護法（公布日期 2021-04-30）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050031","type":"法規","checked":"2026-11-22"},{"title":"勞動部：無法取得職業傷病醫療書單免煩惱，3招守住職災就醫權益","url":"https://www.mol.gov.tw/1607/1632/1633/89712/post","type":"官方","checked":"2026-11-22"},{"title":"勞動部：勞工職業災害保險","url":"https://www.mol.gov.tw/topic/48129/","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-014","chapter":"labor","title":"職災不能工作第 4 天起可以請傷病給付：前 2 個月領平均月投保薪資全額，第 3 個月起領 70%，最長 2 年","cost":{"money":"不花錢","time":"填申請書、附診斷書，約 1 小時","effort":"中"},"plain":"因為職災不能上班、也沒領到原本薪水的期間，可以向勞保局請傷病給付。就算雇主沒幫你投保，法律也有規定怎麼認定你的投保薪資，並由勞保局向雇主追繳。","benefit":"《勞工職業災害保險及保護法》（2021-04-30 公布）第 42 條：被保險人遭遇職業傷病不能工作，致未能取得原有薪資，正在治療中者，自不能工作之日起算第 4 日起，得請領傷病給付；前 2 個月按平均月投保薪資發給，第 3 個月起按平均月投保薪資 70% 發給，每半個月給付一次，最長以 2 年為限。第 28 條第 4 項：投保單位未依規定辦理投保且發生保險事故者，該期間的月投保薪資由保險人按月薪資總額對應的投保薪資分級表等級認定。第 36 條：保險人發給保險給付後，以書面行政處分令未依規定投保的投保單位限期繳納。第 96 條：投保單位或雇主未依規定為勞工辦理投保、退保，處新臺幣 2 萬元以上 10 萬元以下罰鍰。","evidence":"A","caveats":"勞動部網站部分舊頁面寫的是 2022-05-01 以前《勞工保險條例》的舊規定（第 4 日起按 70% 發給），勞動部已標示該制度自 2022-05-01 起停止適用；之後的規定以《勞工職業災害保險及保護法》為準。勞保其他給付與年金請詳見 pension 章。健康狀況請先問醫師；給付有爭議時，個案請諮詢勞保局或地方勞工局。法令可能修正，以全國法規資料庫的最新條文為準。","sources":[{"title":"全國法規資料庫：勞工職業災害保險及保護法（公布日期 2021-04-30）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050031","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-015","chapter":"labor","title":"職災期間，雇主還要補償醫療費用和原領工資，可以和保險給付相抵","cost":{"money":"不花錢","time":"整理醫療收據與薪資紀錄，約 1 小時","effort":"中"},"plain":"除了勞保局的職災保險給付，勞基法也要求雇主負擔職災補償：必要的醫療費用，以及醫療中不能工作期間的原領工資。雇主已經為同一事故支付的保險費用補償，可以抵充。","benefit":"《勞動基準法》（2024-07-31 修正版）第 59 條：勞工因遭遇職業災害而致死亡、失能、傷害或疾病時，雇主應依下列規定予以補償；但同一事故依勞工保險條例或其他法令規定，已由雇主支付費用補償者，雇主得予以抵充。第 1 款：雇主應補償其必需之醫療費用。第 2 款：勞工在醫療中不能工作時，雇主應按其原領工資數額予以補償；醫療期間屆滿 2 年仍未能痊癒，經指定之醫院診斷，審定為喪失原有工作能力，且不合第 3 款之失能給付標準者，雇主得一次給付 40 個月的平均工資後，免除此項工資補償責任。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。第 59 條另有失能補償與死亡補償的規定，這裡沒有寫。補償金額怎麼和保險給付抵充，要依個案計算。法令可能修正，以全國法規資料庫的最新條文為準。健康狀況請先問醫師；與雇主有爭議時，個案請諮詢地方勞工局或律師。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-016","chapter":"labor","title":"簽離職後競業禁止條款前，先對照勞基法的 4 個要件；最長不得超過 2 年，不符合的約定無效","cost":{"money":"不花錢","time":"讀契約條款，約 30 分鐘","effort":"低"},"plain":"公司要你簽「離職後不能到同業工作」的條款，法律有限制：要有合理補償、合理範圍等 4 個條件都符合，期間最長 2 年。不符合其中任一條件的約定無效。","benefit":"《勞動基準法》（2024-07-31 修正版）第 9 條之 1 第 1 項：未符合下列規定者，雇主不得與勞工為離職後競業禁止之約定：一、雇主有應受保護之正當營業利益；二、勞工擔任的職位或職務能接觸或使用雇主的營業秘密；三、競業禁止的期間、區域、職業活動範圍及就業對象，未逾合理範疇；四、雇主對勞工因不從事競業行為所受損失有合理補償。第 3 項：違反第 1 項各款規定之一者，其約定無效。第 4 項：離職後競業禁止的期間，最長不得逾 2 年。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工：依勞動基準法第 3 條第 3 項，經勞動部指定公告「適用確有窒礙難行」的行業或工作者不適用，自己是否適用可以問地方勞工局。「合理範疇」「合理補償」的具體標準，條文沒有寫出數字，要依個案判斷。法令可能修正，以全國法規資料庫的最新條文為準。簽約前或發生爭議時，個案請諮詢律師。","sources":[{"title":"全國法規資料庫：勞動基準法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-017","chapter":"labor","title":"在職場遭受性騷擾，先向雇主申訴；被申訴人是最高負責人或雇主沒處理時，可以直接向地方主管機關申訴","cost":{"money":"不花錢","time":"寫申訴書、整理證據，約 1–2 小時","effort":"中"},"plain":"雇主依法要採取措施防治性騷擾，知道有性騷擾時要立即處理。一般情形先向雇主申訴；如果騷擾你的人就是老闆，或雇主沒有處理，可以直接向縣市政府申訴。","benefit":"《性別平等工作法》（2023-08-16 修正版）第 13 條第 1 項：雇主應採取適當之措施，防治性騷擾之發生；第 2 項：雇主於知悉性騷擾之情形時，應採取立即有效之糾正及補救措施。第 32 條之 1 第 1 項：受僱者或求職者遭受性騷擾，應向雇主提起申訴；但被申訴人屬最高負責人或僱用人，或雇主未處理或不服被申訴人之雇主所為調查或懲戒結果等情形之一者，得逕向地方主管機關提起申訴。","evidence":"A","caveats":"這條只寫出申訴管道，申訴期限等其他程序，請讀《性別平等工作法》第 32 條之 1 全文或問地方主管機關，這裡沒有寫出。法令可能修正，以全國法規資料庫的最新條文為準。個案請諮詢地方勞工局或律師；需要身心支持時可以尋求專業協助。","sources":[{"title":"全國法規資料庫：性別平等工作法（修正日期 2023-08-16）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030014","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"}]}</script>

      contentNote: "",
      toc: "章節目錄", allChapters: "全部章節",
      search: "搜尋", searchPh: "輸入關鍵字，例如：加班、165",
      evidence: "證據等級", money: "花費", time: "時間成本",
      all: "全部", free: "不花錢或免費", paid: "可能要花錢",
      timeShort: "幾分鐘內就能做", timeLong: "要花較多時間",
      evA: "A：法律、官方制度或大型試驗", evB: "B：觀察性研究、官方統計", evC: "C：專家建議、證據有限",
      evShort: { A: "證據 A", B: "證據 B", C: "證據 C" },
      count: function (n, t) { return "顯示 " + n + " 條，共 " + t + " 條"; },
      reset: "清除篩選",
      empty: "沒有符合條件的建議。試試換個關鍵字或放寬篩選。",
      status: { planned: "規劃中", writing: "撰寫中", done: "完成", pending: "待決定" },
      noItems: "這一章還沒有內容。",
      waiting: "還沒有內容的章節（點了可以看簡介）：",
      draft: "待查核", draftTitle: "草稿：內容尚未經第二人查核",
      costMoney: "花錢", costTime: "花時間", costEffort: "力氣",
      effort: { "低": "低", "中": "中", "高": "高" },
      benefit: "具體數字", caveats: "不適用或要注意的人", sources: "來源",
      checked: "查證日期", updated: "最後修改", type: { "官方": "官方", "法規": "法規", "期刊": "期刊" },
      items: function (n) { return n + " 條"; },
      themeAuto: "主題：自動", themeLight: "主題：淺色", themeDark: "主題：深色",
      langBtn: "English", filtersLabel: "篩選", tocLabel: "章節目錄"
    },
    en: {
      title: "Taiwan Life Value Guide",
      subtitle: "Each tip says what it costs, what you get back, and how strong the evidence is. Sources are limited to Taiwan government sites, law databases and peer-reviewed journals.",
      disclaimerTitle: "Disclaimer: ",
      disclaimerTop: "For reference only. This is not medical, legal or financial advice. Ask a doctor about health questions, and a professional about your own legal or money situation. Laws and amounts change: follow the linked sources and note each tip's check date.",
      disclaimerBottom: "For reference only; not medical, legal or financial advice. Written by volunteers, so it may contain errors or be out of date. The project is not responsible for decisions made from it. Please report mistakes on GitHub.",
      attribution: 'Adapted from HowToLiveBetter by eternity4719 and rewritten for Taiwan\'s laws and systems. Not an official version. See <a href="' + REPO + '/blob/main/NOTICE.md">NOTICE.md</a>.',
      license: 'Content under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, code under <a href="' + REPO + '/blob/main/LICENSE-CODE">MIT</a>. Source and data: <a href="' + REPO + '">ckolpeter/HowToLiveBetter-TW</a>.',
      contentNote: "Note: the tips and chapter introductions are written in Traditional Chinese for Taiwan. Only the interface is translated.",
      toc: "Chapters", allChapters: "All chapters",
      search: "Search", searchPh: "Type a keyword, e.g. 加班, 165",
      evidence: "Evidence", money: "Money", time: "Time",
      all: "All", free: "Free", paid: "May cost money",
      timeShort: "Takes minutes", timeLong: "Takes longer",
      evA: "A: law, official program or large trials", evB: "B: observational studies, official statistics", evC: "C: expert opinion, limited evidence",
      evShort: { A: "Evidence A", B: "Evidence B", C: "Evidence C" },
      count: function (n, t) { return "Showing " + n + " of " + t + " tips"; },
      reset: "Clear filters",
      empty: "No tips match. Try another keyword or fewer filters.",
      status: { planned: "Planned", writing: "In progress", done: "Done", pending: "Undecided" },
      noItems: "No tips in this chapter yet.",
      waiting: "Chapters without tips yet (tap to see the introduction):",
      draft: "Not yet reviewed", draftTitle: "Draft: not yet checked by a second person",
      costMoney: "Money", costTime: "Time", costEffort: "Effort",
      effort: { "低": "Low", "中": "Medium", "高": "High" },
      benefit: "Numbers", caveats: "Who should be careful", sources: "Sources",
      checked: "Checked", updated: "Last edited", type: { "官方": "Official", "法規": "Law", "期刊": "Journal" },
      items: function (n) { return n + (n === 1 ? " tip" : " tips"); },
      themeAuto: "Theme: auto", themeLight: "Theme: light", themeDark: "Theme: dark",
      langBtn: "中文", filtersLabel: "Filters", tocLabel: "Chapters"
    }
  };

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, value);
    } catch (e) { return null; }
    return null;
  }

  var savedTheme = store("htlb-theme");
  var state = {
    lang: store("htlb-lang") === "en" ? "en" : "zh",
    theme: savedTheme === "light" || savedTheme === "dark" ? savedTheme : "auto",
    q: "", chapter: "", evidence: "", money: "", time: ""
  };

  function t(key) { return I18N[state.lang][key]; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeUrl(u) { return /^https:\/\//i.test(u) ? u : "#"; }
  function name(obj) { return state.lang === "en" ? obj.title_en : obj.title; }
  function chapterById(id) { for (var i = 0; i < chapters.length; i++) if (chapters[i].id === id) return chapters[i]; return null; }
  function itemsOf(id) { return items.filter(function (it) { return it.chapter === id; }); }

  // Money and time filters read the free-text cost fields, so they are approximate.
  function isFree(it) { return /^(不花錢|免費|0\s*元)/.test((it.cost || {}).money || ""); }
  function isQuick(it) {
    var s = (it.cost || {}).time || "";
    if (/\d\s*(小時|天|週|周|個月|年)|[一二三四五六七八九十幾半]\s*(小時|天|週|周|個月|年)|每天|每週|每月|持續|長期/.test(s)) return false;
    return /秒|分鐘|一通電話|一次/.test(s);
  }

  function filtersActive() { return !!(state.q.trim() || state.evidence || state.money || state.time); }

  function matches(it) {
    if (state.chapter && it.chapter !== state.chapter) return false;
    if (state.evidence && it.evidence !== state.evidence) return false;
    if (state.money === "free" && !isFree(it)) return false;
    if (state.money === "paid" && isFree(it)) return false;
    if (state.time === "short" && !isQuick(it)) return false;
    if (state.time === "long" && isQuick(it)) return false;
    var q = state.q.trim().toLowerCase();
    if (!q) return true;
    var ch = chapterById(it.chapter) || {};
    var hay = [it.id, it.title, it.plain, it.benefit, it.caveats, ch.title, ch.title_en,
      (it.cost || {}).money, (it.cost || {}).time]
      .concat((it.sources || []).map(function (s) { return s.title; })).join(" ").toLowerCase();
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function statusChip(ch, count) {
    var key = ch.status;
    if (key === "done" || !t("status")[key]) return "";
    return '<span class="chip ' + esc(key) + '">' + esc(t("status")[key]) + "</span>";
  }

  function card(it) {
    var c = it.cost || {};
    var srcs = (it.sources || []).map(function (s) {
      return '<li><a href="' + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(s.title) + "</a>" +
        '<div class="src-meta">' + esc(t("type")[s.type] || s.type) + " · " + esc(t("checked")) + " " + esc(s.checked) + "</div></li>";
    }).join("");
    var draft = it.status === "draft" ? '<span class="draft" title="' + esc(t("draftTitle")) + '">' + esc(t("draft")) + "</span>" : "";
    return '<article class="card" id="' + esc(it.id) + '">' +
      '<div class="meta"><span class="ev ev-' + esc(it.evidence) + '" title="' + esc(t("ev" + it.evidence)) + '">' + esc(t("evShort")[it.evidence] || it.evidence) + "</span>" +
      draft + '<span class="id">' + esc(it.id) + "</span></div>" +
      "<h4>" + esc(it.title) + "</h4>" +
      '<p class="plain">' + esc(it.plain) + "</p>" +
      "<dl><dt>" + esc(t("costMoney")) + "</dt><dd>" + esc(c.money) + "</dd>" +
      "<dt>" + esc(t("costTime")) + "</dt><dd>" + esc(c.time) + "</dd>" +
      "<dt>" + esc(t("costEffort")) + "</dt><dd>" + esc(t("effort")[c.effort] || c.effort) + "</dd></dl>" +
      '<p class="section-label">' + esc(t("benefit")) + '</p><p class="block">' + esc(it.benefit) + "</p>" +
      '<p class="section-label">' + esc(t("caveats")) + '</p><p class="block caveats">' + esc(it.caveats) + "</p>" +
      '<p class="section-label">' + esc(t("sources")) + '</p><ol class="sources">' + srcs + "</ol>" +
      '<p class="updated">' + esc(t("updated")) + " " + esc(it.updated) + "</p>" +
      "</article>";
  }

  function renderToc() {
    var html = '<ul><li><button type="button" class="ch" data-ch=""' + (state.chapter ? "" : ' aria-current="true"') + ">" +
      "<span>" + esc(t("allChapters")) + '</span><span class="n">' + esc(t("items")(items.length)) + "</span></button></li></ul>";
    groups.forEach(function (g) {
      html += '<div class="g">' + esc(name(g)) + "</div><ul>";
      chapters.filter(function (c) { return c.group === g.id; }).forEach(function (c) {
        var n = itemsOf(c.id).length;
        var right = n ? t("items")(n) : (t("status")[c.status] || "");
        html += '<li><button type="button" class="ch" data-ch="' + esc(c.id) + '"' + (state.chapter === c.id ? ' aria-current="true"' : "") + ">" +
          "<span>" + esc(name(c)) + '</span><span class="n">' + esc(right) + "</span></button></li>";
      });
      html += "</ul>";
    });
    document.getElementById("toc-body").innerHTML = html;
  }

  function render() {
    var shown = items.filter(matches);
    var active = filtersActive();
    var html = "";
    groups.forEach(function (g) {
      var section = "", waiting = [];
      chapters.filter(function (c) { return c.group === g.id && (!state.chapter || c.id === state.chapter); }).forEach(function (c) {
        var all = itemsOf(c.id);
        var mine = shown.filter(function (it) { return it.chapter === c.id; });
        if (mine.length) {
          section += '<section class="chapter" id="ch-' + esc(c.id) + '"><h3 class="chapter-title">' + esc(name(c)) + statusChip(c, all.length) + "</h3>" +
            '<p class="intro">' + esc(c.intro) + "</p>" + mine.map(card).join("") + "</section>";
        } else if (state.chapter && all.length === 0) {
          // A single empty chapter was picked: show its name, status and intro.
          section += '<div class="placeholder" id="ch-' + esc(c.id) + '"><span class="t">' + esc(name(c)) + "</span>" + statusChip(c, 0) +
            '<p class="intro">' + esc(c.intro) + " " + esc(t("noItems")) + "</p></div>";
        } else if (!active && all.length === 0) {
          waiting.push(c);
        }
      });
      if (waiting.length) {
        // Chapters without tips yet are listed compactly after the ones that have content.
        section += '<div class="waiting"><span class="waiting-label">' + esc(t("waiting")) + "</span>" +
          waiting.map(function (c) {
            return '<button type="button" class="ch-chip" id="ch-' + esc(c.id) + '" data-ch="' + esc(c.id) + '" title="' + esc(c.intro) + '">' +
              esc(name(c)) + statusChip(c, 0) + "</button>";
          }).join("") + "</div>";
      }
      if (section) html += '<h2 class="group">' + esc(name(g)) + "</h2>" + section;
    });
    document.getElementById("count").textContent = t("count")(shown.length, items.length);
    document.getElementById("reset").hidden = !(active || state.chapter);
    document.getElementById("list").innerHTML = html || '<p class="empty">' + esc(t("empty")) + "</p>";
    renderToc();
  }

  function fillSelect(id, options, current) {
    document.getElementById(id).innerHTML = options.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (o[0] === current ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    }).join("");
  }

  function applyTheme() {
    if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", state.theme);
    document.getElementById("theme-btn").textContent = t({ auto: "themeAuto", light: "themeLight", dark: "themeDark" }[state.theme]);
  }

  function applyLang() {
    document.documentElement.lang = state.lang === "en" ? "en" : "zh-Hant-TW";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) { el.placeholder = t(el.getAttribute("data-i18n-placeholder")); });
    document.getElementById("filters").setAttribute("aria-label", t("filtersLabel"));
    document.getElementById("toc").setAttribute("aria-label", t("tocLabel"));
    document.getElementById("content-note").hidden = state.lang !== "en";
    document.getElementById("lang-btn").textContent = t("langBtn");
    fillSelect("f-evidence", [["", t("all")], ["A", t("evA")], ["B", t("evB")], ["C", t("evC")]], state.evidence);
    fillSelect("f-money", [["", t("all")], ["free", t("free")], ["paid", t("paid")]], state.money);
    fillSelect("f-time", [["", t("all")], ["short", t("timeShort")], ["long", t("timeLong")]], state.time);
    applyTheme();
    render();
  }

  // On narrow screens start with the chapter list folded so tips are visible first.
  if (window.matchMedia && window.matchMedia("(max-width: 899px)").matches) {
    document.getElementById("toc-details").open = false;
  }

  document.getElementById("toc-body").addEventListener("click", function (e) {
    var b = e.target.closest("button.ch");
    if (!b) return;
    state.chapter = b.getAttribute("data-ch");
    render();
    if (window.matchMedia && window.matchMedia("(max-width: 899px)").matches) document.getElementById("toc-details").open = false;
    document.getElementById("filters").scrollIntoView({ block: "start" });
  });
  document.getElementById("list").addEventListener("click", function (e) {
    var b = e.target.closest("button.ch-chip");
    if (!b) return;
    state.chapter = b.getAttribute("data-ch");
    render();
    document.getElementById("filters").scrollIntoView({ block: "start" });
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  [["f-evidence", "evidence"], ["f-money", "money"], ["f-time", "time"]].forEach(function (p) {
    document.getElementById(p[0]).addEventListener("change", function (e) { state[p[1]] = e.target.value; render(); });
  });
  document.getElementById("reset").addEventListener("click", function () {
    state.q = state.evidence = state.money = state.time = state.chapter = "";
    document.getElementById("q").value = "";
    applyLang();
  });
  document.getElementById("lang-btn").addEventListener("click", function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    store("htlb-lang", state.lang);
    applyLang();
  });
  document.getElementById("theme-btn").addEventListener("click", function () {
    state.theme = { auto: "light", light: "dark", dark: "auto" }[state.theme];
    store("htlb-theme", state.theme);
    applyTheme();
  });

  applyLang();
})();
</script>
