  dt { margin-top: 4px; }

tro":"寫程式、做網站、接案時容易觸犯的刑事與民事責任。","order":22,"group":"work","status":"planned"},{"id":"legal-safety","title":"別把自己搭進去：法律與財產安全","title_en":"Protecting Yourself Legally","intro":"日常糾紛裡保護自己的法律工具與期限，別因不懂程序而吃虧。","order":23,"group":"law","status":"planned"},{"id":"legal-redlines","title":"普通人容易踩的法律紅線","title_en":"Everyday Legal Red Lines","intro":"一般人可能不知不覺觸犯的刑事與行政罰規定。","order":24,"group":"law","status":"planned"},{"id":"renting","title":"租屋","title_en":"Renting a Home","intro":"租屋前後的契約、押金、補貼與安全，房客和小房東各自的權利義務。","order":25,"group":"housing","status":"planned"},{"id":"home-buying","title":"買房","title_en":"Buying a Home","intro":"買預售屋或成屋前該查的資料、契約重點與貸款稅務。","order":26,"group":"housing","status":"planned"},{"id":"love-marriage","title":"戀愛和結婚","title_en":"Dating and Marriage","intro":"交往、結婚、離婚各階段的健康、財產與安全，以及法律怎麼保障你。","order":27,"group":"family","status":"planned"},{"id":"pregnancy","title":"懷孕和生產","title_en":"Pregnancy and Childbirth","intro":"從備孕到產後，公費產檢、孕期安全與該辦的假和給付。","order":28,"group":"family","status":"planned"},{"id":"newborn","title":"剛出生的孩子怎麼帶","title_en":"Caring for a Newborn","intro":"0–1 歲寶寶最重要的安全、疫苗與餵養重點，以及要立刻就醫的信號。","order":29,"group":"family","status":"planned"},{"id":"school-kids","title":"上學以後的孩子","title_en":"School-Age Children","intro":"學齡兒童與青少年的視力、牙齒、心理與安全，以及校園問題怎麼處理。","order":30,"group":"family","status":"planned"},{"id":"raising-kids","title":"養孩子的錢與時間","title_en":"The Cost of Raising Children","intro":"養孩子可領的津貼、可請的假，以及真實的金錢與時間成本。","order":31,"group":"family","status":"planned"},{"id":"elders","title":"家裡有長輩","title_en":"Caring for Older Family Members","intro":"長輩的法律安排、醫療決定、防詐與健康，在出事前先處理好。","order":32,"group":"family","status":"planned"},{"id":"ltc","title":"長照 2.0","title_en":"Long-Term Care 2.0","intro":"家人失能或失智時，怎麼申請長照服務、能用多少額度、要自付多少。","order":33,"group":"family","status":"planned"},{"id":"disability","title":"身心障礙之後怎麼活","title_en":"Living with Disability","intro":"取得身障證明後可用的補助、就業與教育資源，以及照顧者的支持。","order":34,"group":"family","status":"planned"},{"id":"after-death","title":"人走了以後要辦什麼","title_en":"After a Death in the Family","intro":"家人過世後要辦的證明、登記、給付、遺產與繼承，有哪些期限不能錯過。","order":35,"group":"family","status":"planned"},{"id":"travel","title":"出國旅行與境外安全","title_en":"Travel and Safety Abroad","intro":"出國前、在國外與回國時的安全、醫療、保險與入境規定。","order":36,"group":"living","status":"planned"},{"id":"study-abroad","title":"出國留學","title_en":"Studying Abroad","intro":"出國讀書前後要查的學歷認可、兵役、健保與當地身分規定。","order":37,"group":"living","status":"pending"},{"id":"time-energy","title":"別浪費時間與精力","title_en":"Saving Time and Energy","intro":"睡眠、專注、拖延與辦事效率，把時間和精力花在值得的地方。","order":38,"group":"living","status":"planned"},{"id":"leisure","title":"怎麼放鬆","title_en":"Relaxing Safely","intro":"娛樂場所與戶外活動的安全，以及有證據支持的減壓方式。","order":39,"group":"living","status":"planned"},{"id":"myths","title":"反面清單","title_en":"Things That Look Worth It but Aren't","intro":"看起來划算、但證據不支持或其實有害的常見做法。","order":40,"group":"living","status":"planned"}],"items":[{"id":"fraud-001","chapter":"fraud","title":"接到可疑的電話、訊息或投資邀約，先打 165 反詐騙諮詢專線查證","cost":{"money":"市話撥打免費；手機撥打時中華電信門號免費，其他電信每分鐘新臺幣 1 元（警政署常見問答，更新日期 2022-11-01）","time":"一通電話","effort":"低"},"plain":"覺得不對勁就先打 165 問，不用先確定是詐騙。已經被騙的人也可以直接打 165 報案，或在 165 全民防騙網先填好報案資料，再到派出所完成筆錄。","benefit":"警政署說明（更新日期 2022-11-01）：165 專線可以諮詢、檢舉或報案；也可以在 165 全民防騙網「我要報案」先預製筆錄，由專責人員轉介到民眾方便前往的派出所，接著完成筆錄。官方資料沒有提供「先打 165 能少損失多少錢」的數字，所以這裡不寫。","evidence":"A","caveats":"通話費率是警政署 2022-11-01 的說明，撥打時可能已經變動，以電信公司公告為準。網路預製筆錄之後，仍要到派出所完成手續。被騙之後要不要提告、怎麼追討款項，個案請諮詢律師或法律扶助等專業人士。","sources":[{"title":"內政部警政署常見問答：撥打165反詐騙諮詢專線需要通話費用嗎？受騙報案除可撥打165外，還有其他方式嗎？","url":"https://www.npa.gov.tw/ch/app/faq/view?module=faq&id=2144&serno=A1078837","type":"官方","checked":"2026-11-21"},{"title":"內政部警政署 165 全民防騙網","url":"https://165.npa.gov.tw/","type":"官方","checked":"2026-11-21"}],"status":"draft","updated":"2026-11-21"},{"id":"fraud-002","chapter":"fraud","title":"發現被騙就立刻報案，讓警方通知銀行圈存款項、把收款帳戶列為警示","cost":{"money":"不花錢","time":"一通電話加上到派出所做筆錄","effort":"低"},"plain":"錢匯出去之後，自己找銀行或找人「追回」都沒用，只有警方通報才能讓銀行把可疑款項圈存、凍結收款帳戶。越早報案，錢還留在帳戶裡的機會越大。","benefit":"刑事警察局（2026-01-31 公告）：民眾發現遭詐騙後，應第一時間向警方報案，警方會通報金融機構圈存可疑款項或警示帳戶；沒有透過公權力無法自行追回。《詐欺犯罪危害防制條例》（2026-01-21 修正版）第 9 條第 4 項規定司法警察機關可以通報金融機構把帳戶列為警示、暫停全部交易功能，第 10 條規定通報後的聯防與圈存。官方資料沒有給出「幾小時內報案能追回多少」的數字，所以這裡不寫。","evidence":"A","caveats":"報案不保證拿得回錢：款項如果已被提領或轉到境外，可能追不回。報案管道見 fraud-001（165 專線、165 全民防騙網預填筆錄、或直接到派出所）。法條可能修正，以全國法規資料庫最新條文為準。個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"刑事警察局公告：誤信國際律師與幣流師協追被詐款項 藥師再度遭詐百萬元（2026-01-31）","url":"https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=27a4218c-017e-4aca-93f3-097a0d05df1d","type":"官方","checked":"2026-11-22"},{"title":"全國法規資料庫：詐欺犯罪危害防制條例（修正日期 2026-01-21）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0080226","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-003","chapter":"fraud","title":"聽到「保證獲利」「穩賺不賠」，或被拉進 LINE 投資群組，就當成詐騙","cost":{"money":"不花錢","time":"查證約 10 分鐘","effort":"低"},"plain":"假投資會先讓你小賺幾筆，等你加碼後再用各種理由不讓你出金。投資前先查對方是不是金管會核准的合法業者，可以避開最常見、損失也最大的一種詐騙。","benefit":"刑事警察局（頁面更新 2026-11-20）：聽到「保證獲利」、「穩賺不賠」必定是詐騙；遇到加 LINE 進行投資必為詐騙；詐團常以「洗碼量不足、繳保證金、IP 異常」等理由拒絕出金。金管會（2026-02-17 新聞稿）：要求支付解凍金、保證金、驗證金或稅款才能出金是常見話術；合法證券期貨業者名單公布在官網「防範非法證券期貨業宣導專區」，也可撥證券期貨反詐欺諮詢專線 02-2737-3434 或 165 查證。","evidence":"B","caveats":"「LINE 投資群組必為詐騙」是警方依受理案件整理的提醒，不代表所有透過網路接觸的投資都違法，但合法與否一定要自己到金管會名單查。已經入金的人，不要再付任何「出金費用」，直接報案。投資本身有風險，個人投資決定請諮詢合法持牌的專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第二章 假投資","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a4f8d5ab-3d53-4d22-9411-031fddde7a4e","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：網路投資群組詐騙多，投資前先停看聽（2026-02-17）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202602130008&dtable=News","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：金管會提醒投資人勿信保證獲利等勸誘投資資訊，以避免受騙（2025-11-18）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202511180001&dtable=News","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-004","chapter":"fraud","title":"有人來電說「設定錯誤會重複扣款」要你操作 ATM 或買遊戲點數，直接掛斷","cost":{"money":"不花錢","time":"掛斷後自己查官方電話回撥，約 5 分鐘","effort":"低"},"plain":"ATM 只能提款和轉帳，不能解除分期或退款；遊戲點數也不能解除任何設定。對方就算說得出你的訂單明細，也可能是從被駭的購物網站拿到的。","benefit":"刑事警察局（頁面更新 2026-11-13）：ATM 只能「提款」與「轉帳」功能，不能解除分期付款或退款；遊戲點數只有儲值遊戲的功能，無法解除任何設定或身分識別。接到陌生來電或境外來電（開頭有 +）要提高警覺，不要因為對方能說出交易明細就相信；聽到「誤設為重複扣款」、「升級 VIP 會員」、「系統出錯」，應掛斷後自行查證或撥 165。","evidence":"B","caveats":"這是警方依受理案件整理的手法，詐團話術會變，但「要你操作 ATM、網銀或買點數來取消扣款」的模式不變。回撥時要用自己查到的官方客服電話，不要用對方給的號碼。已經轉帳的人請立刻報案；個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第三章 ATM解除分期付款詐騙","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a61af506-a4ac-49eb-9c79-ef75ddc6f237","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-005","chapter":"fraud","title":"網購不要跟賣家私下用 LINE 交易，遇到便宜得離譜的一頁式廣告先查證","cost":{"money":"不花錢","time":"下單前多查 5 分鐘","effort":"低"},"plain":"假網拍常用遠低於市價的熱門商品吸引人，再要你私下匯款；一頁式廣告則常標榜貨到付款，收到的卻是劣質品或根本沒訂的東西。選有第三方支付的平臺，可以保留爭議時止付的機會。","benefit":"刑事警察局（頁面更新 2026-10-22）：假網拍以明顯低於市價的價格誘引下單，並要求以 LINE 或 Messenger 私下交易，匯款後不出貨並失聯；建議透過面交或有第三方支付的網購平臺，避免私下聯繫交易，並可到經濟部網站查詢公司基本資料。行政院消費者保護會：一頁式廣告的特徵包括強調貨到付款、售價明顯低於行情、標榜 7 天鑑賞期、網址拼音奇特、未提供實體聯絡電話及地址；收到貨到付款包裹應儘速拆封驗貨，有問題聯絡寄件人或貨運業者，仍無法解決可到消保會網站線上申訴。（消保會頁面未標示日期。）","evidence":"B","caveats":"一頁式廣告不一定是詐騙，有些只是商品不符的消費糾紛，處理管道是消費申訴；若對方收錢後失聯，則屬詐騙，應報案。消保會頁面寫的「7 天鑑賞期」是賣家的宣傳話術，不是在說明法律規定。個案消費爭議可諮詢地方消費者服務中心等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第一章 假網拍詐騙","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=7e614f6f-df9b-4ae2-8293-ed384fb1a470","type":"官方","checked":"2026-11-22"},{"title":"行政院消費者保護會：「一頁式廣告」有哪些特徵？貨到付款後發現商品不符，怎麼辦？","url":"https://cpc.ey.gov.tw/Page/BC16ACF0BBB9CCC2/5922d66c-3c30-4418-8ce5-29a2f09b4185","type":"官方","checked":"2026-11-22"},{"title":"行政院消費者保護會：線上購物時，注意不同付款方式之權益保障不同","url":"https://cpc.ey.gov.tw/Page/1DCF8AA4D223F601/1a50ebaf-2998-4913-b9ec-943992fe5468","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-006","chapter":"fraud","title":"沒見過面的網友開口要錢或介紹投資，先停下來，要求視訊確認本人","cost":{"money":"不花錢","time":"一次視訊通話","effort":"低"},"plain":"假交友常盜用帥哥美女照片、假冒軍官或軍醫，培養感情後再以包裹關稅、結婚基金或投資為由要你匯款。只要網友提到錢，就先查證。","benefit":"刑事警察局（頁面更新 2026-11-20）：詐團盜用網路上的帥哥、美女照片，假冒戰地軍官、軍醫、聯合國官員，再以境外寄送包裹需要關稅、儲存結婚基金、介紹投資管道等方式要求匯款，直到被封鎖才知道受騙；建議不要向陌生網友透露太多個人資訊，網友要求匯錢時可要求開視訊確認本人身分，勿輕易交付金錢。","evidence":"B","caveats":"視訊也可能被 AI 換臉造假（見 fraud-008），所以視訊只能當成初步確認，涉及金錢時仍要多方查證。已經匯款的人可能會覺得難以啟齒，但越早報案越好。個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第四章 假愛情交友","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=064fe6c9-ae2c-40d2-a7df-2e5a4223091f","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-007","chapter":"fraud","title":"接到自稱檢警、健保局或電信公司的電話說你涉案，掛斷後自己查該單位電話回撥","cost":{"money":"不花錢","time":"一通回撥電話","effort":"低"},"plain":"假冒公務員的詐團會說你的身分被冒用、案件「偵查不公開」不能告訴家人，再傳假公文、要你「監管帳戶」。警察不會在電話中做筆錄，真的要你到案會寄通知書。","benefit":"刑事警察局（頁面更新 2026-10-22）：聽到「遭冒用身分」、「偵查不公開」、「接收法院偽造公文」、「監管帳戶」等關鍵字，就是假冒機構（公務員）詐騙；警察機關不會在電話中做筆錄；檢警調處理司法案件，會以通知書通知涉案人到案說明或至指定機關繳交款項。接到這類電話，先問對方單位、職稱、姓名，掛斷後再向該單位求證。","evidence":"B","caveats":"長輩是常見目標，可以事先和家中長輩講好「接到說涉案的電話，先掛斷打給家人或 165」。回撥時要用自己查到的機關總機，不要用對方給的電話。真的收到法院或地檢署文書而不確定真偽時，可親自向該機關查證，個案請諮詢律師等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第六章 假冒機構(公務員)","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=b7cf505d-f709-4885-b06b-d29b092ce04f","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-008","chapter":"fraud","title":"親友說換了新號碼、急著借錢，或視訊裡的臉看起來像本人，都先用舊號碼回撥確認","cost":{"money":"不花錢","time":"一通電話；和家人約定一句通關密語","effort":"低"},"plain":"「猜猜我是誰」會假冒兒女或老朋友，說換了手機，過幾天再借錢；現在還有 AI 換臉的視訊。用原本的電話回撥、問只有彼此知道的密語，可以擋下這類詐騙。","benefit":"刑事警察局（頁面更新 2026-11-20）：詐團假冒兒女、親戚或多年不見的友人，以換手機為由要你加新號碼或新 LINE，過幾天再以急用、周轉為由要求匯款；務必用舊有電話向本人確認，匯款帳戶名稱和親友本人不同時詐騙可能性大幅提高，可和親友約定專屬密語。警政署保安警察第三總隊（2024-04-01 發布、2026-11-11 更新）：AI 深偽可變臉成親友視訊，談到錢要存疑；可先撥親友原本的電話查證、請對方轉頭或在臉前揮手看畫面是否破綻，或請對方說出事先約定的通關密語。","evidence":"B","caveats":"AI 深偽技術進步很快，「轉頭、揮手」這類辨識方法可能會失效，最可靠的仍是用舊號碼回撥和事先約定的密語。這條特別適合幫家中長輩設定。若已經匯款，請立刻報案；個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第五章 猜猜我是誰","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=4f04dab6-3ca5-4139-a94e-66be03b62ba3","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署保安警察第三總隊防詐專區：AI 深偽技術變臉成親朋好友跟你視訊，如何分辨？","url":"https://www.3spc.npa.gov.tw/ch/app/data/view?module=govinfo&id=18710&serno=c059600e-9d0a-4d29-b1be-86ffec18502a","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-009","chapter":"fraud","title":"求職時被要求交出存摺、提款卡或網銀密碼，或先繳保證金、訓練費，就是詐騙","cost":{"money":"不花錢","time":"面試前查證公司，約 15 分鐘","effort":"低"},"plain":"假求職會用「設定薪資轉帳」騙走你的帳戶，或先收各種費用；境外高薪工作則可能讓人被拘禁、被迫做詐騙。查證公司、告訴家人行蹤，可以避免人財兩失，也避免帳戶被拿去收贓款而惹上官司。","benefit":"刑事警察局（頁面更新 2026-10-08）：假求職以設定薪資轉帳為名騙取金融帳戶及密碼，或向應徵者收取訂金、保證金、治裝費、訓練費；境外高薪工作的被害人可能被拘禁，帳戶被用來收詐騙款；合法公司不會以私人帳號發訊息徵才，切勿依指示申辦約定帳戶或交出網銀帳密；在國外遇急難可撥急難救助電話 0800-085095。保安警察第三總隊（2025-02-17 發布、2026-11-16 更新）：高薪海外工作的騙局以泰國、緬甸、柬埔寨為主，建議查證徵才公司是否合法立案、確認工作地點與內容、隨時告知國內親友行蹤。","evidence":"B","caveats":"因求職把帳戶交給別人，事後帳戶被列為警示時，不能用「誤設警示」的簡便程序解除（見 fraud-011），還可能觸犯《洗錢防制法》（見 fraud-010）。出國工作前可查外交部領事事務局的旅遊警示。勞動條件與契約問題可諮詢地方勞工局，法律個案請諮詢律師等專業人士。","sources":[{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第七章 假求職","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=87a85079-c42f-48cb-9506-14e08c912a39","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署保安警察第三總隊防詐專區：當心海外高薪工作、旅遊機會之詐騙陷阱","url":"https://www.3spc.npa.gov.tw/ch/app/data/view?module=govinfo&id=18710&serno=4884ecef-38ff-46b2-8420-d55c23e03d62","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-010","chapter":"fraud","title":"不要把帳戶、提款卡或網銀帳密借給別人，就算對方給錢或說是正當用途","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"把自己的帳戶交給別人用是違法的。第一次可能被警察「告誡」，但只要有收錢、交出 3 個以上帳戶，或 5 年內再犯，就會被判刑，名下帳戶也會被限制使用。","benefit":"《洗錢防制法》（2024-07-31 修正版）第 22 條：任何人不得將自己或他人的金融帳戶、虛擬資產或第三方支付帳號交付、提供給他人使用（符合一般商業、金融交易習慣，或基於親友間信賴關係等正當理由者除外）；違反者由警察機關裁處告誡；有收受對價、交付提供帳戶合計 3 個以上、或經告誡後 5 年內再犯之一者，處 3 年以下有期徒刑、拘役或科或併科新臺幣 100 萬元以下罰金；金融機構等應在一定期間內暫停、限制或關閉違反者的帳戶功能。","evidence":"A","caveats":"這條處罰的是「無正當理由交付帳戶」本身；如果帳戶被拿去收詐騙款，還可能另涉詐欺或洗錢的共犯責任，刑責更重。「正當理由」的範圍要依個案判斷。法條可能修正，以全國法規資料庫最新條文為準。已經交出帳戶的人，請儘快報案並諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"全國法規資料庫：洗錢防制法（修正日期 2024-07-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380131","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-011","chapter":"fraud","title":"帳戶被列為警示，先弄清楚期限與解除條件，再向原通報的警察單位申請","cost":{"money":"不花錢；可能要申請聯徵紀錄或判決書","time":"備齊文件後親自到警察機關一次","effort":"中"},"plain":"帳戶被列警示後，所有交易都會停止，你名下其他帳戶也會被限制網銀與提款卡功能。警示 2 年後會自動失效，但想提早解除，要拿出不起訴、無罪等證明，親自到原通報的警察單位申請。","benefit":"《存款帳戶及其疑似不法或顯屬異常交易管理辦法》（2026-08-31 修正版）：第 3 條定義警示帳戶與衍生管制帳戶（警示帳戶開戶人名下的其他帳戶）；第 5 條規定警示帳戶暫停全部交易功能，衍生管制帳戶暫停提款卡、語音轉帳、網路轉帳及其他電子支付功能，匯入款退回；第 9 條規定警示期限自通報時起算，逾 2 年自動失效，必要時可延長一次、以 1 年為限。刑事警察局常見問答（2021-10-12 發布、2026-11-20 更新）：除期滿自動解除外，可下載「民眾解除警示帳戶申請書」（2021-10-15 起適用），填寫一式二份並攜帶證明文件，親赴權責警察機關辦理；因求職、代辦貸款、租借帳戶等原因交出帳戶而遭警示者，不適用誤設警示的解除條款。","evidence":"A","caveats":"被冒名開戶的人，申請時需附身分證件與金融聯合徵信中心的信用報告。法規可能修正，以全國法規資料庫最新條文為準。帳戶被警示通常代表也可能被追查刑責，個案請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"全國法規資料庫：存款帳戶及其疑似不法或顯屬異常交易管理辦法（修正日期 2026-08-31）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380199","type":"法規","checked":"2026-11-22"},{"title":"內政部警政署刑事警察局常見問答：如何解除警示帳戶？","url":"https://www.cib.npa.gov.tw/ch/app/faq/view?module=faq&id=18233&serno=8eefc13f-6bf6-4532-b1ac-154167fe59d9","type":"官方","checked":"2026-11-22"},{"title":"刑事警察局：民眾解除警示帳戶申請書與填寫說明（2021-10-15 起適用）","url":"https://www.cib.npa.gov.tw/ch/app/data/doc?module=wg138&detailNo=1351096472531111936&type=s","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-012","chapter":"fraud","title":"不確定 LINE ID、網站或電話是不是詐騙，先上 165 全民防騙網或 165 LINE 官方帳號查詢","cost":{"money":"不花錢","time":"查詢約 1 分鐘","effort":"低"},"plain":"165 全民防騙網首頁的搜尋欄可以查境外帳戶、詐騙 LINE ID、假投資（博弈）網站、詐騙電話和高風險賣場。查到有紀錄就不要再聯絡。","benefit":"警政署保安警察第七總隊（2022-11-28 發布）：165 全民防騙網自 2022-11-21 起在首頁增設搜尋欄，可即時查詢境外帳戶、詐騙 LINE ID、假投資（博弈）網站、詐騙電話及高風險賣場等涉詐資訊。刑事警察局（頁面更新 2026-11-20）：「165防騙宣導」LINE 官方帳號及 165 全民防騙網可查詢詐騙 LINE ID、假投資（博弈）網站及詐騙電話。","evidence":"A","caveats":"查不到紀錄不代表安全：資料庫只收錄已經被通報的資料，詐團會不斷換新帳號與網址。查到可疑但還沒有紀錄的，可以打 165 諮詢。已經受騙的人，查詢不能取代報案；個案（要不要提告、怎麼和解或追討）請諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"內政部警政署保安警察第七總隊：165全民防騙網新增境外帳戶、詐騙LINE ID、假投資（博弈）網站、詐騙電話及高風險賣場等資料線上查詢功能（2022-11-28）","url":"https://www.7spc.npa.gov.tw/ch/app/news/view?module=news&id=2705&serno=4f1be6f9-3b4c-400f-a69d-ffd5c9945e04","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第二章 假投資","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a4f8d5ab-3d53-4d22-9411-031fddde7a4e","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署 165 全民防騙網","url":"https://165.npa.gov.tw/","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-013","chapter":"fraud","title":"自稱政府機關的簡訊，先看是不是從「111」發出、開頭有沒有你的手機末 3 碼和機關名稱","cost":{"money":"不花錢","time":"看一眼","effort":"低"},"plain":"政府機關透過「111」短碼發簡訊，只有加入平臺的機關能用這個號碼。從其他號碼發來、說你要繳費或補稅的「政府簡訊」，就要先查證。","benefit":"數位發展部（2023-10-24 新聞稿）：111 政府簡訊平臺當天啟用，只有透過此平臺的政府機關才可以使用 111 短碼發簡訊，民眾認明 111 短碼即可確認簡訊來自政府機關。數位發展部（2024-01-31 新聞稿）：111 簡訊內容必須署名發送機關或服務名稱，含網址時優先使用 gov.tw 網域。數位發展部（2025-06-17 新聞稿）：自 2025 年 6 月起，111 簡訊開頭新增接收者手機號碼末 3 碼及機關名稱，搭配來源號碼形成三層辨識。","evidence":"A","caveats":"官方資料沒有說所有政府簡訊都已改用 111，所以「不是 111 發的」不一定是假的，但這種簡訊更要用機關官網或總機查證，不要直接點簡訊裡的連結；涉及付款時，自己登入機關官方網站處理。帳號與個資相關爭議，個案請諮詢專業人士。","sources":[{"title":"數位發展部新聞稿：蔡總統啟動111政府簡訊平臺 數位部推動數位信任科技從源頭防詐（2023-10-24）","url":"https://moda.gov.tw/press/press-releases/8607","type":"官方","checked":"2026-11-22"},{"title":"數位發展部新聞稿：111政府簡訊已發逾400萬則 30機關響應降低民眾受詐風險（2024-01-31）","url":"https://moda.gov.tw/press/press-releases/10531","type":"官方","checked":"2026-11-22"},{"title":"數位發展部新聞稿：政府111簡訊防詐再升級 新增手機末三碼、機關具名辨識標記（2025-06-17）","url":"https://moda.gov.tw/press/press-releases/16458","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-014","chapter":"fraud","title":"網路貸款廣告要你「美化帳戶」「包裝金流」或先付代辦費，就是詐騙","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"缺錢時看到「保證核貸、信用不良可辦」的廣告，對方會說要先美化帳戶，騙你交出網銀帳密，再拿你的帳戶收贓款。結果借不到錢，名下所有帳戶還被列為警示。","benefit":"刑事警察局（2026-08-08 公告）：IG、FB 上的貸款廣告以「保證核貸、信用不良可辦」吸引民眾加 LINE，再稱需要先進行「帳戶美化」或「金流包裝」，要求提供網銀使用者代碼、密碼；案例中被害人名下所有金融帳戶均被列為警示帳戶與衍生管制帳戶。警方提醒：不要將金融卡、存摺、網銀帳號密碼或驗證碼交付他人，任何宣稱能美化帳戶、包裝金流或要求預先轉帳手續費、代辦費的信貸廣告，都極有可能是詐騙；有疑問撥 165 或 110。","evidence":"B","caveats":"真正需要借錢的人，可以直接向銀行等合法金融機構洽詢。因「代辦貸款」交出帳戶而被警示的人，不能用誤設警示的簡便程序解除（見 fraud-011），也可能涉及《洗錢防制法》第 22 條（見 fraud-010）。債務與法律個案請諮詢法律扶助基金會等專業人士。","sources":[{"title":"刑事警察局公告：網路找貸款？我來幫你「美化帳戶」缺錢調頭寸反被當成洗錢人頭戶（2026-08-08）","url":"https://www.cib.npa.gov.tw/ch/app/news/view?id=1887&amp=&module=news&amp=&serno=1812d90c-16f4-407c-acc2-047ef1514f2d","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-015","chapter":"fraud","title":"被騙後有「律師」「幣流分析師」說能幫你追回款項，不要相信，也不要再付錢","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"詐團會盯上已經被騙的人，假冒律師或追款專家，再騙一次。被騙的錢只能透過警方報案、司法程序追討，沒有人能私下「駭回來」或「贏回來」。","benefit":"刑事警察局（2026-01-31 公告）：案例中假投資被害人又被自稱國際律師、幣流分析師的人騙，對方稱可操縱博弈 App 後臺「贏回」款項，並煽動被害人抵押房地產加碼，再度被騙百萬元。警方提醒：千萬不要相信自稱可以協助追回詐騙款項的律師或幣流分析師；律師只能擔任訴訟代理人與檢、警和法院溝通；沒有透過公權力無法自行追回，應第一時間向警方報案，判決有罪才有可能追回詐騙款項。","evidence":"B","caveats":"依刑事警察局說明，律師只能擔任訴訟代理人與檢、警和法院溝通，不能繞過司法程序把錢追回來。《詐欺犯罪危害防制條例》另有被害人法律扶助、調解與訴訟費用減免的規定，個案請諮詢法律扶助基金會等專業人士。","sources":[{"title":"刑事警察局公告：誤信國際律師與幣流師協追被詐款項 藥師再度遭詐百萬元（2026-01-31）","url":"https://www.cib.npa.gov.tw/ch/app/news/view?module=news&id=1887&serno=27a4218c-017e-4aca-93f3-097a0d05df1d","type":"官方","checked":"2026-11-22"},{"title":"全國法規資料庫：詐欺犯罪危害防制條例（修正日期 2026-01-21）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0080226","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-016","chapter":"fraud","title":"有人叫你買虛擬貨幣來投資、繳費或「解凍」，先查對方是不是金管會公告完成洗錢防制登記的業者","cost":{"money":"不花錢","time":"查名單約 5 分鐘","effort":"低"},"plain":"假投資詐團常以虛擬通貨為名義吸引民眾（刑事警察局「假投資」一章）。在台灣合法提供虛擬資產服務的業者要向金管會完成洗錢防制登記，而且不能收現金。","benefit":"金管會（2025-09-22 新聞稿）：依 2024-11-30 施行的《洗錢防制法》新制，提供虛擬資產服務的業者應先向金管會完成洗錢防制登記，舊制業者須在 2025 年 9 月底前完成登記才能繼續營業；截至該新聞稿共 9 家完成登記，名單公布在證期局網站「VASP 專區」。金管會（2026-02-17 新聞稿）：合法虛擬資產服務商不得以現金向客戶收取款項，須以可留存金流軌跡的轉帳方式進行。","evidence":"A","caveats":"名單上的業者合法，不代表虛擬資產投資沒有風險，也不代表叫你去該平臺買幣再轉出的人是可信的；只要是陌生人或網友指示你買幣轉給他，就應先停下來打 165。9 家是 2025-09-22 的數字，請以證期局最新名單為準。投資決定請諮詢合法持牌的專業人士。","sources":[{"title":"金管會新聞稿：金管會公告完成洗錢防制登記之提供虛擬資產服務之事業或人員名單（2025-09-22）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202509220001&dtable=News","type":"官方","checked":"2026-11-22"},{"title":"金管會新聞稿：網路投資群組詐騙多，投資前先停看聽（2026-02-17）","url":"https://www.fsc.gov.tw/ch/home.jsp?id=96&parentpath=0%2C2&mcustomize=news_view.jsp&dataserno=202602130008&dtable=News","type":"官方","checked":"2026-11-22"},{"title":"內政部警政署刑事警察局：常見詐騙手法話術解析與因應之道－第二章 假投資","url":"https://www.cib.npa.gov.tw/ch/app/data/view?module=wg116&id=1909&serno=a4f8d5ab-3d53-4d22-9411-031fddde7a4e","type":"官方","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"fraud-017","chapter":"fraud","title":"別接「幫忙領錢、收包裹、轉帳」的工作，當車手或提供帳戶都可能被判刑","cost":{"money":"不花錢","time":"不用花時間","effort":"低"},"plain":"幫詐騙集團取款、轉帳的「車手」，或把帳戶交出去讓人收錢，都可能吃上官司。拒絕來路不明的「輕鬆工作」，就能避開刑責、前科和帳戶被限制。","benefit":"《中華民國刑法》第 339-4 條（全國法規資料庫現行條文，2026-11-22 查證）：犯詐欺罪而有冒用政府機關或公務員名義、三人以上共同犯之、以網際網路等傳播工具對公眾散布、或以電腦合成等科技方法製作他人不實影像聲音之一者，處 1 年以上 7 年以下有期徒刑，得併科 100 萬元以下罰金，未遂犯也罰。《詐欺犯罪危害防制條例》（2026-01-21 修正版）第 43 條：犯上述罪而使人交付的財物達新臺幣 100 萬元者，處 3 年以上 10 年以下有期徒刑；達 1,000 萬元者，處 5 年以上 12 年以下；達 1 億元者，處 7 年以上。《洗錢防制法》（2024-07-31 修正版）第 22 條：無正當理由把帳戶交給他人使用，先由警察裁處告誡；有收受對價、交付 3 個以上帳戶、或 5 年內再犯之一者，處 3 年以下有期徒刑、拘役或科或併科 100 萬元以下罰金（詳見 fraud-010）。","evidence":"A","caveats":"車手實際會依哪一條、哪個刑度處罰，要看是否知情、參與程度、詐騙金額與人數等個案事實，由法院判斷，這裡只列出法條本身。第 22 條另規定警察裁處告誡時，若知道當事人有社會救助需要，要通報社福機關協助。法條可能修正，以全國法規資料庫最新條文為準。已經被找去當車手或交出帳戶的人，請儘快諮詢律師或法律扶助基金會等專業人士。","sources":[{"title":"全國法規資料庫：中華民國刑法第 339-4 條","url":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=C0000001&flno=339-4","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：洗錢防制法第 22 條","url":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=G0380131&flno=22","type":"法規","checked":"2026-11-22"},{"title":"全國法規資料庫：詐欺犯罪危害防制條例（修正日期 2026-01-21）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0080226","type":"法規","checked":"2026-11-22"}],"status":"draft","updated":"2026-11-22"},{"id":"labor-001","chapter":"labor","title":"加班後可以選補休，但補休到期沒休完，雇主要照加班當天的標準付加班費","cost":{"money":"不花錢","time":"確認公司約定的特休年度和自己的補休紀錄，約 10 分鐘","effort":"低"},"plain":"加班要換補休還是領加班費，要你自己願意、雇主也同意才算，雇主不能片面規定只能補休。補休到期或離職時還沒休完的時數，雇主要換算成加班費付給你。","benefit":"勞動部說明（「加班補休規定」更新日期 2024-12-31；「勞動基準法權益簡介」更新日期 2026-01-01）：平日延長工時前 2 小時加給 1/3 以上，再延長 2 小時加給 2/3 以上；休息日出勤前 2 小時另再加給 1又1/3，第 3 至 8 小時另再加給 1又2/3，第 9 至 12 小時另再加給 2又2/3。補休最晚要在勞雇雙方約定的特別休假年度末日前休完，不能再往後延；沒休完的時數，依加班當天的工資計算標準發給工資。","evidence":"A","caveats":"只適用受勞動基準法保障的勞工，自己的工作適不適用，可以問勞動部或地方勞工局。補休期限以勞雇雙方約定的特休年度為準（曆年制、週年制等）。法令可能修正，以全國法規資料庫的最新條文為準。和雇主有爭議時，個案請諮詢地方勞工局或律師。","sources":[{"title":"勞動部：加班補休規定","url":"https://www.mol.gov.tw/1607/28162/28166/28180/28198/28202/47031/post","type":"官方","checked":"2026-11-21"},{"title":"勞動部：勞動基準法權益簡介","url":"https://www.mol.gov.tw/1607/28162/28166/28168/28170/28989/post","type":"官方","checked":"2026-11-21"}],"status":"draft","updated":"2026-11-21"}]}</script>

  function store(key, value) {

    return null;
  }

  var savedTheme = store("htlb-theme");
  var state = {
    lang: store("htlb-lang") === "en" ? "en" : "zh",

  };

  function t(key) { return I18N[state.lang][key]; }

  function chapterById(id) { for (var i = 0; i < chapters.length; i++) if (chapters[i].id === id) return chapters[i]; return null; }
  function itemsOf(id) { return items.filter(function (it) { return it.chapter === id; }); }

  // Money and time filters read the free-text cost fields, so they are approximate.
  function isFree(it) { return /^(不花錢|免費|0\s*元)/.test((it.cost || {}).money || ""); }
  function isQuick(it) {
    var s = (it.cost || {}).time || "";

  function filtersActive() { return !!(state.q.trim() || state.evidence || state.money || state.time); }

  function matches(it) {

    if (state.money === "free" && !isFree(it)) return false;

    if (!q) return true;
    var ch = chapterById(it.chapter) || {};
    var hay = [it.id, it.title, it.plain, it.benefit, it.caveats, ch.title, ch.title_en,
      (it.cost || {}).money, (it.cost || {}).time]
      .concat((it.sources || []).map(function (s) { return s.title; })).join(" ").toLowerCase();
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function statusChip(ch, count) {
    var key = ch.status;
    if (key === "done" || !t("status")[key]) return "";
    return '<span class="chip ' + esc(key) + '">' + esc(t("status")[key]) + "</span>";
  }

  function card(it) {
    var c = it.cost || {};
    var srcs = (it.sources || []).map(function (s) {
      return '<li><a href="' + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener noreferrer">' + esc(s.title) + "</a>" +
        '<div class="src-meta">' + esc(t("type")[s.type] || s.type) + " · " + esc(t("checked")) + " " + esc(s.checked) + "</div></li>";
    }).join("");
    var draft = it.status === "draft" ? '<span class="draft" title="' + esc(t("draftTitle")) + '">' + esc(t("draft")) + "</span>" : "";
    return '<article class="card" id="' + esc(it.id) + '">' +
      '<div class="meta"><span class="ev ev-' + esc(it.evidence) + '" title="' + esc(t("ev" + it.evidence)) + '">' + esc(t("evShort")[it.evidence] || it.evidence) + "</span>" +
      draft + '<span class="id">' + esc(it.id) + "</span></div>" +
      "<h4>" + esc(it.title) + "</h4>" +
      '<p class="plain">' + esc(it.plain) + "</p>" +
      "<dl><dt>" + esc(t("costMoney")) + "</dt><dd>" + esc(c.money) + "</dd>" +
      "<dt>" + esc(t("costTime")) + "</dt><dd>" + esc(c.time) + "</dd>" +
      "<dt>" + esc(t("costEffort")) + "</dt><dd>" + esc(t("effort")[c.effort] || c.effort) + "</dd></dl>" +
      '<p class="section-label">' + esc(t("benefit")) + '</p><p class="block">' + esc(it.benefit) + "</p>" +
      '<p class="section-label">' + esc(t("caveats")) + '</p><p class="block caveats">' + esc(it.caveats) + "</p>" +
      '<p class="section-label">' + esc(t("sources")) + '</p><ol class="sources">' + srcs + "</ol>" +
      '<p class="updated">' + esc(t("updated")) + " " + esc(it.updated) + "</p>" +
      "</article>";
  }

  function renderToc() {
    var html = '<ul><li><button type="button" class="ch" data-ch=""' + (state.chapter ? "" : ' aria-current="true"') + ">" +
      "<span>" + esc(t("allChapters")) + '</span><span class="n">' + esc(t("items")(items.length)) + "</span></button></li></ul>";
    groups.forEach(function (g) {
      html += '<div class="g">' + esc(name(g)) + "</div><ul>";
      chapters.filter(function (c) { return c.group === g.id; }).forEach(function (c) {
        var n = itemsOf(c.id).length;
        var right = n ? t("items")(n) : (t("status")[c.status] || "");
        html += '<li><button type="button" class="ch" data-ch="' + esc(c.id) + '"' + (state.chapter === c.id ? ' aria-current="true"' : "") + ">" +
          "<span>" + esc(name(c)) + '</span><span class="n">' + esc(right) + "</span></button></li>";
      });
      html += "</ul>";
    });
    document.getElementById("toc-body").innerHTML = html;
  }

  function render() {
    var shown = items.filter(matches);
    var active = filtersActive();
    var html = "";
    groups.forEach(function (g) {
      var section = "", waiting = [];
      chapters.filter(function (c) { return c.group === g.id && (!state.chapter || c.id === state.chapter); }).forEach(function (c) {
        var all = itemsOf(c.id);
        var mine = shown.filter(function (it) { return it.chapter === c.id; });
        if (mine.length) {
          section += '<section class="chapter" id="ch-' + esc(c.id) + '"><h3 class="chapter-title">' + esc(name(c)) + statusChip(c, all.length) + "</h3>" +
            '<p class="intro">' + esc(c.intro) + "</p>" + mine.map(card).join("") + "</section>";
        } else if (state.chapter && all.length === 0) {
          // A single empty chapter was picked: show its name, status and intro.
          section += '<div class="placeholder" id="ch-' + esc(c.id) + '"><span class="t">' + esc(name(c)) + "</span>" + statusChip(c, 0) +
            '<p class="intro">' + esc(c.intro) + " " + esc(t("noItems")) + "</p></div>";
        } else if (!active && all.length === 0) {
          waiting.push(c);
        }
      });
      if (waiting.length) {
        // Chapters without tips yet are listed compactly after the ones that have content.
        section += '<div class="waiting"><span class="waiting-label">' + esc(t("waiting")) + "</span>" +
          waiting.map(function (c) {
            return '<button type="button" class="ch-chip" id="ch-' + esc(c.id) + '" data-ch="' + esc(c.id) + '" title="' + esc(c.intro) + '">' +
              esc(name(c)) + statusChip(c, 0) + "</button>";
          }).join("") + "</div>";
      }
      if (section) html += '<h2 class="group">' + esc(name(g)) + "</h2>" + section;
    });
    document.getElementById("count").textContent = t("count")(shown.length, items.length);
    document.getElementById("reset").hidden = !(active || state.chapter);
    document.getElementById("list").innerHTML = html || '<p class="empty">' + esc(t("empty")) + "</p>";
    renderToc();
  }

  function fillSelect(id, options, current) {
    document.getElementById(id).innerHTML = options.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (o[0] === current ? " selected" : "") + ">" + esc(o[1]) + "</option>";
    }).join("");
  }

  function applyTheme() {
    if (state.theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", state.theme);
    document.getElementById("theme-btn").textContent = t({ auto: "themeAuto", light: "themeLight", dark: "themeDark" }[state.theme]);
  }

  function applyLang() {
    document.documentElement.lang = state.lang === "en" ? "en" : "zh-Hant-TW";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = t(el.getAttribute("data-i18n-html")); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) { el.placeholder = t(el.getAttribute("data-i18n-placeholder")); });
    document.getElementById("filters").setAttribute("aria-label", t("filtersLabel"));
    document.getElementById("toc").setAttribute("aria-label", t("tocLabel"));
    document.getElementById("content-note").hidden = state.lang !== "en";
    document.getElementById("lang-btn").textContent = t("langBtn");
    fillSelect("f-evidence", [["", t("all")], ["A", t("evA")], ["B", t("evB")], ["C", t("evC")]], state.evidence);
    fillSelect("f-money", [["", t("all")], ["free", t("free")], ["paid", t("paid")]], state.money);
    fillSelect("f-time", [["", t("all")], ["short", t("timeShort")], ["long", t("timeLong")]], state.time);
    applyTheme();
    render();
  }

  // On narrow screens start with the chapter list folded so tips are visible first.
  if (window.matchMedia && window.matchMedia("(max-width: 899px)").matches) {
    document.getElementById("toc-details").open = false;
  }

  document.getElementById("toc-body").addEventListener("click", function (e) {
    var b = e.target.closest("button.ch");
    if (!b) return;
    state.chapter = b.getAttribute("data-ch");
    render();
    if (window.matchMedia && window.matchMedia("(max-width: 899px)").matches) document.getElementById("toc-details").open = false;
    document.getElementById("filters").scrollIntoView({ block: "start" });
  });
  document.getElementById("list").addEventListener("click", function (e) {
    var b = e.target.closest("button.ch-chip");
    if (!b) return;
    state.chapter = b.getAttribute("data-ch");
    render();
    document.getElementById("filters").scrollIntoView({ block: "start" });
  });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  [["f-evidence", "evidence"], ["f-money", "money"], ["f-time", "time"]].forEach(function (p) {
    document.getElementById(p[0]).addEventListener("change", function (e) { state[p[1]] = e.target.value; render(); });
  });
  document.getElementById("reset").addEventListener("click", function () {
    state.q = state.evidence = state.money = state.time = state.chapter = "";
    document.getElementById("q").value = "";
    applyLang();
  });
  document.getElementById("lang-btn").addEventListener("click", function () {
    state.lang = state.lang === "zh" ? "en" : "zh";
    store("htlb-lang", state.lang);
    applyLang();
  });
  document.getElementById("theme-btn").addEventListener("click", function () {
    state.theme = { auto: "light", light: "dark", dark: "auto" }[state.theme];
    store("htlb-theme", state.theme);
    applyTheme();
  });

  applyLang();
})();
</script>
</body>
</html>
